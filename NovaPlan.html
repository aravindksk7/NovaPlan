        el.filterSelect.value = state.view.filter;
        el.groupSelect.value = state.view.group;
        el.mainLayout.classList.remove("view-grid", "view-gantt", "view-board", "view-sprint", "view-dashboard", "view-workload", "view-raid", "view-portfolio");
        if (state.view.mode !== "split") el.mainLayout.classList.add(`view-${state.view.mode}`);
        this.updateSavedViewOptions();

        const isPort = state.view.mode === "portfolio";
        el.filterSelect.disabled = isPort;
        el.groupSelect.disabled = isPort;
        el.savedViewSelect.disabled = isPort;
        el.newTask.disabled = isPort;
        el.template.disabled = isPort;

      updateMenuOptions() {
        const mode = state.view.mode;
        const isPort = mode === "portfolio";
        el.toolsMenuBtn.disabled = isPort;
        el.exportMenuBtn.disabled = isPort;

        if (isPort) return;

        // Update Tools Menu options
        // Most items are visible in all views; only hide Gantt-specific items when not in Gantt/Split
        const toolButtons = el.toolsMenu.querySelectorAll("[data-tool]");
        for (const btn of toolButtons) {
          const tool = btn.dataset.tool;
          let visible = true;

          // Only hide these specific items in views where they truly don't apply
          if (tool === "gantt-labels" && mode !== "split" && mode !== "gantt") visible = false;
          else if (tool === "gantt-lines" && mode !== "split" && mode !== "gantt") visible = false;
          else if (tool === "choose-columns" && mode !== "split" && mode !== "sprint" && mode !== "grid") visible = false;

          // All other items are always visible regardless of view mode
          btn.style.display = visible ? "block" : "none";
        }

        // Update Export Menu options
        const exportButtons = el.exportMenu.querySelectorAll("[data-export]");
        for (const btn of exportButtons) {
          const exp = btn.dataset.export;
          let visible = true;
          if (exp === "gif") visible = (mode === "split" || mode === "gantt");
          else if (exp === "csv" || exp === "excel") visible = (mode !== "portfolio");
          else if (exp === "jira-csv") visible = (mode !== "portfolio");
          else if (exp === "project-xml") visible = (mode !== "portfolio");
          else if (exp === "sql") visible = (mode !== "portfolio");

          btn.style.display = visible ? "block" : "none";
        }
      },
      updateSavedViewOptions() {
        const current = el.savedViewSelect.value;
        el.savedViewSelect.replaceChildren();
        const first = document.createElement("option");

    const BoardView = {
      render(tasks) {
        const boardTasks = tasks.filter(task => !task.is_summary);
        const groupKey = state.view.mode === "sprint" ? "sprint" : state.view.group === "none" ? "status" : state.view.group;
        const groups = this.buildGroups(boardTasks, groupKey);
        el.boardTitle.textContent = state.view.mode === "sprint" ? "Sprint View" : "Board View";
        if (state.view.mode === "sprint") {
          const hours = boardTasks.reduce((sum, task) => sum + durationHours(task), 0);
          const resources = new Set(boardTasks.map(task => task.resource).filter(Boolean));
          el.boardSummary.textContent = `${formatNumber(hours)}h, ${resources.size} resources`;
        } else {
          el.boardSummary.textContent = `${groups.length} groups`;
        }
        const wrap = document.createElement("div");
        wrap.className = "board-columns";
        for (const group of groups) wrap.appendChild(this.renderColumn(groupKey, group));
        if (!groups.length) {
          const empty = document.createElement("div");
          empty.className = "p-6 text-sm text-slate-400";
          empty.textContent = "No tasks match this view";
          el.board.replaceChildren(empty);
          return;
        }
        el.board.replaceChildren(wrap);
      },
      buildGroups(tasks, groupKey) {
        const fixed = {
          status: TASK_STATUSES.map(value => ({ value, label: value })),
          priority: TASK_PRIORITIES.map(value => ({ value, label: value })),
          sprint: [{ value: "", label: "Backlog" }, ...state.sprints.map(sprint => ({ value: String(sprint.id), label: `${sprint.name} (${sprint.start_date} to ${sprint.end_date})` }))],
          task_type: Object.keys(TaskTypes).map(value => ({ value, label: `${value} ${TaskTypes[value].label}` })),
          slippage_status: [
            { value: "", label: "On track" },
            { value: "at-risk", label: "At risk" },
            { value: "slipped", label: "Slipped" }
          ]
        };
        const definitions = fixed[groupKey] || [...new Set(tasks.map(task => ViewSystem.groupValue(task, groupKey)))]
          .sort((a, b) => ViewSystem.groupLabel({ [groupKey]: a, resource: a }, groupKey).localeCompare(ViewSystem.groupLabel({ [groupKey]: b, resource: b }, groupKey)))
          .map(value => ({ value, label: value || "Unassigned" }));
        return definitions.map(group => ({
          ...group,
          tasks: sortTasksByWbs(tasks.filter(task => ViewSystem.groupValue(task, groupKey) === group.value))
        })).filter(group => group.tasks.length || ["status", "priority", "sprint"].includes(groupKey));
      },
      renderColumn(groupKey, group) {
        const column = document.createElement("section");
        column.className = "board-column";
        column.dataset.groupKey = groupKey;
        column.dataset.groupValue = group.value;
        const title = document.createElement("div");
        title.className = "board-column-title";
        const label = document.createElement("span");
        label.textContent = group.label;
        const count = document.createElement("span");
        count.textContent = String(group.tasks.length);
        title.append(label, count);
        column.appendChild(title);
        for (const task of group.tasks) column.appendChild(this.renderCard(task));
        return column;
      },
      renderCard(task) {
        const card = document.createElement("article");
        card.className = `board-card ${task.slippage_status || ""}`;
        card.draggable = true;
        card.tabIndex = 0;
        card.dataset.taskId = task.id;
        card.style.borderLeftColor = task.color || TaskTypes[task.task_type]?.color || "var(--neon-blue)";
        const title = document.createElement("div");
        title.className = "board-card-title";
        title.textContent = `${task.wbs_code} ${task.title}`;
        const meta = document.createElement("div");
        meta.className = "board-card-meta";
        for (const value of [
          task.status,
          task.priority,
          task.sprint_name || "Backlog",
          task.resource || "Unassigned",
          task.is_milestone ? "Milestone" : "",
          task.has_baseline_variance ? "Variance" : "",
          `${task.progress}%`
        ].filter(Boolean)) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = value;
          meta.appendChild(badge);
        }
        card.append(title, meta);
        return card;
      },
      async handleDrop(event) {
        const column = event.target.closest(".board-column");
        if (!column) return;
        event.preventDefault();
        const taskId = Number(event.dataTransfer.getData("text/plain"));
        const task = findTask(taskId);
        if (!task) return;
        const groupKey = column.dataset.groupKey;
        const value = column.dataset.groupValue;
        const fields = this.dropFields(groupKey, value, task);
        if (!fields) {
          showToast("This group is read-only", "warning");
          return;
        }
        await state.storage.updateTask(task.id, fields);
        await AppShell.refresh();
      },
      dropFields(groupKey, value, task) {
        if (groupKey === "status") return fieldsForStatus(value, task);
        if (groupKey === "priority") return { priority: value };
        if (groupKey === "sprint") return { sprint_id: value ? Number(value) : null };
        if (groupKey === "resource") return { resource: value };
        if (groupKey === "task_type") return { task_type: TaskTypes[value] ? value : DEFAULT_TYPE };
        return null;
      }
    };

    const DashboardView = {
      render(tasks) {
        const leafTasks = tasks.filter(task => !task.is_summary);
        const workload = WorkloadView.rows(leafTasks);
        const overloaded = workload.filter(row => row.overallocated_days > 0);
        const finishDates = leafTasks.map(task => task.end_date).filter(isValidIsoDate).sort();
        const metrics = [
          ["Total Tasks", leafTasks.length],
          ["Critical Tasks", leafTasks.filter(task => task.is_critical).length],
          ["Near Critical", leafTasks.filter(task => task.is_near_critical).length],
          ["Slipped", leafTasks.filter(task => task.slippage_status === "slipped").length],
          ["At Risk", leafTasks.filter(task => task.slippage_status === "at-risk").length],
          ["Baseline Variance", leafTasks.filter(task => task.has_baseline_variance).length],
          ["Overloaded Resources", overloaded.length],
          ["Open RAID Items", state.raidItems.filter(item => item.status !== "Closed").length],
          ["Actual Work", `${formatNumber(leafTasks.reduce((sum, task) => sum + Number(task.actual_hours || 0), 0))}h`],
          ["Remaining Work", `${formatNumber(leafTasks.reduce((sum, task) => sum + Number(task.remaining_hours || 0), 0))}h`],

          l.className = "metric-label";

    const WorkloadView = {
      rows(tasks) {
        const byResource = new Map();
        for (const task of tasks.filter(task => !task.is_summary)) {
          const resource = task.resource || "Unassigned";
          if (!byResource.has(resource)) byResource.set(resource, { resource, total_hours: 0, task_count: 0, allocation: new Map() });
          const row = byResource.get(resource);
          row.total_hours += durationHours(task);
          row.task_count++;
          if (!isValidIsoDate(task.start_date) || !isValidIsoDate(task.end_date)) continue;
          const days = Math.max(1, workingDaysBetween(task.start_date, task.end_date));
          const hoursPerDay = durationHours(task) / days;
          for (let i = 0; i <= daysBetween(task.start_date, task.end_date); i++) {
            const date = addDays(task.start_date, i);
            if (!isWorkingDate(date)) continue;
            row.allocation.set(date, Number(row.allocation.get(date) || 0) + hoursPerDay);
          }
        }
        return [...byResource.values()].map(row => {
          const daily = [...row.allocation.values()];
          const maxDay = daily.length ? Math.max(...daily) : 0;
          return {
            ...row,
            total_hours: Math.round(row.total_hours * 100) / 100,
            max_daily_hours: Math.round(maxDay * 100) / 100,
            overallocated_days: daily.filter(hours => hours > workingHoursPerDay()).length
          };
        }).sort((a, b) => b.overallocated_days - a.overallocated_days || b.total_hours - a.total_hours);
      },
      render(tasks) {
        const rows = this.rows(tasks);
        el.boardTitle.textContent = "Resource Workload";
        el.boardSummary.textContent = `${rows.length} resources`;
        const table = document.createElement("table");
        table.className = "analysis-table";
        table.innerHTML = "<thead><tr><th>Resource</th><th>Tasks</th><th>Total Hours</th><th>Max Daily Load</th><th>Overallocated Days</th></tr></thead>";
        const tbody = document.createElement("tbody");
        for (const row of rows) {
          const tr = document.createElement("tr");
          appendCells(tr, [row.resource, row.task_count, `${formatNumber(row.total_hours)}h`, `${formatNumber(row.max_daily_hours)}h / ${formatNumber(workingHoursPerDay())}h`, row.overallocated_days]);
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        el.board.replaceChildren(table);
      }
    };

    const AppShell = {

        try {
          state.activeProject = localStorage.getItem("novaplan_active_project") || "Default Project";
          state.storage = await StorageEngine.init();
          const modeIcon = { OPFS: "💾", IndexedDB: "🗄️", localStorage: "⚠️", "In-Memory": "🔴" };
          el.status.textContent = `${modeIcon[state.storage.mode] ?? "🔴"} ${state.storage.mode}`;
          if (state.storage.persistWarning) {
            el.warning.textContent = state.storage.persistWarning;

        el.newTask.addEventListener("click", () => this.addRootTask());

        el.searchInput.addEventListener("input", () => {

        el.ganttBody.addEventListener("scroll", () => {

        el.ganttBody.addEventListener("mousedown", event => {

        el.ganttBody.addEventListener("mousemove", event => {
          const bar = event.target.closest(".gantt-bar");
          if (!bar) return;

            GanttChart.tooltip(task, event);
            if (task.is_summary || task.is_milestone) {

              const rect = bar.getBoundingClientRect();
              const clickX = event.clientX - rect.left;
              if (clickX < 8 || rect.width - clickX < 8) {
                bar.style.cursor = "col-resize";
              } else {
                bar.style.cursor = "move";
              }
            }
          }
        });
        el.ganttBody.addEventListener("click", event => {

      ganttZoomIn() {
        if (state.ganttZoomIdx < GANTT_ZOOM_LEVELS.length - 1) {
          state.ganttZoomIdx++;
          this.updateGanttZoomUI();
          GanttChart.render(state.visibleTasks);

      ganttZoomOut() {

      async handleTemplateSelect() {

      async manageConditionalFormatting() {
        const rules = getConditionalRules();
        const fields = [];
        for (const rule of rules) {
          fields.push({
            name: `${rule.id}_enabled`,
            label: `${rule.label} (Enable)`,
            type: "select",
            value: rule.enabled ? "true" : "false",
            options: [
              { value: "true", label: "Enabled" },
              { value: "false", label: "Disabled" }
            ]
          });
          fields.push({
            name: `${rule.id}_color`,
            label: `Background Color`,
            type: "color",
            value: rule.color
          });
          fields.push({
            name: `${rule.id}_textColor`,
            label: `Text Color`,
            type: "color",
            value: rule.textColor
          });
        }

        const res = await showFormDialog({
          title: "Conditional Formatting Rules",
          fields: fields
        });

        if (res) {
          const updatedRules = rules.map(rule => {
            return {
              ...rule,
              enabled: res[`${rule.id}_enabled`] === "true",
              color: res[`${rule.id}_color`],
              textColor: res[`${rule.id}_textColor`]
            };
          });
          state.settings.conditionalRules = updatedRules;
          await state.storage.saveSetting("conditionalRules", updatedRules);
          await AppShell.refresh();
          showToast("Conditional formatting rules saved", "success");
        }
      },

      async compareScenario() {
        if (!state.scenarios.length) return showToast("No scenarios saved yet", "warning");
        const scenarioOptions = state.scenarios.map((scenario, index) => ({
          value: String(index + 1),
          label: `${index + 1}. ${scenario.name}`
        }));
        const res = await showFormDialog({
          title: "Compare Scenario",
          fields: [
            { name: "choice", label: "Compare against which scenario?", type: "select", value: "1", options: scenarioOptions }
          ]
        });
        if (res == null) return;
        const choice = res.choice;
        const scenario = state.scenarios[Number(choice) - 1] || state.scenarios.find(item => item.name.toLowerCase() === choice.toLowerCase());
        if (!scenario) return showToast("Scenario not found", "error");
        const byId = new Map(scenario.snapshot.map(task => [Number(task.id), task]));
        const currentFinish = state.tasks.map(task => task.end_date).filter(isValidIsoDate).sort().at(-1) || "";
        const scenarioFinish = scenario.snapshot.map(task => task.end_date).filter(isValidIsoDate).sort().at(-1) || "";
        const changed = state.tasks.filter(task => {
          const before = byId.get(task.id);
          return before && (before.start_date !== task.start_date || before.end_date !== task.end_date || Number(before.duration_hours || 0) !== Number(task.duration_hours || 0) || Number(before.progress || 0) !== Number(task.progress || 0));
        });
        await showConfirmDialog({
          title: "Scenario comparison",
          body: `${scenario.name}\nScenario finish: ${scenarioFinish || "-"}\nCurrent finish: ${currentFinish || "-"}\nFinish variance: ${scenarioFinish && currentFinish ? `${daysBetween(scenarioFinish, currentFinish)}d` : "-"}\nChanged tasks: ${changed.length}`,
          buttons: [{ label: "Close", value: true, variant: "primary" }]
        });
      },

      async resetDatabase() {
        const confirmed = await showConfirmDialog({
          title: "Reset All Data",
          body: "This will permanently delete ALL project data — tasks, sprints, baselines, RAID items, scenarios, saved views, and settings.\n\nThis will also clear IndexedDB, localStorage, and any OPFS storage for this app.\n\nThis action cannot be undone. Export a SQL backup first if you need to preserve your data.",
          buttons: [
            { label: "Cancel", value: false },
            { label: "Delete Everything", value: true, variant: "danger" }
          ]
        });
        if (!confirmed) return;

        const confirmed2 = await showConfirmDialog({
          title: "Are you absolutely sure?",
          body: "You are about to erase all NovaPlan data permanently.\n\nClick 'Reset Now' to proceed.",
          buttons: [
            { label: "Go Back", value: false },
            { label: "Reset Now", value: true, variant: "danger" }
          ]
        });
        if (!confirmed2) return;

        try {
          // Wipe all tables in the active SQLite DB
          await state.storage.transact(async () => {
            for (const tbl of ["tasks", "dependencies", "sprints", "baseline_meta", "baseline_tasks", "saved_views", "scenarios", "raid_items", "change_logs", "project_settings"]) {
              state.storage.db.run(`DELETE FROM ${tbl}`);
            }
          });

          // Clear IndexedDB (regardless of active storage mode)
          await idbDeleteDatabase();

          // Clear localStorage fallback
          try { localStorage.removeItem(LOCAL_STORAGE_KEY); } catch {}

          // Clear OPFS file by writing empty bytes (if file handle exists)
          if (state.storage.fileHandle) {
            try {
              const writable = await state.storage.fileHandle.createWritable();
              await writable.write(new Uint8Array(0));
              await writable.close();
            } catch {}
          }

          state.selectedIds.clear();
          state.collapsedIds.clear();
          state.ganttZoomIdx = 3;
          await this.refresh();
          showToast("All data has been reset successfully", "success");
        } catch (err) {
          showToast(`Reset failed: ${err.message}`, "error");
        }
      },

    function showConfirmDialog({ title, body, buttons }) {
      return new Promise(resolve => {
        el.modal.replaceChildren();
        const box = document.createElement("div");
        box.className = "modal-box";
        box.setAttribute("role", "dialog");
        box.setAttribute("aria-modal", "true");
        box.setAttribute("aria-labelledby", "modal-title");
        const head = document.createElement("div");
        head.className = "modal-head";
        const h = document.createElement("h2");
        h.id = "modal-title";
        h.className = "font-semibold";
        h.textContent = title;
        head.appendChild(h);
        const content = document.createElement("div");
        content.className = "modal-body";
        content.textContent = body;
        const foot = document.createElement("div");
        foot.className = "modal-foot";
        for (const spec of buttons) {
          const btn = document.createElement("button");
          btn.textContent = spec.label;
          if (spec.variant === "danger") btn.className = "danger";
          if (spec.variant === "primary") btn.className = "primary";
          btn.addEventListener("click", () => close(spec.value));
          foot.appendChild(btn);
        }
        box.append(head, content, foot);
        el.modal.appendChild(box);
        el.modal.classList.add("show");
        el.modal.setAttribute("aria-hidden", "false");
        const focusables = () => [...box.querySelectorAll("button")];
        const close = value => {
          el.modal.classList.remove("show");
          el.modal.setAttribute("aria-hidden", "true");
          el.modal.replaceChildren();
          document.removeEventListener("keydown", trap);
          resolve(value);
        };
        const trap = event => {
          if (event.key === "Escape") close(buttons[0]?.value);
          if (event.key !== "Tab") return;
          const nodes = focusables();
          const first = nodes[0];
          const last = nodes.at(-1);
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        };
        document.addEventListener("keydown", trap);
        setTimeout(() => focusables().at(-1)?.focus(), 0);
      });
    }

    function showFormDialog({ title, fields, onSubmit }) {
      return new Promise(resolve => {
        el.modal.replaceChildren();
        const box = document.createElement("div");
        box.className = "modal-box";
        box.setAttribute("role", "dialog");
        box.setAttribute("aria-modal", "true");
        box.setAttribute("aria-labelledby", "modal-title");

        const head = document.createElement("div");
        head.className = "modal-head";
        const h = document.createElement("h2");
        h.id = "modal-title";
        h.className = "font-semibold";
        h.textContent = title;
        head.appendChild(h);

        const content = document.createElement("div");
        content.className = "modal-body";
        content.style.cssText = "display:grid;gap:14px";

        const inputs = {};

        fields.forEach(field => {
          const wrapper = document.createElement("div");
          wrapper.style.cssText = "display:flex;flex-direction:column;gap:6px";

          const label = document.createElement("label");
          label.style.cssText = "color:var(--text-primary);font-size:13px;font-weight:600";
          label.textContent = field.label;
          wrapper.appendChild(label);

          if (field.type === "select") {
            const select = document.createElement("select");
            select.style.cssText = "width:100%;height:34px;border-radius:6px;padding:0 8px;background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border)";
            field.options.forEach(opt => {
              const o = document.createElement("option");
              o.value = opt.value;
              o.textContent = opt.label;
              select.appendChild(o);
            });
            select.value = field.value || "";
            inputs[field.name] = select;
            wrapper.appendChild(select);
          } else if (field.type === "textarea") {
            const textarea = document.createElement("textarea");
            textarea.rows = field.rows || 3;
            textarea.style.cssText = "width:100%;border-radius:6px;padding:8px 10px;background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border);resize:vertical";
            textarea.value = field.value || "";
            if (field.placeholder) textarea.placeholder = field.placeholder;
            inputs[field.name] = textarea;
            wrapper.appendChild(textarea);
          } else if (field.type === "checkbox-group") {
            const groupWrap = document.createElement("div");
            groupWrap.style.cssText = "display:grid;grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));gap:8px;margin-top:4px";
            const checkedValues = new Set((field.value || []).map(String));
            const checks = [];
            field.options.forEach(opt => {
              const lbl = document.createElement("label");
              lbl.style.cssText = "display:flex;align-items:center;gap:6px;font-size:13px;font-weight:normal;color:var(--text-muted);cursor:pointer";
              const chk = document.createElement("input");
              chk.type = "checkbox";
              chk.value = opt.value;
              chk.checked = checkedValues.has(String(opt.value));
              lbl.append(chk, document.createTextNode(opt.label));
              groupWrap.appendChild(lbl);
              checks.push({ chk, value: opt.value });
            });
            inputs[field.name] = {
              get value() {
                return checks.filter(c => c.chk.checked).map(c => c.value);
              }
            };
            wrapper.appendChild(groupWrap);
          } else {
            const input = document.createElement("input");
            input.type = field.type || "text";
            input.style.cssText = "width:100%;height:34px;border-radius:6px;padding:0 10px;background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border)";
            input.value = field.value !== undefined ? field.value : "";
            if (field.placeholder) input.placeholder = field.placeholder;
            if (field.min !== undefined) input.min = field.min;
            if (field.max !== undefined) input.max = field.max;
            inputs[field.name] = input;
            wrapper.appendChild(input);
          }

          content.appendChild(wrapper);
        });

        const foot = document.createElement("div");
        foot.className = "modal-foot";
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.textContent = "Cancel";
        cancel.addEventListener("click", () => close(null));
        const submit = document.createElement("button");
        submit.type = "button";
        submit.className = "primary";
        submit.textContent = "OK";

        const doSubmit = () => {
          const res = {};
          for (const key in inputs) {
            res[key] = inputs[key].value;
          }
          if (onSubmit) {
            const error = onSubmit(res);
            if (error) {
              showToast(error, "error");
              return;
            }
          }
          close(res);
        };

        submit.addEventListener("click", doSubmit);
        foot.append(cancel, submit);

        box.append(head, content, foot);
        el.modal.appendChild(box);
        el.modal.classList.add("show");
        el.modal.setAttribute("aria-hidden", "false");

        const focusables = () => [...box.querySelectorAll("input,select,textarea,button")];
        const close = value => {
          el.modal.classList.remove("show");
          el.modal.setAttribute("aria-hidden", "true");
          el.modal.replaceChildren();
          document.removeEventListener("keydown", trap);
          resolve(value);
        };
        const trap = event => {
          if (event.key === "Escape") close(null);
          if (event.key === "Enter" && !["textarea", "button"].includes(document.activeElement.tagName.toLowerCase())) {
            event.preventDefault();
            doSubmit();
          }
          if (event.key !== "Tab") return;
          const nodes = focusables();
          const first = nodes[0];
          const last = nodes.at(-1);
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        };
        document.addEventListener("keydown", trap);
        setTimeout(() => {
          const firstInput = box.querySelector("input,select,textarea");
          if (firstInput) firstInput.focus();
          else focusables().at(-1)?.focus();
        }, 0);
      });
    }

    async function renameProjectPrompt(oldName) {
      if (oldName === "Default Project") return;
      const res = await showFormDialog({
        title: "Rename Project",
        fields: [
          { name: "name", label: `Rename project "${oldName}" to:`, type: "text", value: oldName }
        ],
        onSubmit: (res) => {
          if (!res.name.trim()) return "Project name is required";
        }
      });
      if (res == null) return;
      const trimmed = res.name.trim();
      if (trimmed === oldName) return;
      const list = await getProjectsList();
      if (list.includes(trimmed)) {
        showToast("A project with that name already exists", "error");
        return;
      }
      const idx = list.indexOf(oldName);
      if (idx !== -1) {
        list[idx] = trimmed;
        localStorage.setItem("novaplan_projects", JSON.stringify(list));
      }
      try {
        const bytes = await StorageEngine.loadPersistedBytesForProject(oldName);
        if (bytes) {
          await StorageEngine.persistBytesForProject(trimmed, bytes);
          await StorageEngine.deleteProjectStorage(oldName);
        }
      } catch (err) {
        console.error("Error migrating database on rename:", err);
      }
      if (state.activeProject === oldName) {
        state.activeProject = trimmed;
        localStorage.setItem("novaplan_active_project", trimmed);
      }
      await updateProjectSelectOptions();
      if (state.view.mode === "portfolio") {
        await PortfolioView.render();
      } else {
        await AppShell.refresh();
      }
      showToast(`Project renamed to: ${trimmed}`, "success");
    }

    async function deleteProjectPrompt(proj) {
      if (proj === "Default Project") return;
      const confirmed = await showConfirmDialog({
        title: "Delete Project",
        body: `Are you sure you want to delete project "${proj}"? This will permanently erase all tasks and project data.`,
        buttons: [
          { label: "Cancel", value: false },
          { label: "Delete", value: true, variant: "danger" }
        ]
      });
      if (!confirmed) return;
      const list = await getProjectsList();
      const idx = list.indexOf(proj);
      if (idx !== -1) {
        list.splice(idx, 1);
        localStorage.setItem("novaplan_projects", JSON.stringify(list));
      }
      await StorageEngine.deleteProjectStorage(proj);
      if (state.activeProject === proj) {
        state.activeProject = "Default Project";
        localStorage.setItem("novaplan_active_project", "Default Project");
        const initialBytes = await StorageEngine.loadPersistedBytes();
        StorageEngine.db = initialBytes ? new StorageEngine.SQL.Database(initialBytes) : new StorageEngine.SQL.Database();
        StorageEngine.db.run("PRAGMA foreign_keys = ON");
        StorageEngine.createSchema();
        await StorageEngine.persist();
      }
      await updateProjectSelectOptions();
      if (state.view.mode === "portfolio") {
        await PortfolioView.render();
      } else {
        await AppShell.refresh();
      }
      showToast(`Project "${proj}" deleted`, "success");
    }

    async function getProjectSummary(proj) {
      const bytes = await StorageEngine.loadPersistedBytesForProject(proj);
      if (!bytes) {
        return { totalTasks: 0, criticalTasks: 0, slippedTasks: 0, openRaidItems: 0, finishDate: "-" };
      }
      let db = null;
      try {
        db = new StorageEngine.SQL.Database(bytes);
        const totalTasksRows = execRows(db, "SELECT id, parent_id, is_critical, status, start_date, end_date, actual_start_date, actual_end_date, progress FROM tasks");
        const parentIds = new Set(totalTasksRows.map(t => t.parent_id).filter(Boolean));
        const leafTasksRows = totalTasksRows.filter(t => !parentIds.has(t.id));
        const totalTasks = leafTasksRows.length;
        const criticalTasks = leafTasksRows.filter(t => t.is_critical).length;
        let slippedTasks = 0;
        for (const t of leafTasksRows) {
          const slip = slippageStatus(t);
          if (slip === "slipped" || slip === "at-risk") slippedTasks++;
        }
        const openRaidRows = execRows(db, "SELECT id FROM raid_items WHERE status != 'Closed'");
        const openRaidItems = openRaidRows.length;
        const finishDates = leafTasksRows.map(t => t.end_date).filter(isValidIsoDate).sort();
        const finishDate = finishDates.at(-1) || "-";
        return { totalTasks, criticalTasks, slippedTasks, openRaidItems, finishDate };
      } catch (err) {
        console.error("Error summarizing project:", proj, err);
        return { totalTasks: 0, criticalTasks: 0, slippedTasks: 0, openRaidItems: 0, finishDate: "-" };
      } finally {
        if (db) db.close();
      }
    }

    async function performJiraSync({ host, email, token, proxy }) {
      const jiraTasks = state.tasks.filter(t => !t.is_summary && t.jira_url);
      if (!jiraTasks.length) {
        showToast("No tasks with Jira Links to sync.", "warning");
        return;
      }
      const headers = {
        "Authorization": "Basic " + btoa(email + ":" + token),
        "Accept": "application/json"
      };
      for (const task of jiraTasks) {
        const issueKey = ExportSystem.jiraIssueKey(task.jira_url);
        if (!issueKey) continue;
        let url = `${host}/rest/api/3/issue/${issueKey}`;
        if (proxy) {
          url = proxy.endsWith("/") ? proxy + url : proxy + "/" + url;
        }
        try {
          const res = await fetch(url, { headers });
          if (!res.ok) throw new Error(`Jira API returned ${res.status}`);
          const issue = await res.json();
          const jiraStatusCategory = issue.fields?.status?.statusCategory?.name || "";
          
          let targetCategory = "";
          if (task.status === "Done") targetCategory = "Done";
          else if (task.status === "In Progress") targetCategory = "In Progress";
          else if (task.status === "Not Started") targetCategory = "To Do";

          if (targetCategory && jiraStatusCategory !== targetCategory) {
            const transUrl = `${host}/rest/api/3/issue/${issueKey}/transitions`;
            const fetchTransUrl = proxy ? (proxy.endsWith("/") ? proxy + transUrl : proxy + "/" + transUrl) : transUrl;
            const trRes = await fetch(fetchTransUrl, { headers });
            if (trRes.ok) {
              const trData = await trRes.json();
              const matchingTransition = trData.transitions?.find(t => 
                t.name.toLowerCase() === targetCategory.toLowerCase() || 
                t.to?.statusCategory?.name.toLowerCase() === targetCategory.toLowerCase()
              );
              if (matchingTransition) {
                await fetch(fetchTransUrl, {
                  method: "POST",
                  headers: { ...headers, "Content-Type": "application/json" },
                  body: JSON.stringify({ transition: { id: matchingTransition.id } })
                });
              }
            }
          } else {
            let localUpdated = false;
            const fields = {};
            if (jiraStatusCategory === "Done" && task.status !== "Done") {
              fields.status = "Done";
              fields.progress = 100;
              fields.remaining_hours = 0;
              localUpdated = true;
            } else if (jiraStatusCategory === "In Progress" && task.status !== "In Progress") {
              fields.status = "In Progress";
              if (task.progress === 0 || task.progress === 100) fields.progress = 50;
              localUpdated = true;
            } else if (jiraStatusCategory === "To Do" && task.status !== "Not Started" && task.status !== "Done") {
              fields.status = "Not Started";
              fields.progress = 0;
              localUpdated = true;
            }
            if (localUpdated) {
              await state.storage.updateTask(task.id, fields);
            }
          }
        } catch (err) {
          console.error(`Error syncing task ${task.title} with Jira:`, err);
        }
      }
      await AppShell.refresh();
    }

          await state.storage.saveSetting("customColumns", state.customColumns);
          close();
          await AppShell.refresh();
          showToast("Custom fields saved and grid updated", "success");
        });
        foot.append(saveBtn, cancelBtn);
        box.append(head, content, foot);
        el.modal.appendChild(box);
        el.modal.classList.add("show");
        el.modal.setAttribute("aria-hidden", "false");

        const close = () => {
          el.modal.classList.remove("show");
          el.modal.setAttribute("aria-hidden", "true");
          el.modal.replaceChildren();
          document.removeEventListener("keydown", trap);
          resolve();
        };

        const trap = event => {
          if (event.key === "Escape") close();
        };
        document.addEventListener("keydown", trap);
      });
    }

    AppShell.init();
  </script>
</body>
</html>
