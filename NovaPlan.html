<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NovaPlan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-elevated: #21262d;
      --neon-cyan: #00d4ff;
      --neon-purple: #bf5fff;
      --neon-emerald: #00ff9d;
      --neon-orange: #ff9900;
      --neon-blue: #4488ff;
      --text-primary: #e6edf3;
      --text-muted: #7d8590;
      --border: #30363d;
      --danger: #ff5f7a;
      --row-height: 38px;
      --topbar-bg: rgba(13, 17, 23, .96);
      --gantt-header-bg: #111720;
      --gantt-bg: #0f141d;
      --tooltip-bg: #05080d;
      --gantt-shade: rgba(0, 0, 0, .45);
      --gantt-row-line: #242b35;
      --brand-shadow: 0 0 14px rgba(0, 212, 255, .35);
    }
    body.light {
      --bg-primary: #f6f8fa;
      --bg-secondary: #ffffff;
      --bg-elevated: #e8ecf0;
      --neon-cyan: #0969da;
      --neon-purple: #8250df;
      --neon-emerald: #1a7f37;
      --neon-orange: #bc4c00;
      --neon-blue: #0550ae;
      --text-primary: #1f2328;
      --text-muted: #656d76;
      --border: #d0d7de;
      --danger: #cf222e;
      --topbar-bg: rgba(246, 248, 250, .97);
      --gantt-header-bg: #eef1f4;
      --gantt-bg: #f6f8fa;
      --tooltip-bg: #ffffff;
      --gantt-shade: rgba(0, 0, 0, .06);
      --gantt-row-line: #e0e4e8;
      --brand-shadow: 0 0 14px rgba(9, 105, 218, .25);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    button, select, input, textarea {
      color: var(--text-primary);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
    }
    button, select { height: 34px; }
    button {
      border-radius: 6px;
      padding: 0 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    select {
      flex-shrink: 0;
    }
    button:hover:not(:disabled), select:hover:not(:disabled) { border-color: var(--neon-cyan); }
    button:disabled, select:disabled, input:disabled { opacity: .45; cursor: not-allowed; }
    .help-link {
      display: inline-flex;
      align-items: center;
      height: 34px;
      color: var(--text-primary);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .help-link:hover { border-color: var(--neon-cyan); }
    .creator-link {
      display: inline-flex;
      align-items: center;
      height: 34px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      text-decoration: none;
      white-space: nowrap;
      font-size: 12px;
      flex-shrink: 0;
    }
    .creator-link:hover {
      color: var(--text-primary);
      border-color: var(--neon-cyan);
    }
    :focus-visible { outline: 2px solid var(--neon-cyan); outline-offset: 2px; }
    .app-shell { display: flex; flex-direction: column; height: 100vh; min-width: 920px; }
    .topbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 54px;
      padding: 8px 12px;
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 50;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .topbar::-webkit-scrollbar { height: 4px; }
    .topbar::-webkit-scrollbar-track { background: transparent; }
    .topbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .1);
      border-radius: 2px;
    }
    .topbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .2); }
    body.light .topbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .1); }
    body.light .topbar::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, .2); }
    .brand {
      font-weight: 800;
      letter-spacing: 0;
      color: var(--neon-cyan);
      text-shadow: var(--brand-shadow);
      margin-right: 8px;
      flex-shrink: 0;
    }
    .spacer { flex: 1; min-width: 20px; }
    .status {
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .menu { position: relative; }
    .menu-panel {
      position: absolute;
      right: 0;
      top: 38px;
      min-width: 180px;
      max-height: 80vh;
      z-index: 100;
      display: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg-elevated);
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
    }
    .menu.open .menu-panel { display: block; }
    .menu-panel button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 0;
      text-align: left;
      height: 38px;
      background: transparent;
    }
    .menu-panel button:hover { background: rgba(0, 212, 255, .08); }
    body.light .menu-panel button:hover { background: rgba(9, 105, 218, .10); }
    .menu-panel::-webkit-scrollbar { width: 8px; }
    .menu-panel::-webkit-scrollbar-track { background: transparent; }
    .menu-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .15);
      border-radius: 4px;
    }
    .menu-panel::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .25); }
    body.light .menu-panel::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .15); }
    body.light .menu-panel::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, .25); }
    .main-layout {
      display: grid;
      grid-template-columns: minmax(620px, 55%) minmax(420px, 45%);
      height: calc(100vh - 54px);
      min-height: 0;
    }
    .main-layout.view-grid { grid-template-columns: 1fr; }
    .main-layout.view-gantt { grid-template-columns: 1fr; }
    .main-layout.view-board,
    .main-layout.view-sprint,
    .main-layout.view-dashboard,
    .main-layout.view-workload,
    .main-layout.view-raid,
    .main-layout.view-portfolio { grid-template-columns: 1fr; }
    .main-layout.view-grid section[aria-label="Gantt chart"],
    .main-layout.view-grid .board-panel,
    .main-layout.view-gantt section[aria-label="Task data grid"],
    .main-layout.view-gantt .board-panel,
    .main-layout.view-board section[aria-label="Task data grid"],
    .main-layout.view-board section[aria-label="Gantt chart"],
    .main-layout.view-sprint section[aria-label="Task data grid"],
    .main-layout.view-sprint section[aria-label="Gantt chart"],
    .main-layout.view-dashboard section[aria-label="Task data grid"],
    .main-layout.view-dashboard section[aria-label="Gantt chart"],
    .main-layout.view-workload section[aria-label="Task data grid"],
    .main-layout.view-workload section[aria-label="Gantt chart"],
    .main-layout.view-raid section[aria-label="Task data grid"],
    .main-layout.view-raid section[aria-label="Gantt chart"],
    .main-layout.view-portfolio section[aria-label="Task data grid"],
    .main-layout.view-portfolio section[aria-label="Gantt chart"] {
      display: none;
    }
    .panel {
      min-height: 0;
      border-right: 1px solid var(--border);
      background: var(--bg-secondary);
      overflow: hidden;
    }
    .panel:last-child { border-right: 0; }
    .board-panel { display: none; }
    .main-layout.view-board .board-panel,
    .main-layout.view-sprint .board-panel,
    .main-layout.view-dashboard .board-panel,
    .main-layout.view-workload .board-panel,
    .main-layout.view-raid .board-panel,
    .main-layout.view-portfolio .board-panel {
      display: block;
    }
    .panel-title {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .grid-scroll, .gantt-body {
      height: calc(100% - 36px);
      overflow: auto;
      position: relative;
    }
    .board-scroll {
      height: calc(100% - 36px);
      overflow: auto;
      padding: 12px;
      background: var(--bg-secondary);
    }
    .board-columns {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(260px, 1fr);
      gap: 12px;
      min-height: 100%;
      align-items: start;
    }
    .board-column {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-primary);
      min-height: 220px;
      overflow: hidden;
    }
    .board-column-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
    }
    .board-card {
      margin: 8px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--neon-blue);
      border-radius: 8px;
      background: var(--bg-secondary);
      padding: 9px 10px;
      cursor: grab;
    }
    .board-card:focus-visible { outline: 2px solid var(--neon-cyan); }
    .board-card.slipped { border-left-color: var(--danger); }
    .board-card.at-risk { border-left-color: var(--neon-orange); }
    .board-card-title { font-size: 13px; font-weight: 700; color: var(--text-primary); }
    .board-card-meta {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      color: var(--text-muted);
      font-size: 11px;
    }
    .badge {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 6px;
      background: var(--bg-primary);
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .metric-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-primary);
      padding: 14px;
    }
    .metric-label {
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .metric-value {
      margin-top: 6px;
      color: var(--text-primary);
      font-size: 24px;
      font-weight: 800;
    }
    .analysis-table {
      width: 100%;
      min-width: 760px;
      border-collapse: separate;
      border-spacing: 0;
    }
    .analysis-table th,
    .analysis-table td {
      height: auto;
      max-height: none;
      white-space: normal;
      vertical-align: top;
      padding: 9px 10px;
    }
    .collapse-toggle {
      width: 22px;
      height: 22px;
      padding: 0;
      margin-right: 6px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1;
      vertical-align: middle;
    }
    .critical-badge {
      color: var(--danger);
      border-color: rgba(255,95,122,.55);
      background: rgba(255,95,122,.10);
    }
    table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
    th, td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      height: var(--row-height);
      max-height: var(--row-height);
      padding: 0 8px;
      font-size: 13px;
      vertical-align: middle;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--gantt-header-bg);
      color: var(--text-muted);
      font-weight: 600;
    }
    th.column-draggable {
      cursor: grab;
      user-select: none;
    }
    .sticky-col {
      position: sticky !important;
      z-index: 2;
    }
    th.sticky-col {
      z-index: 12 !important;
      background: var(--gantt-header-bg) !important;
    }
    tbody tr td.sticky-col {
      background: var(--bg-primary);
    }
    tbody tr.is-highlighted td.sticky-col {
      background: color-mix(in srgb, var(--bg-primary) 92%, #00d4ff) !important;
    }
    tbody tr.is-slipped td.sticky-col {
      background: color-mix(in srgb, var(--bg-primary) 90%, #ff5f7a) !important;
    }
    tbody tr.is-at-risk td.sticky-col {
      background: color-mix(in srgb, var(--bg-primary) 90%, #ff9900) !important;
    }
    tbody tr.is-summary td.sticky-col {
      background: color-mix(in srgb, var(--bg-primary) 96.5%, #ffffff) !important;
    }
    body.light tbody tr.is-summary td.sticky-col {
      background: color-mix(in srgb, var(--bg-primary) 96%, #000000) !important;
    }
    tbody tr:hover td.sticky-col {
      background: color-mix(in srgb, var(--bg-primary) 97.5%, #ffffff) !important;
    }
    body.light tbody tr:hover td.sticky-col {
      background: color-mix(in srgb, var(--bg-primary) 96%, #000000) !important;
    }
    td.sticky-col[data-key="title"], th.sticky-col[data-col-key="title"] {
      border-right: 2px solid var(--border) !important;
    }
    th.column-dragging {
      cursor: grabbing;
      opacity: .45;
    }
    th.column-drop-left { box-shadow: inset 3px 0 0 var(--neon-cyan); }
    th.column-drop-right { box-shadow: inset -3px 0 0 var(--neon-cyan); }
    tr.is-highlighted td {
      background: rgba(0, 212, 255, .08);
      box-shadow: inset 3px 0 0 var(--neon-cyan);
    }
    tr.is-slipped td {
      background: rgba(255, 95, 122, .10);
      box-shadow: inset 3px 0 0 var(--danger);
    }
    tr.is-at-risk td {
      background: rgba(255, 153, 0, .10);
      box-shadow: inset 3px 0 0 var(--neon-orange);
    }
    tr.is-summary td {
      font-weight: 700;
      background: rgba(255,255,255,.035);
    }
    body.light tr.is-summary td { background: rgba(0,0,0,.04); }
    tr.has-baseline-variance td[data-key="finish_variance_days"],
    tr.has-baseline-variance td[data-key="baseline_end_date"] {
      color: var(--neon-orange);
    }
    tr.is-milestone td[data-key="title"]::before {
      content: "◆ ";
      color: var(--neon-purple);
    }
    tr:hover td { background: rgba(255,255,255,.025); }
    body.light tr:hover td { background: rgba(0,0,0,.04); }
    tr.cf-row-highlight td {
      background-color: var(--cf-bg) !important;
      color: var(--cf-color) !important;
    }
    .cell-editable { cursor: pointer; }
    .cell-editable:hover { background: rgba(0, 212, 255, .06); }
    body.light .cell-editable:hover { background: rgba(9, 105, 218, .08); }
    .grid-input, .grid-select, .grid-textarea {
      width: 100%;
      min-width: 80px;
      height: 28px;
      border-radius: 4px;
      padding: 0 6px;
      font-size: 13px;
    }
    .grid-textarea {
      height: 58px;
      padding: 6px;
      resize: none;
    }
    .comments-preview { max-width: 220px; display: inline-block; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
    .inline-error { color: var(--danger); font-size: 11px; margin-left: 6px; }
    .icon-btn { width: 30px; padding: 0; text-align: center; }
    .danger { color: var(--danger); border-color: rgba(255,95,122,.5); }
    .primary { color: #031015; background: var(--neon-cyan); border-color: var(--neon-cyan); font-weight: 700; }
    body.light .primary { color: #ffffff; }
    .warning-banner {
      display: none;
      padding: 8px 12px;
      color: var(--neon-orange);
      background: rgba(255,153,0,.11);
      border-bottom: 1px solid rgba(255,153,0,.25);
      font-size: 13px;
    }
    .warning-banner.show { display: block; }
    .gantt-wrap {
      height: calc(100% - 36px);
      overflow: hidden;
      display: grid;
      grid-template-rows: 42px 1fr;
    }
    .gantt-header {
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: var(--gantt-header-bg);
    }
    .gantt-body {
      height: 100%;
      background: var(--gantt-bg);
    }
    .gantt-tooltip {
      position: fixed;
      z-index: 40;
      display: none;
      pointer-events: none;
      background: var(--tooltip-bg);
      border: 1px solid var(--neon-cyan);
      border-radius: 6px;
      padding: 8px 10px;
      max-width: 260px;
      color: var(--text-primary);
      box-shadow: 0 0 24px rgba(0, 212, 255, .22);
      font-size: 12px;
      line-height: 1.4;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      background: var(--bg-primary);
    }
    .loader {
      width: 42px;
      height: 42px;
      border: 3px solid var(--border);
      border-top-color: var(--neon-cyan);
      border-radius: 999px;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast-container {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 80;
      display: grid;
      gap: 8px;
      max-width: 360px;
    }
    .toast {
      border: 1px solid var(--border);
      border-left: 3px solid var(--neon-blue);
      border-radius: 8px;
      background: var(--bg-elevated);
      padding: 10px 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      font-size: 13px;
    }
    .toast.success { border-left-color: var(--neon-emerald); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--neon-orange); }
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.62);
    }
    .modal-overlay.show { display: grid; }
    .modal-box {
      width: min(520px, calc(100vw - 32px));
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-elevated);
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      /* Scrollable modal: header and footer stay fixed, body scrolls */
      overflow: hidden;
    }
    .modal-box.help-modal {
      width: min(980px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }
    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg-elevated);
      position: relative;
      z-index: 1;
    }
    .modal-foot {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
      background: var(--bg-elevated);
      position: relative;
      z-index: 1;
    }
    .modal-body {
      padding: 16px;
      color: var(--text-muted);
      line-height: 1.5;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
      min-height: 0;
      /* Custom scrollbar for modals */
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, .15) transparent;
    }
    .modal-body::-webkit-scrollbar { width: 8px; }
    .modal-body::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .15);
      border-radius: 4px;
    }
    .modal-body::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .25); }
    body.light .modal-body::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .15); }
    body.light .modal-body::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, .25); }
    .help-modal .modal-body {
      overflow: auto;
      max-height: none;
    }
    .embedded-help {
      display: grid;
      gap: 18px;
      color: var(--text-muted);
    }
    .embedded-help h3 {
      margin: 0 0 6px;
      color: var(--text-primary);
      font-size: 16px;
    }
    .embedded-help p,
    .embedded-help li {
      margin: 0;
      color: var(--text-muted);
    }
    .embedded-help ul,
    .embedded-help ol {
      margin: 6px 0 0 18px;
      padding: 0;
    }
    .embedded-help code {
      color: var(--text-primary);
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
    }
    .embedded-help h4 {
      margin: 10px 0 4px;
      color: var(--text-primary);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .embedded-help table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 6px;
    }
    .embedded-help th {
      text-align: left;
      padding: 5px 8px;
      background: var(--bg-primary);
      color: var(--text-muted);
      border: 1px solid var(--border);
      font-weight: 600;
      position: static;
    }
    .embedded-help td {
      padding: 5px 8px;
      border: 1px solid var(--border);
      vertical-align: top;
      color: var(--text-muted);
    }
    .embedded-help tr:nth-child(even) td { background: rgba(255,255,255,.03); }
    body.light .embedded-help tr:nth-child(even) td { background: rgba(0,0,0,.03); }
    .help-tip {
      border-left: 3px solid var(--neon-cyan);
      background: rgba(0,212,255,.07);
      padding: 7px 10px;
      border-radius: 0 4px 4px 0;
      font-size: 12px;
      margin-top: 6px;
      color: var(--text-muted);
    }
    .help-warn {
      border-left: 3px solid var(--neon-orange);
      background: rgba(255,153,0,.07);
      padding: 7px 10px;
      border-radius: 0 4px 4px 0;
      font-size: 12px;
      margin-top: 6px;
      color: var(--text-muted);
    }
    .help-steps { margin: 6px 0 0 0; padding-left: 18px; }
    .help-steps li { margin-bottom: 4px; }
    .embedded-help .toc { columns: 2; column-gap: 20px; }
    .jira-link {
      color: var(--neon-cyan);
      text-decoration: none;
      font-weight: 600;
    }
    .jira-link:hover { text-decoration: underline; }

    #project-select {
      width: 150px;
      border-radius: 6px;
      padding: 0 8px;
      font-weight: 600;
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      margin-right: 6px;
    }
    body.light #project-select {
      color: var(--neon-blue);
      border-color: var(--neon-blue);
    }
    .file-input { display: none; }
    .context-menu {
      position: fixed;
      z-index: 1000;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 0;
      min-width: 190px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }
    .context-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .context-menu-item:hover {
      background: var(--bg-secondary);
      color: var(--neon-cyan);
    }
    .context-menu-item.danger {
      color: var(--danger);
    }
    .context-menu-item.danger:hover {
      background: rgba(255, 95, 122, .1);
      color: var(--danger);
    }
    .context-menu-separator {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* Glassmorphism Refinements */
    .context-menu, .gantt-tooltip, .modal-box, #export-menu, #tools-menu {
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      background: color-mix(in srgb, var(--bg-elevated) 78%, transparent) !important;
    }
    body.light .context-menu, body.light .gantt-tooltip, body.light .modal-box, body.light #export-menu, body.light #tools-menu {
      background: color-mix(in srgb, var(--bg-elevated) 85%, transparent) !important;
    }

    /* Details Drawer */
    .details-drawer {
      position: fixed;
      top: 50px; /* height of topbar */
      right: 0;
      width: 480px;
      height: calc(100vh - 50px);
      background: color-mix(in srgb, var(--bg-elevated) 90%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid var(--border);
      box-shadow: -10px 0 30px rgba(0,0,0,.35);
      z-index: 80;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .details-drawer.show {
      transform: translateX(0);
    }
    .details-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .details-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .details-close:hover {
      color: var(--danger);
    }
    .details-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: grid;
      gap: 16px;
    }
    .details-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .details-group label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .details-input, .details-select, .details-textarea {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 13px;
    }
    .details-input:focus, .details-select:focus, .details-textarea:focus {
      outline: none;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.15);
    }

    /* Command Palette */
    .command-palette-box {
      width: min(600px, calc(100vw - 32px));
      border: 1px solid var(--border);
      border-radius: 10px;
      background: color-mix(in srgb, var(--bg-elevated) 90%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 70px rgba(0,0,0,.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-top: 10vh;
    }
    .command-input-wrapper {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      gap: 12px;
    }
    .command-search-icon {
      font-size: 16px;
      color: var(--text-muted);
    }
    .command-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
    }
    .command-results {
      max-height: 320px;
      overflow-y: auto;
      padding: 8px 0;
    }
    .command-item {
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
    }
    .command-item:hover, .command-item.active {
      background: rgba(0, 229, 255, 0.08);
      color: var(--neon-cyan);
    }
    .command-item-label {
      font-weight: 500;
    }
    .command-item-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--bg-secondary);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .command-item:hover .command-item-badge, .command-item.active .command-item-badge {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }
    .command-item-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 8px;
    }

    @media (max-width: 1023px) {
      body { overflow: auto; }
      .app-shell { min-width: 0; height: auto; min-height: 100vh; }
      .topbar { flex-wrap: wrap; min-height: auto; }
      .main-layout { grid-template-columns: 1fr; height: auto; min-height: 900px; }
      .panel { min-height: 440px; }
    }
  </style>
</head>

  <template id="embedded-help-template">
    <div class="embedded-help">

      <section>
        <h3>Welcome to NovaPlan</h3>
        <p>NovaPlan is a browser-based project planner. Everything runs locally in your browser — no sign-up, no server, no internet required after the first load. Your data is saved automatically in your browser's storage and never leaves your device.</p>
        <p style="margin-top:6px">Use it to plan projects, track tasks, manage sprints, visualise timelines on a Gantt chart, spot schedule risks early, and share progress as Excel or GIF exports.</p>
        <div class="help-tip">💡 <strong>Tip:</strong> If this is your first time, click <code>Load Template…</code> in the top bar and choose <strong>Agile Sprint Plan</strong> to see a fully built example immediately.</div>
      </section>
      <section>
        <h3>Getting Started in 5 Steps</h3>
        <ol class="help-steps">
          <li><strong>Load a template or create a task.</strong> Click <code>Load Template…</code> to start from a pre-built plan, or click <code>New Task</code> (blue button) to add a blank task.</li>
          <li><strong>Click any cell to edit it.</strong> Click the Task Name to rename it. Click dates, progress, status, or any highlighted column to change the value inline.</li>
          <li><strong>Add subtasks.</strong> Click the <code>+</code> button at the far right of any row to add a child task underneath it. The parent row rolls up all child values automatically.</li>
          <li><strong>Switch views.</strong> Use the <code>View</code> dropdown to see your plan as a Gantt chart, a Kanban board, a sprint board, a workload table, or a dashboard. <strong>Split</strong> shows the grid and Gantt side by side.</li>
          <li><strong>Save and export.</strong> Your data saves automatically in the browser. Use <code>Export</code> to download a backup (SQL), a spreadsheet (Excel), or a shareable Gantt image (GIF).</li>
        </ol>
      </section>

      <section>
        <h3>The Top Toolbar — Every Button Explained</h3>
        <p>The toolbar adapts to your screen size — on narrower displays, controls wrap to a second row or allow horizontal scrolling to keep all buttons accessible.</p>
        <table>
          <tr><th style="width:130px">Control</th><th>What it does</th></tr>
          <tr><td><code>Load Template…</code></td><td>Loads a ready-made plan: <strong>Agile Sprint Plan</strong>, <strong>CI/CD Pipeline Setup</strong>, <strong>Product Launch</strong>, or <strong>Bug Triage Workflow</strong>. Choose <em>Merge</em> to add tasks alongside existing ones, or <em>Replace</em> to start fresh.</td></tr>
          <tr><td><code>New Task</code></td><td>Creates one blank top-level task starting today. The title cell opens for editing immediately.</td></tr>
          <tr><td><code>Delete Selected</code></td><td>Deletes all checked (selected) tasks and their subtasks. Only active when at least one checkbox is ticked.</td></tr>
          <tr><td><code>View</code></td><td>Switches between 8 views: Split, Grid, Gantt, Board, Sprint, Dashboard, Workload, RAID (see Views section below).</td></tr>
          <tr><td><code>Filter</code></td><td>Shows a subset of tasks — e.g. only Slipped, only Milestones, only Critical Path tasks (see Filtering section).</td></tr>
          <tr><td><code>Group By</code></td><td>Re-orders and groups rows by Status, Sprint, Resource, Priority, Task Type, or Slippage.</td></tr>
          <tr><td><code>Export</code></td><td>Downloads your plan in SQL, CSV, Jira CSV, Project XML, Excel, or Gantt GIF format.</td></tr>
          <tr><td><code>Tools</code></td><td>Advanced features: All 17 tools now accessible regardless of view — Calendar, Choose Columns, Baselines, Sprints, Saved Views, Scenarios, RAID, Change Log, Custom Fields, Conditional Formatting, Integrations, Gantt Labels, Gantt Lines, and Reset Data. The Tools menu dropdown appears above all other UI elements for easy access.</td></tr>
          <tr><td><code>Saved Views</code></td><td>Pre-set view configurations (mode + filter + grouping). Six defaults included; save your own via <code>Tools &gt; Save View</code>.</td></tr>
          <tr><td><code>Import SQL/CSV</code></td><td>Loads tasks from a CSV file or restores a full database from a previously exported SQL file.</td></tr>
          <tr><td><code>Help</code></td><td>Opens this dialog.</td></tr>
          <tr><td>🌙 / ☀️</td><td>Toggles between dark and light theme. Your preference is remembered.</td></tr>
        </table>
        <div class="help-tip">💡 <strong>Responsive Design:</strong> On wide screens (1920px+), all toolbar buttons fit on one line. On medium screens (1280-1920px), controls wrap to a second row automatically. On narrow screens, a horizontal scrollbar appears — all buttons remain accessible with no hidden elements.</div>
      </section>

      <section>
        <h3>Creating and Editing Tasks</h3>
        <h4>Adding tasks</h4>
        <ul class="help-steps">
          <li>Click <code>New Task</code> to add a root-level task. It starts today with 1 working day duration.</li>
          <li>Click <code>+</code> at the end of any row to add a <strong>child (subtask)</strong> directly under that row. The parent automatically becomes a summary row.</li>
          <li>Use <code>Load Template…</code> for a fully wired plan with dates, types, resources, and dependencies already set.</li>
        </ul>
        <h4>Editing cells</h4>
        <p>Click any underlined or highlighted cell to edit it. A text input, date picker, or dropdown appears. Press <strong>Enter</strong> to confirm, <strong>Escape</strong> to cancel. Most cells save on click-away.</p>
        <h4>Deleting tasks</h4>
        <p>Click <code>×</code> at the end of the row. If the task has subtasks, all subtasks are deleted too. For bulk deletion, tick the checkboxes (first column) and click <code>Delete Selected</code>.</p>
        <div class="help-tip">💡 <strong>Tip:</strong> Double-click anywhere on the Task Name column (not on the ▸/▾ toggle) to rename a task quickly.</div>
      </section>

      <section>
        <h3>Task Hierarchy: Parents and Subtasks</h3>
        <p>NovaPlan supports unlimited nesting. Each task has a <strong>WBS code</strong> (e.g. <code>1</code>, <code>1.1</code>, <code>1.1.2</code>) that shows its position in the hierarchy.</p>
        <ul class="help-steps">
          <li>Click <code>+</code> on any row to add a subtask beneath it. The parent row turns <strong>bold</strong> — it is now a <em>summary row</em>.</li>
          <li>Summary rows <strong>automatically roll up</strong> dates (earliest start → latest end), hours (sum), and progress (weighted average).</li>
          <li>Click the <strong>▾</strong> (down triangle) next to a parent task name to collapse all its subtasks. Click <strong>▸</strong> to expand them again.</li>
          <li>Use <strong>▸ All</strong> and <strong>▾ All</strong> buttons in the panel header to collapse or expand the entire hierarchy at once.</li>
        </ul>
        <div class="help-tip">💡 <strong>Tip:</strong> Structure your plan with top-level tasks as phases or epics, and subtasks as individual work items. This keeps the Gantt chart readable and rollup metrics meaningful.</div>
      </section>

      <section>
        <h3>Task Types</h3>
        <p>Every task has a type that sets its default Gantt bar colour and helps categorise work. Click the <code>Type</code> cell to change it. To override the colour for an individual task, use the <code>Color</code> column swatch — see <em>Custom Bar Colours</em> below.</p>
        <table>
          <tr><th>Type</th><th>Colour</th><th>When to use</th></tr>
          <tr><td>🎯 Epic</td><td><span style="display:inline-block;width:12px;height:12px;background:#bf5fff;border-radius:2px;vertical-align:middle;margin-right:5px;border:1px solid rgba(0,0,0,.15)"></span>Purple</td><td>Large initiative spanning multiple stories or features</td></tr>

      <section>
        <h3>Custom Bar Colours</h3>
        <p>The <code>Color</code> column lets you give any task its own Gantt bar colour, overriding its task-type colour. This is handy for highlighting a workstream, a team, or a release train in a single glance.</p>
        <ol class="help-steps">
          <li>Click the colour <strong>swatch</strong> in the <code>Color</code> column for the task you want to recolour.</li>
          <li>Pick any colour from your browser's colour picker. The Gantt bar and the task's Board card update immediately.</li>
          <li>A custom colour is marked with a cyan ring around the swatch and a <strong>✕</strong> button appears next to it.</li>
          <li>Click <strong>✕</strong> to remove the custom colour and revert to the task-type colour.</li>
        </ol>
        <div class="help-tip">💡 Custom colours are saved with your plan and included in SQL, CSV, and Excel exports (the <code>Color</code> column), so they survive backup and restore.</div>
      </section>

      <section>
        <h3>UX Polish &amp; Responsive Design</h3>
        <p>NovaPlan includes several professional-grade UX enhancements to ensure a smooth experience across all screen sizes and viewport configurations.</p>
        <h4>Scrollable Modals with Sticky Buttons</h4>
        <p>All modal dialogs (Calendar Settings, Custom Fields, Baselines, etc.) now feature:</p>
        <ul class="help-steps">
          <li><strong>Sticky Header</strong> — The modal title stays fixed at the top, providing context while scrolling through long forms</li>
          <li><strong>Scrollable Body</strong> — Form content scrolls smoothly within the modal, preventing viewport overflow</li>
          <li><strong>Sticky Footer</strong> — OK/Cancel buttons remain visible and accessible at all times, even with many form fields</li>
          <li><strong>Custom Scrollbar</strong> — Theme-aware scrollbar (dark/light mode) with smooth appearance</li>
        </ul>
        <h4>Responsive Toolbar</h4>
        <p>The top toolbar adapts intelligently to your screen size:</p>
        <ul class="help-steps">
          <li><strong>Wide Screens (1920px+)</strong> — All controls fit in a single row with no wrapping</li>
          <li><strong>Standard Screens (1440-1920px)</strong> — Flexible layout maintains single row when possible</li>
          <li><strong>Laptop Screens (1280-1440px)</strong> — Elements wrap to a second row, keeping all controls visible</li>
          <li><strong>Narrow Screens (&lt;1280px)</strong> — Horizontal scrollbar appears as a fallback, with no hidden elements</li>
        </ul>
        <p style="margin-top:6px">Critical UI elements (Help button, Theme switcher, Storage status) are protected with <code>flex-shrink: 0</code> to prevent compression or overlap.</p>
        <h4>Improved Tools Menu</h4>
        <ul class="help-steps">
          <li><strong>All 17 menu items</strong> now visible regardless of current view mode</li>
          <li><strong>Proper z-index layering</strong> — Menu dropdown appears above Gantt timeline and all other content</li>
          <li><strong>Always accessible</strong> — No more hidden options or view-dependent limitations</li>
        </ul>
        <div class="help-tip">💡 <strong>Accessibility:</strong> All UX improvements maintain keyboard navigation, screen reader compatibility, and touch-friendly interactions across devices.</div>
      </section>

      <section>
        <h3>Dates, Duration, and the Working Calendar</h3>
        <h4>Plan Start / Plan End</h4>
        <p>These are the <em>scheduled</em> dates for a task. Click either cell to open a date picker. On summary rows, start and end roll up automatically from child tasks (you cannot edit them directly unless you check <em>Manually Scheduled</em>).</p>
        <h4>Duration (Dur)</h4>
        <p>Duration is read-only and calculated from the start/end dates using the working calendar (e.g. <code>3d 4h</code> means three working days and four hours). You can also type hours directly into the <code>Hours</code> column.</p>
        <h4>Actual Start / Actual End</h4>
        <p>Fill these in as work progresses. They're compared with planned dates to calculate slippage. Actual date bars appear below the Gantt bar in a lighter colour.</p>
        <h4>Working Calendar</h4>
        <p>By default the working week is Monday–Friday, 8 hours per day. Go to <code>Tools &gt; Calendar Settings</code> to change:</p>
        <ul class="help-steps">
          <li><strong>Hours per day</strong> — e.g. enter <code>7.5</code> for a 7.5-hour day</li>
          <li><strong>Working days</strong> — enter day numbers: <code>1,2,3,4,5</code> = Mon–Fri; <code>0</code> = Sunday; <code>6</code> = Saturday</li>
          <li><strong>Holidays</strong> — enter dates as <code>YYYY-MM-DD</code> separated by commas</li>
        </ul>
        <div class="help-tip">💡 The calendar affects duration calculations, workload spreading, and non-working day shading on the Gantt chart.</div>
      </section>

      <section>
        <h3>Progress and Status</h3>
        <h4>Progress (%)</h4>
        <p>Enter a number from 0 to 100 in the <code>%</code> column. NovaPlan automatically updates the Status and Remaining Hours fields to match.</p>
        <h4>Status</h4>
        <p>Four values: <strong>Not Started</strong>, <strong>In Progress</strong>, <strong>Blocked</strong>, <strong>Done</strong>. Progress drives status automatically, but you can override it manually.</p>
        <table>
          <tr><th>Progress</th><th>Auto Status</th></tr>
          <tr><td>0%</td><td>Not Started</td></tr>
          <tr><td>1–99%</td><td>In Progress</td></tr>
          <tr><td>100%</td><td>Done</td></tr>
        </table>
        <p style="margin-top:6px">Summary (parent) rows inherit the <em>worst</em> status from their children — if any child is Blocked, the parent shows Blocked.</p>
        <h4>Hours tracking</h4>
        <ul class="help-steps">
          <li><code>Hours</code> — planned effort</li>
          <li><code>Actual h</code> — hours logged so far</li>
          <li><code>Remain h</code> — hours left to complete (auto-calculated from progress, editable)</li>
          <li><code>EAC h</code> — Estimate at Completion = Actual + Remaining (read-only)</li>
        </ul>
      </section>

      <section>
        <h3>Task Dependencies</h3>
        <p>Dependencies define which tasks must happen before others. Enter them in the <code>Predecessors</code> column using WBS codes.</p>
        <h4>Format</h4>
        <p><code>{WBS code}{Type}{Lag}</code> — all parts except WBS are optional.</p>
        <table>
          <tr><th>Example</th><th>Meaning</th></tr>
          <tr><td><code>2</code></td><td>Task 2 must finish before this task starts (Finish-to-Start, no lag)</td></tr>
          <tr><td><code>1.2</code></td><td>Subtask 1.2 must finish before this starts</td></tr>
          <tr><td><code>2FS+2d</code></td><td>Task 2 must finish, then wait 2 more working days before this starts</td></tr>
          <tr><td><code>3SS</code></td><td>This task must start at the same time as task 3 (Start-to-Start)</td></tr>
          <tr><td><code>4FF-1d</code></td><td>This task must finish 1 day before task 4 finishes (Finish-to-Finish with lead)</td></tr>
          <tr><td><code>1,3FS+4h</code></td><td>Multiple predecessors separated by commas</td></tr>
        </table>
        <h4>Dependency types</h4>
        <table>
          <tr><th>Type</th><th>Full name</th><th>Meaning</th></tr>
          <tr><td><code>FS</code></td><td>Finish-to-Start</td><td>Default. Predecessor must finish before successor starts.</td></tr>
          <tr><td><code>SS</code></td><td>Start-to-Start</td><td>Both tasks start at the same time.</td></tr>
          <tr><td><code>FF</code></td><td>Finish-to-Finish</td><td>Both tasks finish at the same time.</td></tr>
          <tr><td><code>SF</code></td><td>Start-to-Finish</td><td>Predecessor starts before successor can finish. Rare.</td></tr>
        </table>
        <p style="margin-top:6px">Lag is in working days (<code>d</code>) or hours (<code>h</code>). Positive lag = gap; negative lag = overlap (lead).</p>
        <div class="help-tip">💡 Dependency arrows appear on the Gantt chart as curved lines with arrowheads. NovaPlan automatically detects and warns about circular dependencies.</div>
      </section>

      <section>
        <h3>The Gantt Timeline</h3>
        <p>The Gantt chart shows each task as a horizontal bar spanning its planned start to end date. The bars align with the task rows in the grid.</p>
        <h4>Reading the chart</h4>
        <table>
          <tr><th>Visual element</th><th>What it means</th></tr>
          <tr><td>Coloured bar</td><td>Planned schedule. Colour matches the task type.</td></tr>
          <tr><td>Darker fill inside bar</td><td>Completed portion (progress %).</td></tr>
          <tr><td>Thin bar below main bar</td><td>Actual start/end dates (shown in white or red if slipped).</td></tr>
          <tr><td>Thin gray bar below</td><td>Baseline dates (where the task was when you set the baseline).</td></tr>
          <tr><td>Diamond shape</td><td>Milestone (zero-duration checkpoint).</td></tr>
          <tr><td>Red stroke/border on bar</td><td>Task is on the Critical Path or has slipped.</td></tr>
          <tr><td>Orange stroke on bar</td><td>Task is at risk of slipping.</td></tr>
          <tr><td>Cyan glow on bar</td><td>Task has been starred (★ highlighted).</td></tr>
          <tr><td>Shaded columns</td><td>Non-working days (weekends and holidays).</td></tr>
          <tr><td>Curved arrows</td><td>Dependencies between tasks.</td></tr>
        </table>
        <h4>Zooming</h4>
        <p>Use the <code>−</code> and <code>+</code> buttons in the Gantt panel header to zoom out or in. Eight levels from 25% (very wide view) to 400% (very detailed daily view). The date tick spacing adjusts automatically.</p>
        <h4>Hovering</h4>
        <p>Hover over any Gantt bar to see a tooltip with full task details: planned dates, actual dates, duration, float, progress, sprint, resource, Jira link, and baseline finish.</p>
        <div class="help-tip">💡 <strong>Tip:</strong> In Gantt-only view (<code>View → Gantt</code>) the timeline takes the full width, making it ideal for presenting to stakeholders.</div>
      </section>

        <table>
          <tr><th>View</th><th>Best for</th><th>How to use</th></tr>

      <section>
        <h3>Filtering and Grouping</h3>
        <h4>Filters — showing only certain tasks</h4>
        <p>The <code>Filter</code> dropdown narrows what is shown in the grid and Gantt without deleting anything.</p>
        <table>
          <tr><th>Filter</th><th>Shows</th></tr>
          <tr><td>All Tasks</td><td>Everything (default)</td></tr>
          <tr><td>Slipped</td><td>Tasks where actual dates are later than planned</td></tr>
          <tr><td>At Risk</td><td>Tasks whose planned end has passed but are not 100% done</td></tr>
          <tr><td>Milestones</td><td>Tasks marked with ◆</td></tr>
          <tr><td>Current Sprint</td><td>Tasks in the active sprint</td></tr>
          <tr><td>Future Sprints</td><td>Tasks in sprints that haven't started yet</td></tr>
          <tr><td>Backlog</td><td>Tasks not assigned to any sprint</td></tr>
          <tr><td>Completed</td><td>Tasks at 100% or status Done</td></tr>
          <tr><td>Blocked</td><td>Tasks with status Blocked</td></tr>
          <tr><td>Critical Path</td><td>Tasks with zero float (any delay = project delay)</td></tr>
          <tr><td>Near Critical</td><td>Tasks with float ≤ 2 days</td></tr>

      </section>

      <section>
        <h3>Row Colour Coding</h3>
        <p>Row backgrounds give you instant health signals without looking at columns individually.</p>
        <table>
          <tr><th>Row colour</th><th>Meaning</th></tr>
          <tr><td><span style="display:inline-block;width:10px;height:10px;background:#ff5f7a;border-radius:2px;margin-right:6px"></span>Red tint</td><td><strong>Slipped</strong> — actual start or end date is later than planned.</td></tr>
          <tr><td><span style="display:inline-block;width:10px;height:10px;background:#ff9900;border-radius:2px;margin-right:6px"></span>Orange tint</td><td><strong>At Risk</strong> — planned end date has passed but the task isn't done.</td></tr>
          <tr><td><span style="display:inline-block;width:10px;height:10px;background:#00d4ff;border-radius:2px;margin-right:6px"></span>Cyan left bar</td><td><strong>Highlighted (★)</strong> — manually flagged for attention.</td></tr>
          <tr><td><span style="display:inline-block;width:10px;height:10px;background:#ff5f7a;border-radius:2px;margin-right:6px"></span>Red left bar only</td><td><strong>Critical Path</strong> — zero float; any delay pushes the project end date.</td></tr>

        </table>

      <section>
        <h3>Sprints</h3>
        <h4>Creating a sprint</h4>
        <ol class="help-steps">
          <li>Go to <code>Tools &gt; Add Sprint</code>.</li>
          <li>Enter the sprint name (e.g. <em>Sprint 1</em>), start date, and end date.</li>
          <li>Click OK — the sprint appears in the <code>Sprint</code> column dropdown for all tasks.</li>
        </ol>
        <h4>Assigning tasks to sprints</h4>
        <p>Click the <code>Sprint</code> cell in any task row and choose a sprint from the dropdown. Tasks with no sprint assigned show as <em>Backlog</em>.</p>
        <h4>Sprint view</h4>
        <p>Switch to <code>View → Sprint</code> to see a Kanban board with one column per sprint plus a Backlog column. Drag cards between columns to reassign tasks to different sprints. The panel header shows total sprint hours and the number of resources allocated.</p>
        <div class="help-tip">💡 Use <code>Filter → Current Sprint</code> in Split view to focus the grid and Gantt on just this sprint's tasks.</div>
      </section>

      <section>
        <h3>Baselines: Comparing Plan vs Reality</h3>
        <p>A baseline is a snapshot of your planned schedule saved at a point in time. As the project progresses, you can see exactly how much tasks have slipped compared to the original plan.</p>
        <h4>Setting a baseline</h4>
        <ol class="help-steps">
          <li>Once your plan is finalised (dates, hours, resources all set), go to <code>Tools &gt; Set Baseline</code>.</li>
          <li>Give it a name (e.g. <em>Baseline 2025-01-15</em>) and confirm.</li>
          <li>NovaPlan saves every task's dates, duration, and progress as the reference point.</li>
        </ol>
        <h4>Seeing variance</h4>
        <p>After setting a baseline, the grid shows two new columns: <code>Base End</code> (the baseline finish date) and <code>Finish Var</code> (the difference in days — positive means later than planned). On the Gantt chart, a thin gray bar below each task bar shows the baseline position.</p>
        <h4>Managing baselines</h4>
        <ul class="help-steps">
          <li><code>Tools &gt; View Baseline</code> — see the active baseline name and how many tasks have variance.</li>
          <li><code>Tools &gt; Clear Baseline</code> — deactivates the baseline (historical data is kept, but variance is no longer shown).</li>
        </ul>
        <div class="help-tip">💡 <strong>Best practice:</strong> Set a baseline before project kick-off. Update it after each approved scope change. Use <code>Filter → Baseline Variance</code> in weekly reviews to spot drifting tasks.</div>
      </section>

      <section>
        <h3>Workload View: Who's Doing What</h3>
        <p>Switch to <code>View → Workload</code> to see a resource allocation summary. For each person or team:</p>
        <table>
          <tr><th>Column</th><th>Meaning</th></tr>
          <tr><td>Resource</td><td>Person or team name (from the Resource column on tasks)</td></tr>
          <tr><td>Tasks</td><td>Number of tasks assigned</td></tr>
          <tr><td>Total Hours</td><td>Sum of all planned hours across their tasks</td></tr>
          <tr><td>Max Daily Load</td><td>The busiest single working day for this person</td></tr>
          <tr><td>Overloaded Days</td><td>Number of days where their load exceeds the calendar's hours-per-day limit</td></tr>
        </table>
        <p style="margin-top:6px">Rows with overloaded days are listed first — they need attention. Fix overloads by adjusting task dates, splitting tasks, or reassigning resources.</p>
      </section>

      <section>
        <h3>Board View: Drag-and-Drop Workflow</h3>
        <p>Switch to <code>View → Board</code> to see tasks as cards arranged in columns. The <code>Group By</code> dropdown controls what the columns represent.</p>
        <h4>Moving cards</h4>
        <p>Drag a card from one column to another. The task's field updates automatically:</p>
        <table>
          <tr><th>Grouped by</th><th>What changes when you drag</th></tr>
          <tr><td>Status</td><td>Task status updates (e.g. drag to "Done" → progress set to 100%)</td></tr>
          <tr><td>Priority</td><td>Task priority updates</td></tr>
          <tr><td>Sprint</td><td>Task moves to that sprint (or Backlog)</td></tr>
          <tr><td>Resource</td><td>Task is reassigned to that person</td></tr>
          <tr><td>Task Type</td><td>Task type changes to match the column</td></tr>
        </table>
        <div class="help-tip">💡 <strong>Tip:</strong> Use <code>Group By → Status</code> for a classic Kanban board. Use <code>Group By → Sprint</code> for sprint planning (same as Sprint view). Use <code>Group By → Resource</code> to quickly redistribute work.</div>
      </section>

      <section>
        <h3>Dashboard: Project Health at a Glance</h3>
        <p>Switch to <code>View → Dashboard</code> for a summary of 12 project health metrics:</p>
        <table>
          <tr><th>Metric</th><th>What it counts</th></tr>
          <tr><td>Total Tasks</td><td>All leaf (non-summary) tasks visible under the current filter</td></tr>
          <tr><td>Critical Tasks</td><td>Tasks with zero float (on the critical path)</td></tr>
          <tr><td>Near Critical</td><td>Tasks with ≤ 2 days of float</td></tr>
          <tr><td>Slipped</td><td>Tasks where actual dates exceed planned dates</td></tr>
          <tr><td>At Risk</td><td>Tasks past their planned end but not complete</td></tr>
          <tr><td>Baseline Variance</td><td>Tasks that have drifted from the baseline</td></tr>
          <tr><td>Overloaded Resources</td><td>Count of people with at least one overallocated day</td></tr>
          <tr><td>Open RAID Items</td><td>Risks, issues, and assumptions not yet closed</td></tr>
          <tr><td>Actual Work</td><td>Total hours logged across all tasks</td></tr>
          <tr><td>Remaining Work</td><td>Total remaining hours still to be done</td></tr>
          <tr><td>Scenarios</td><td>Number of saved what-if scenario snapshots</td></tr>
          <tr><td>Project Finish</td><td>The latest planned end date across all scheduled tasks</td></tr>
        </table>
      </section>

      <section>
        <h3>RAID Log: Tracking Risks and Issues</h3>
        <p>RAID stands for <strong>Risks, Assumptions, Issues, Dependencies, and Decisions</strong>. Switch to <code>View → RAID</code> to see all entries.</p>
        <h4>Adding a RAID item</h4>
        <ol class="help-steps">
          <li>Go to <code>Tools &gt; Add RAID Item</code>.</li>
          <li>Choose the type: <em>Risk</em>, <em>Assumption</em>, <em>Issue</em>, <em>Dependency</em>, or <em>Decision</em>.</li>
          <li>Enter a title, the owner responsible, a due date (optional), the linked task's WBS code (optional), and any notes.</li>
          <li>The item appears in the RAID table in <code>View → RAID</code> with status <em>Open</em>.</li>
        </ol>
        <h4>Change Log</h4>
        <p>Use <code>Tools &gt; Log Change</code> to record scope changes, decisions, or anything else you want an audit trail for. Each entry is timestamped automatically. The Change Log table appears below the RAID table in the RAID view and in the Excel export.</p>
      </section>

      <section>
        <h3>Scenarios: What-If Planning</h3>
        <p>Scenarios let you snapshot your current plan and then experiment safely. For example: "what if we move the launch back two weeks?"</p>
        <ol class="help-steps">
          <li>Before making changes, go to <code>Tools &gt; Save Scenario</code> and give it a name (e.g. <em>Original Plan</em>).</li>
          <li>Make your changes (shift dates, reassign tasks, adjust scope).</li>
          <li>Go to <code>Tools &gt; Compare Scenario</code>, select <em>Original Plan</em>, and see:
            <ul>
              <li>How much the project finish date has shifted</li>
              <li>How many tasks changed (start date, end date, duration, or progress)</li>
            </ul>
          </li>
        </ol>
        <div class="help-tip">💡 <strong>Tip:</strong> Save a scenario before every major replanning session. You can have as many scenarios as you like. The Dashboard shows the total count.</div>
      </section>

      <section>
        <h3>Saved Views</h3>
        <p>A saved view remembers a combination of <strong>View mode + Filter + Group By</strong>. Six defaults are pre-loaded:</p>
        <table>
          <tr><th>Saved view</th><th>What it shows</th></tr>
          <tr><td>Default</td><td>Split view, all tasks, no grouping</td></tr>
          <tr><td>Slipped Tasks</td><td>Split view, slipped tasks only</td></tr>
          <tr><td>Milestones</td><td>Gantt view, milestones only</td></tr>
          <tr><td>Current Sprint</td><td>Sprint view, current sprint tasks</td></tr>
          <tr><td>Resource Load</td><td>Board view, all tasks grouped by resource</td></tr>
          <tr><td>Baseline Variance</td><td>Split view, tasks with variance from baseline</td></tr>
        </table>
        <p style="margin-top:6px">To save your own view: set the View, Filter, and Group By to your preference, then go to <code>Tools &gt; Save View</code> and give it a name. It appears in the <code>Saved Views</code> dropdown immediately.</p>
      </section>

      <section>
        <h3>Importing Data</h3>
        <h4>From CSV</h4>
        <p>Click <code>Import SQL/CSV</code> and select a <code>.csv</code> file. NovaPlan recognises many column name variations:</p>
        <table>
          <tr><th>Field</th><th>Accepted CSV column names</th></tr>
          <tr><td>Task name</td><td>Task Name, Title, Summary, Name</td></tr>
          <tr><td>Start date</td><td>Planned Start Date, Start Date, Start, start_date</td></tr>
          <tr><td>End date</td><td>Planned End Date, Due Date, Finish, End, end_date</td></tr>
          <tr><td>Progress</td><td>% Complete, Progress, progress</td></tr>
          <tr><td>Resource</td><td>Resource, Assignee, resource</td></tr>
          <tr><td>Status</td><td>Status, status</td></tr>
          <tr><td>Priority</td><td>Priority, priority</td></tr>
          <tr><td>Milestone</td><td>Milestone, is_milestone (yes/true/1)</td></tr>

        <h4>From SQL (full restore)</h4>
        <p>Click <code>Import SQL/CSV</code> and select a <code>.sql</code> file previously exported from NovaPlan. This <strong>replaces</strong> your entire database. All tasks, sprints, baselines, RAID items, and change logs are restored.</p>

      <section>

      <section>
        <h3>Storage and Your Data</h3>

          <tr><th>Badge</th><th>When it activates</th><th>Notes</th></tr>

          <li><strong>Jira integration:</strong> Enter Jira URLs in the <code>Jira</code> column. The Jira CSV export lets you bulk-import the plan into Jira as new issues.</li>

    const state = {
      storage: null,
