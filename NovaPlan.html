      { label: "Crit", key: "is_critical", width: 62, title: "Critical Path — auto-calculated. Shows 'Critical' when a task has zero float (any delay pushes the project end). Requires tasks to have dependencies and different durations. Read-only; not manually editable." },
      { label: "Float", key: "total_float_days", width: 72, title: "Total Float — days a task can slip before it delays the project end. Auto-calculated from the dependency network. Read-only." },
      { label: "Sprint", key: "sprint_name", editable: true, width: 126 },
      { label: "Slip", key: "slippage_status", width: 86, title: "Slippage — auto-detected. 'Slipped' when actual dates exceed planned; 'At risk' when planned end has passed with progress < 100%. Read-only." },
      { label: "Base End", key: "baseline_end_date", width: 110, title: "Baseline finish date saved via Tools → Set Baseline. Read-only." },
      { label: "Finish Var", key: "finish_variance_days", width: 90, title: "Days between current Plan End and Baseline End. Positive = later than baseline. Read-only." },
      { label: "Predecessors", key: "predecessors_display", editable: true, width: 128 },
      { label: "Resource", key: "resource", editable: true, width: 150 },
      { label: "Tags", key: "tags", editable: true, width: 140 },
      { label: "Jira", key: "jira_url", editable: true, width: 150 },
      { label: "Comments", key: "comments", editable: true, width: 230 },
      { label: "Actions", key: "actions", width: 86 }
    ];

    const DataGrid = {
      get columns() {
        const list = [...BASE_COLUMNS];
        const custom = state.customColumns || [];
        for (const col of custom) {
          const idx = list.findIndex(c => c.key === "jira_url");
          if (idx !== -1) {
            list.splice(idx, 0, { label: col.label, key: col.key, editable: true, width: col.width || 120, isCustom: true });
          } else {
            list.push({ label: col.label, key: col.key, editable: true, width: col.width || 120, isCustom: true });
          }
        }
        return list;
      },
      // Structural columns that cannot be hidden (selection, name, row actions).
      alwaysVisible: ["select", "title", "actions"],
      columnDrag: null,
      hiddenColumns() {
        return new Set(Array.isArray(state.settings?.hiddenColumns) ? state.settings.hiddenColumns : []);
      },
      orderedColumns() {
        const order = Array.isArray(state.settings?.columnOrder) ? state.settings.columnOrder : [];
        const byKey = new Map(this.columns.map(col => [col.key, col]));
        const seen = new Set();
        const ordered = [];
        for (const key of order) {
          if (!byKey.has(key) || seen.has(key)) continue;
          ordered.push(byKey.get(key));
          seen.add(key);
        }
        for (const col of this.columns) {
          if (seen.has(col.key)) continue;
          ordered.push(col);
          seen.add(col.key);
        }
        return ordered;
      },
      visibleColumns() {
        const hidden = this.hiddenColumns();
        return this.orderedColumns().filter(col => this.alwaysVisible.includes(col.key) || !hidden.has(col.key));
      },
      getPinnedOffsets() {
        const pinnedKeys = ["select", "wbs_code", "title"];
        const offsets = {};
        let currentLeft = 0;
        for (const col of this.visibleColumns()) {
          if (pinnedKeys.includes(col.key)) {
            offsets[col.key] = currentLeft;
            currentLeft += col.width;
          }
        }
        return offsets;
      },
      render(tasks) {
        el.taskCount.textContent = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`;
        const table = document.createElement("table");
        table.innerHTML = "";
        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        const pinnedOffsets = this.getPinnedOffsets();
        for (const col of this.visibleColumns()) {
          const th = document.createElement("th");
          th.style.width = `${col.width}px`;
          th.textContent = col.label;
          th.dataset.colKey = col.key;
          th.className = "column-draggable";
          th.title = col.title || "Drag to reorder column";
          if (col.title) th.title = col.title;
          if (col.key in pinnedOffsets) {
            th.classList.add("sticky-col");
            th.style.left = `${pinnedOffsets[col.key]}px`;
          }
          headRow.appendChild(th);
        }
        thead.appendChild(headRow);
        const tbody = document.createElement("tbody");
        for (const task of tasks) tbody.appendChild(this.renderRow(task, pinnedOffsets));
        table.append(thead, tbody);
        el.grid.replaceChildren(table);
      },
      renderRow(task, pinnedOffsets) {
        pinnedOffsets = pinnedOffsets || this.getPinnedOffsets();
        const tr = document.createElement("tr");
        tr.dataset.taskId = task.id;
        if (task.is_highlighted) tr.classList.add("is-highlighted");
        if (task.is_milestone) tr.classList.add("is-milestone");
        if (task.is_summary) tr.classList.add("is-summary");
        if (task.is_critical) tr.classList.add("is-critical");
        if (task.has_baseline_variance) tr.classList.add("has-baseline-variance");
        if (task.slippage_status === "slipped") tr.classList.add("is-slipped");
        if (task.slippage_status === "at-risk") tr.classList.add("is-at-risk");

        const rules = getConditionalRules();
        let matchedRowRule = null;
        for (const rule of rules) {
          if (!rule.enabled) continue;
          let match = false;
          if (rule.condition === "slipped" && task.slippage_status === "slipped") match = true;
          else if (rule.condition === "critical" && task.is_critical) match = true;
          else if (rule.condition === "blocked" && String(task.status).toLowerCase() === "blocked") match = true;
          else if (rule.condition === "completed" && String(task.status).toLowerCase() === "completed") match = true;
          else if (rule.condition === "high_priority" && ["high", "critical"].includes(String(task.priority).toLowerCase())) match = true;

          if (match && rule.target === "row") {
            matchedRowRule = rule;
            break;
          }
        }

        if (matchedRowRule) {
          tr.style.setProperty("--cf-bg", matchedRowRule.color);
          tr.style.setProperty("--cf-color", matchedRowRule.textColor);
          tr.classList.add("cf-row-highlight");
        }

        for (const col of this.visibleColumns()) {
          const td = document.createElement("td");
          td.style.width = `${col.width}px`;
          td.dataset.key = col.key;
          if (col.editable) {
            td.dataset.editable = "true";
            td.className = "cell-editable";
          }
          if (col.key in pinnedOffsets) {
            td.classList.add("sticky-col");
            td.style.left = `${pinnedOffsets[col.key]}px`;
          }
          this.fillCell(td, col, task);

          if (!matchedRowRule) {
            for (const rule of rules) {
              if (!rule.enabled || rule.target !== "cell" || rule.column !== col.key) continue;
              let match = false;
              if (rule.condition === "slipped" && task.slippage_status === "slipped") match = true;
              else if (rule.condition === "critical" && task.is_critical) match = true;
              else if (rule.condition === "blocked" && String(task.status).toLowerCase() === "blocked") match = true;
              else if (rule.condition === "completed" && String(task.status).toLowerCase() === "completed") match = true;
              else if (rule.condition === "high_priority" && ["high", "critical"].includes(String(task.priority).toLowerCase())) match = true;

              if (match) {
                td.style.setProperty("background-color", rule.color, "important");
                td.style.setProperty("color", rule.textColor, "important");
                break;
              }
            }
          }

          tr.appendChild(td);
        }
        return tr;
      },
      fillCell(td, col, task) {
        if (col.key === "select") {
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.className = "row-select";
          cb.checked = state.selectedIds.has(task.id);
          cb.setAttribute("aria-label", `Select ${task.title}`);
          td.appendChild(cb);
          return;
        }
        if (col.key === "is_highlighted") {
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.className = "highlight-toggle";
          cb.checked = Boolean(task.is_highlighted);
          cb.setAttribute("aria-label", `Highlight ${task.title}`);
          td.appendChild(cb);
          return;
        }
        if (col.key === "is_milestone") {
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.className = "milestone-toggle";
          cb.checked = Boolean(task.is_milestone);
          cb.setAttribute("aria-label", `Mark ${task.title} as milestone`);
          td.appendChild(cb);
          return;
        }
        if (col.key === "actions") {
          const info = document.createElement("button");
          info.className = "icon-btn view-details";
          info.type = "button";
          info.textContent = "ℹ️";
          info.title = "View task details";
          const add = document.createElement("button");
          add.className = "icon-btn add-child";
          add.type = "button";
          add.textContent = "+";
          add.title = "Add child task";
          const del = document.createElement("button");
          del.className = "icon-btn delete-task danger";
          del.type = "button";
          del.textContent = "×";
          del.title = "Delete task";
          td.append(info, add, del);
          return;
        }
        if (col.key === "title") {
          td.style.paddingLeft = `${8 + (task.wbs_code.split(".").length - 1) * 16}px`;
          if (task.is_summary) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "collapse-toggle";
            btn.title = state.collapsedIds.has(task.id) ? "Expand subtasks" : "Collapse subtasks";
            btn.textContent = state.collapsedIds.has(task.id) ? "▸" : "▾";
            td.appendChild(btn);
          }
          td.appendChild(document.createTextNode(task.title));
          return;
        }
        if (col.key === "task_type") {
          td.textContent = `${task.task_type} ${TaskTypes[task.task_type]?.label || "Planning"}`;
          return;
        }
        if (col.key === "color") {
          const wrap = document.createElement("div");
          wrap.style.cssText = "display:flex;align-items:center;gap:3px;padding:0 6px";
          const typeColor = task.is_summary ? "#7d8590" : (TaskTypes[task.task_type]?.color || "#666688");
          const inp = document.createElement("input");
          inp.type = "color";
          inp.className = "color-input";
          inp.value = task.color || typeColor;
          inp.title = task.color ? "Custom color — click to change" : "Task type color — click to set a custom color";
          inp.style.cssText = "width:30px;height:22px;padding:1px 2px;cursor:pointer;border-radius:3px;border:1px solid var(--border);background:none";
          if (task.color) inp.style.boxShadow = "0 0 0 2px var(--neon-cyan)";
          wrap.appendChild(inp);
          if (task.color) {
            const clr = document.createElement("button");
            clr.type = "button";
            clr.className = "icon-btn color-clear";
            clr.textContent = "✕";
            clr.title = "Reset to task type color";
            clr.style.cssText = "width:18px;height:18px;font-size:10px;padding:0;line-height:1;flex-shrink:0";
            wrap.appendChild(clr);
          }
          td.appendChild(wrap);
          return;
        }
        if (col.key === "comments") {
          const span = document.createElement("span");
          span.className = "comments-preview";
          span.textContent = task.comments || "";
          td.appendChild(span);
          return;
        }
        if (col.key === "jira_url") {
          if (!task.jira_url) {
            td.textContent = "";
            return;
          }
          const link = document.createElement("a");
          link.href = task.jira_url;
          link.target = "_blank";
          link.rel = "noopener";
          link.className = "jira-link";
          link.textContent = "Open Jira";
          td.appendChild(link);
          return;
        }

        if (col.isCustom) {
          let customVals = {};
          try {
            customVals = JSON.parse(task.custom_fields_json || "{}");
          } catch {}
          td.textContent = text(customVals[col.key]);
          return;
        }
        if (col.key === "slippage_status") {
          td.textContent = task.slippage_status === "slipped" ? "Slipped" : task.slippage_status === "at-risk" ? "At risk" : "";
          return;
        }
        if (col.key === "is_critical") {
          if (task.is_critical || task.is_near_critical) {
            const badge = document.createElement("span");
            badge.className = `badge ${task.is_critical ? "critical-badge" : ""}`;
            badge.textContent = task.is_critical ? "Critical" : "Near";
            td.appendChild(badge);
          }
          return;
        }
        if (col.key === "total_float_days") {
          td.textContent = task.total_float_days === "" ? "" : `${formatNumber(task.total_float_days || 0)}d`;
          return;
        }
        if (col.key === "finish_variance_days") {
          td.textContent = task.finish_variance_days === "" ? "" : `${formatNumber(task.finish_variance_days)}d`;
          return;
        }
        if (col.key === "baseline_end_date") {
          td.textContent = task.baseline_end_date || "";
          return;
        }
        td.textContent = text(task[col.key]);
      },
      async handleClick(event) {
        const row = event.target.closest("tr[data-task-id]");
        if (!row) return;
        const task = findTask(Number(row.dataset.taskId));
        if (!task) return;
        if (event.target.closest("a")) return;
        if (event.target.classList.contains("add-child")) {
          await AppShell.addChildTask(task);
          return;
        }
        if (event.target.classList.contains("color-clear")) {
          await state.storage.updateTask(task.id, { color: "" });
          await AppShell.refresh();
          return;
        }
        if (event.target.classList.contains("delete-task")) {
          await AppShell.deleteTasks([task.id], `Delete "${task.title}" and its subtasks?`);
          return;
        }
        if (event.target.classList.contains("view-details")) {
          DetailsDrawer.open(task.id);
          return;
        }
        if (event.target.classList.contains("collapse-toggle")) {
          state.collapsedIds.has(task.id) ? state.collapsedIds.delete(task.id) : state.collapsedIds.add(task.id);
          await AppShell.refresh();
          return;
        }
        const td = event.target.closest("td[data-editable='true']");
        if (td && !td.querySelector("input,select,textarea")) this.startEdit(td, task);
      },
      async handleChange(event) {
        const row = event.target.closest("tr[data-task-id]");
        if (!row) return;
        const task = findTask(Number(row.dataset.taskId));
        if (!task) return;
        if (event.target.classList.contains("row-select")) {
          event.target.checked ? state.selectedIds.add(task.id) : state.selectedIds.delete(task.id);
          updateBulkDeleteState();
        }
        if (event.target.classList.contains("highlight-toggle")) {
          await state.storage.updateTask(task.id, { is_highlighted: event.target.checked ? 1 : 0 });
          await AppShell.refresh();
        }
        if (event.target.classList.contains("milestone-toggle")) {
          await state.storage.updateTask(task.id, { is_milestone: event.target.checked ? 1 : 0 });
          await AppShell.refresh();
        }
        if (event.target.classList.contains("color-input")) {
          const hex = event.target.value;
          await state.storage.updateTask(task.id, { color: /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : "" });
          await AppShell.refresh();
        }
      },
      startEdit(td, task) {
        const key = td.dataset.key;
        const col = this.columns.find(c => c.key === key);
        let previous = "";
        if (col && col.isCustom) {
          let customVals = {};
          try { customVals = JSON.parse(task.custom_fields_json || "{}"); } catch {}
          previous = text(customVals[key]);
        } else {
          previous = key === "predecessors_display" ? task.predecessors_display : key === "sprint_name" ? task.sprint_name : text(task[key]);
        }
        td.replaceChildren();
        let input;
        if (["task_type", "status", "priority", "sprint_name"].includes(key)) {
          input = document.createElement("select");
          const options = key === "task_type"
            ? Object.keys(TaskTypes).map(type => ({ value: type, label: `${type} ${TaskTypes[type].label}` }))
            : key === "status"
              ? TASK_STATUSES.map(status => ({ value: status, label: status }))
              : key === "priority"
                ? TASK_PRIORITIES.map(priority => ({ value: priority, label: priority }))
                : [{ value: "", label: "Backlog" }, ...state.sprints.map(sprint => ({ value: String(sprint.id), label: sprint.name }))];
          for (const item of options) {
            const option = document.createElement("option");
            option.value = item.value;
            option.textContent = item.label;
            input.appendChild(option);
          }
          input.value = key === "sprint_name" ? (task.sprint_id == null ? "" : String(task.sprint_id)) : task[key];
          input.className = "grid-select";
        } else if (key === "comments") {
          input = document.createElement("textarea");
          input.className = "grid-textarea";
          input.value = previous;
        } else {
          input = document.createElement("input");
          input.className = "grid-input";
          input.value = previous;
          input.type = ["start_date", "end_date", "actual_start_date", "actual_end_date"].includes(key) ? "date" : ["progress", "duration_hours", "actual_hours", "remaining_hours"].includes(key) ? "number" : "text";
          if (key === "progress") {
            input.min = "0";
            input.max = "100";
          }
          if (key === "duration_hours") {
            input.min = "0.25";
            input.step = "0.25";
          }
          if (["actual_hours", "remaining_hours"].includes(key)) {
            input.min = "0";
            input.step = "0.25";
          }
        }
        input.dataset.previous = previous;
        td.appendChild(input);
        input.focus();
        input.select?.();
        let committed = false;
        const commit = async () => {
          if (committed) return;
          committed = true;
          await this.commitEdit(td, task, key, input.value, previous);
        };
        input.addEventListener("blur", commit);
        input.addEventListener("keydown", event => {
          if (event.key === "Enter" && key !== "comments") {
            event.preventDefault();
            input.blur();
          }
          if (event.key === "Escape") {
            committed = true;
            AppShell.refresh();
          }
        });
      },
      columnHeaderFromPoint(x, y) {
        const target = document.elementFromPoint(x, y);
        const th = target?.closest?.("th[data-col-key]");
        return th && el.grid.contains(th) ? th : null;
      },
      columnHeaderFromEvent(event) {
        const target = event.target instanceof Element ? event.target : event.target?.parentElement;
        const th = target?.closest?.("th[data-col-key]");
        return th && el.grid.contains(th) ? th : null;
      },
      handleColumnMouseDown(event) {
        if (event.button !== 0) return;
        const th = this.columnHeaderFromEvent(event);
        if (!th) return;
        this.columnDrag = {
          sourceKey: th.dataset.colKey,
          startX: event.clientX,
          startY: event.clientY,
          active: false
        };
      },
      handleColumnMouseMove(event) {
        const drag = this.columnDrag;
        if (!drag) return;
        drag.lastX = event.clientX;
        drag.lastY = event.clientY;
        if (!drag.active) {
          const distance = Math.abs(event.clientX - drag.startX) + Math.abs(event.clientY - drag.startY);
          if (distance < 6) return;
          drag.active = true;
          this.startColumnAutoScroll();
        }
        event.preventDefault();
        this.updateColumnDragIndicators(event.clientX, event.clientY);
      },
      async handleColumnMouseUp(event) {
        const drag = this.columnDrag;
        if (!drag) return;
        this.columnDrag = null;
        if (drag.scrollFrame) cancelAnimationFrame(drag.scrollFrame);
        const wasActive = drag.active;
        const target = this.columnHeaderFromPoint(event.clientX, event.clientY);
        this.clearColumnDropIndicators();
        if (!wasActive || !target || target.dataset.colKey === drag.sourceKey) return;
        event.preventDefault();
        const rect = target.getBoundingClientRect();
        await this.reorderColumn(drag.sourceKey, target.dataset.colKey, event.clientX > rect.left + rect.width / 2);
      },
      clearColumnDropIndicators() {
        el.grid.querySelectorAll("th").forEach(th => th.classList.remove("column-dragging", "column-drop-left", "column-drop-right"));
      },
      updateColumnDragIndicators(x, y) {
        const drag = this.columnDrag;
        if (!drag) return;
        this.clearColumnDropIndicators();
        const source = el.grid.querySelector(`th[data-col-key="${drag.sourceKey}"]`);
        if (source) source.classList.add("column-dragging");
        const target = this.columnHeaderFromPoint(x, y);
        if (!target || target.dataset.colKey === drag.sourceKey) return;
        const rect = target.getBoundingClientRect();
        target.classList.add(x > rect.left + rect.width / 2 ? "column-drop-right" : "column-drop-left");
      },
      startColumnAutoScroll() {
        const drag = this.columnDrag;
        if (!drag || drag.scrollFrame) return;
        const step = () => {
          const current = this.columnDrag;
          if (!current?.active) return;
          const rect = el.grid.getBoundingClientRect();
          const threshold = 56;
          let delta = 0;
          if (current.lastX < rect.left + threshold) {
            delta = -Math.ceil((rect.left + threshold - current.lastX) / 3);
          } else if (current.lastX > rect.right - threshold) {
            delta = Math.ceil((current.lastX - (rect.right - threshold)) / 3);
          }
          if (delta) {
            el.grid.scrollLeft += delta;
            this.updateColumnDragIndicators(current.lastX, current.lastY);
          }
          current.scrollFrame = requestAnimationFrame(step);
        };
        drag.scrollFrame = requestAnimationFrame(step);
      },
      async reorderColumn(sourceKey, targetKey, placeAfter = false) {
        const current = this.orderedColumns().map(col => col.key);
        const from = current.indexOf(sourceKey);
        let to = current.indexOf(targetKey);
        if (from < 0 || to < 0 || sourceKey === targetKey) return;
        const [moved] = current.splice(from, 1);
        if (from < to) to -= 1;
        current.splice(placeAfter ? to + 1 : to, 0, moved);
        state.settings.columnOrder = current;
        await state.storage.saveSetting("columnOrder", current);
        await AppShell.refresh();
        showToast("Column order updated", "success");
      },
      async commitEdit(td, task, key, value, previous) {
        try {
          const fields = this.normalizeEdit(task, key, value);
          const shouldScrollGantt = ["start_date", "end_date", "actual_start_date", "actual_end_date", "duration_hours", "predecessors_display"].includes(key);
          await state.storage.updateTask(task.id, fields);
          await AppShell.refresh();
          if (shouldScrollGantt) GanttChart.scrollToTask(task.id);
        } catch (error) {
          showToast(error.message, "error");
          await AppShell.refresh();
        }
      },
      normalizeEdit(task, key, value) {
        const trimmed = text(value).trim();
        const isCustomCol = (state.customColumns || []).some(c => c.key === key);
        if (isCustomCol) {
          let customVals = {};
          try {
            customVals = JSON.parse(task.custom_fields_json || "{}");
          } catch {}
          customVals[key] = trimmed;
          return { custom_fields_json: JSON.stringify(customVals) };
        }

        if (key === "title") {
          if (!trimmed) throw new Error("Task name is required");
          return { title: trimmed };
        }
        if (key === "start_date") {
          if (!isValidIsoDate(trimmed)) throw new Error("Start date must be valid");
          return { start_date: trimmed, end_date: shiftedEndForStart(task, trimmed) };
        }
        if (key === "end_date") {
          if (!isValidIsoDate(trimmed)) throw new Error("End date must be valid");
          if (task.start_date && trimmed < task.start_date) throw new Error("End date must be on or after start date");
          return { end_date: trimmed };
        }
        if (key === "actual_start_date") {
          if (!trimmed) return { actual_start_date: null };
          if (!isValidIsoDate(trimmed)) throw new Error("Actual start date must be valid");
          if (task.actual_end_date && trimmed > task.actual_end_date) throw new Error("Actual start must be on or before actual end");
          return { actual_start_date: trimmed };
        }
        if (key === "actual_end_date") {
          if (!trimmed) return { actual_end_date: null };
          if (!isValidIsoDate(trimmed)) throw new Error("Actual end date must be valid");
          if (task.actual_start_date && trimmed < task.actual_start_date) throw new Error("Actual end must be on or after actual start");
          return { actual_end_date: trimmed };
        }
        if (key === "duration_hours") {
          const n = Number(trimmed);
          if (!Number.isFinite(n) || n <= 0) throw new Error("Duration hours must be greater than 0");
          return { duration_hours: Math.round(n * 4) / 4 };
        }
        if (key === "actual_hours" || key === "remaining_hours") {
          const n = Number(trimmed);
          if (!Number.isFinite(n) || n < 0) throw new Error("Work hours must be 0 or greater");
          return { [key]: Math.round(n * 4) / 4 };
        }
        if (key === "progress") {
          const n = Number(trimmed);
          if (!Number.isInteger(n) || n < 0 || n > 100) throw new Error("Progress must be an integer from 0 to 100");
          return { progress: n, status: statusForProgress(n), remaining_hours: Math.round(durationHours(task) * (100 - n)) / 100 };
        }
        if (key === "predecessors_display") {
          const resolved = WBSUtils.resolvePredecessorCodesToIds(trimmed, task, state.tasks);
          if (resolved.error) throw new Error(resolved.error);
          const fields = { predecessor_ids: resolved.ids.join(","), __dependencies: resolved.specs };
          // Auto-schedule: shift task dates to respect the new predecessor constraints
          if (resolved.specs.length > 0) {
            const byId = new Map(state.tasks.map(t => [t.id, t]));
            const { start_date, end_date } = computeDatesFromDeps(task, resolved.specs, byId);
            if (start_date && isValidIsoDate(start_date)) fields.start_date = start_date;
            if (end_date && isValidIsoDate(end_date)) fields.end_date = end_date;
          }
          return fields;
        }
        if (key === "resource") return { resource: trimmed.slice(0, 100) };
        if (key === "comments") return { comments: trimmed.slice(0, 2000) };
        if (key === "gantt_label") {
          const ganttLabel = trimmed.slice(0, 120);
          return { gantt_label: ganttLabel, gantt_label_position: ganttLabel ? (task.gantt_label_position || "above") : "" };
        }
        if (key === "tags") return { tags: splitCsv(trimmed).join(",") };
        if (key === "jira_url") return { jira_url: normalizeJiraUrl(trimmed) };
        if (key === "task_type") return { task_type: TaskTypes[trimmed] ? trimmed : DEFAULT_TYPE };
        if (key === "status") return fieldsForStatus(trimmed, task);
        if (key === "priority") return { priority: TASK_PRIORITIES.includes(trimmed) ? trimmed : "Medium" };
        if (key === "sprint_name") return { sprint_id: trimmed ? Number(trimmed) : null };
        return {};
      }
    };

    const ContextMenu = {
      activeTaskId: null,
      show(taskId, x, y) {
        this.activeTaskId = taskId;
        const task = findTask(taskId);
        if (!task) return;

        el.contextMenu.replaceChildren();

        const items = [
          { label: "👁️ View Details", action: () => DetailsDrawer.open(this.activeTaskId) },
          { separator: true },
          { label: "➡️ Indent Task", action: () => this.indent() },
          { label: "⬅️ Outdent Task", action: () => this.outdent() },
          { separator: true },
          { label: "🏃 Assign Sprint", action: () => this.assignSprint() },
          { label: "🎨 Set Accent Color", action: () => this.setAccentColor() },
          { separator: true },
          { label: "🗑️ Delete Task", action: () => this.delete(), danger: true }
        ];

        items.forEach(item => {
          if (item.separator) {
            const div = document.createElement("div");
            div.className = "context-menu-separator";
            el.contextMenu.appendChild(div);
          } else {
            const btn = document.createElement("div");
            btn.className = "context-menu-item" + (item.danger ? " danger" : "");
            btn.textContent = item.label;
            btn.addEventListener("click", () => {
              el.contextMenu.style.display = "none";
              item.action();
            });
            el.contextMenu.appendChild(btn);
          }
        });

        el.contextMenu.style.left = `${x}px`;
        el.contextMenu.style.top = `${y}px`;
        el.contextMenu.style.display = "block";

        const rect = el.contextMenu.getBoundingClientRect();
        if (rect.right > window.innerWidth) {
          el.contextMenu.style.left = `${window.innerWidth - rect.width - 8}px`;
        }
        if (rect.bottom > window.innerHeight) {
          el.contextMenu.style.top = `${window.innerHeight - rect.height - 8}px`;
        }
      },
      async indent() {
        if (this.activeTaskId == null) return;
        const taskId = this.activeTaskId;
        const sorted = sortTasksByWbs(state.tasks);
        const idx = sorted.findIndex(t => t.id === taskId);
        if (idx <= 0) {
          showToast("Cannot indent the first task", "error");
          return;
        }
        const preceding = sorted[idx - 1];
        await state.storage.updateTask(taskId, { parent_id: preceding.id });
        await AppShell.refresh();
        showToast("Task indented", "success");
      },
      async outdent() {
        if (this.activeTaskId == null) return;
        const taskId = this.activeTaskId;
        const task = findTask(taskId);
        if (!task || task.parent_id == null) {
          showToast("Task is already at the root level", "error");
          return;
        }
        const parent = findTask(task.parent_id);
        const grandparentId = parent ? parent.parent_id : null;
        await state.storage.updateTask(taskId, { parent_id: grandparentId });
        await AppShell.refresh();
        showToast("Task outdented", "success");
      },
      async assignSprint() {
        if (this.activeTaskId == null) return;
        const task = findTask(this.activeTaskId);
        if (!task) return;

        const sprintOptions = [
          { value: "", label: "None (Backlog)" },
          ...state.sprints.map(s => ({ value: String(s.id), label: s.name }))
        ];

        const res = await showFormDialog({
          title: "Assign Sprint",
          fields: [
            {
              name: "sprintId",
              label: "Select Sprint",
              type: "select",
              value: task.sprint_id != null ? String(task.sprint_id) : "",
              options: sprintOptions
            }
          ]
        });

        if (res) {
          const newSprintId = res.sprintId ? Number(res.sprintId) : null;
          await state.storage.updateTask(task.id, { sprint_id: newSprintId });
          await AppShell.refresh();
          showToast("Sprint assigned successfully", "success");
        }
      },
      async setAccentColor() {
        if (this.activeTaskId == null) return;
        const task = findTask(this.activeTaskId);
        if (!task) return;

        const res = await showFormDialog({
          title: "Set Custom Accent Color",
          fields: [
            {
              name: "color",
              label: "Custom Accent Color",
              type: "color",
              value: task.color || "#666688"
            }
          ]
        });

        if (res) {
          const hex = res.color;
          await state.storage.updateTask(task.id, { color: /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : "" });
          await AppShell.refresh();
          showToast("Accent color updated", "success");
        }
      },
      async delete() {
        if (this.activeTaskId == null) return;
        await AppShell.deleteTasks([this.activeTaskId], "Delete this task and all of its subtasks?");
      }
    };

    const GanttChart = {
      render(tasks) {
        const scheduled = tasks.filter(t => isValidIsoDate(t.start_date) && isValidIsoDate(t.end_date));
        if (!scheduled.length) {
          state.gantt = { minDate: null, maxDate: null, svgWidth: 0, svgHeight: tasks.length * ROW_HEIGHT, scheduled: [] };
          el.timelineRange.textContent = "No schedule";
          el.ganttHeader.replaceChildren();
          const empty = document.createElement("div");
          empty.className = "p-6 text-sm text-slate-400";
          empty.textContent = "No scheduled tasks";
          el.ganttBody.replaceChildren(empty);
          return;
        }
        const customLineDates = sanitizeGanttLines(state.settings?.ganttLines).filter(line => line.type === "date").map(line => line.date);
        const timelineDates = scheduled
          .flatMap(t => [t.start_date, t.end_date, t.actual_start_date, t.actual_end_date, t.baseline_start_date, t.baseline_end_date].filter(isValidIsoDate))
          .concat(customLineDates);
        const minDate = timelineDates.sort()[0];
        const maxDate = timelineDates.sort().at(-1);
        const totalDays = daysBetween(minDate, maxDate) + 1;
        const svgWidth = Math.max(640, totalDays * pxPerDay() + 40);
        const svgHeight = Math.max(200, tasks.length * ROW_HEIGHT);
        state.gantt = { minDate, maxDate, svgWidth, svgHeight, scheduled };
        el.timelineRange.textContent = `${minDate} to ${maxDate}`;
        el.ganttHeader.replaceChildren(this.buildHeaderSvg(minDate, maxDate, svgWidth));
        el.ganttBody.replaceChildren(this.buildBodySvg(tasks, minDate, svgWidth, svgHeight));
      },
      scrollToTask(taskId) {
        const bar = el.ganttBody.querySelector(`.gantt-bar[data-task-id="${Number(taskId)}"]`);
        if (!bar || typeof bar.getBBox !== "function") return false;
        const box = bar.getBBox();
        const maxLeft = Math.max(0, el.ganttBody.scrollWidth - el.ganttBody.clientWidth);
        const maxTop = Math.max(0, el.ganttBody.scrollHeight - el.ganttBody.clientHeight);
        let left = el.ganttBody.scrollLeft;
        let top = el.ganttBody.scrollTop;
        if (box.x < left || box.x + box.width > left + el.ganttBody.clientWidth) {
          left = clamp(box.x - (el.ganttBody.clientWidth - box.width) / 2, 0, maxLeft);
        }
        if (box.y < top || box.y + box.height > top + el.ganttBody.clientHeight) {
          top = clamp(box.y - (el.ganttBody.clientHeight - box.height) / 2, 0, maxTop);
        }
        el.ganttBody.scrollTo({ left, top });
        el.ganttHeader.scrollLeft = left;
        return true;
      },
      dateToX(minDate, dateStr) {
        return 20 + daysBetween(minDate, dateStr) * pxPerDay();
      },
      buildHeaderSvg(minDate, maxDate, width) {
        const svg = this.svg(width, HEADER_HEIGHT);
        svg.dataset.role = "gantt-header-svg";
        const days = daysBetween(minDate, maxDate);
        const ppd = pxPerDay();
        const tickStep = ppd >= 40 ? 1 : ppd >= 20 ? 3 : ppd >= 10 ? 7 : 14;
        const tickColor = cssVar("--border") || "#30363d";
        const mutedColor = cssVar("--text-muted") || "#7d8590";
        const primaryColor = cssVar("--text-primary") || "#e6edf3";
        for (let d = 0; d <= days; d += tickStep) {
          const date = addDays(minDate, d);
          const x = this.dateToX(minDate, date);
          svg.appendChild(this.line(x, 24, x, HEADER_HEIGHT, tickColor));
          const text = this.textNode(x + 2, 16, date.slice(5), mutedColor, 11);
          svg.appendChild(text);
        }
        const monthSeen = new Set();
        for (let d = 0; d <= days; d++) {
          const date = addDays(minDate, d);
          const month = date.slice(0, 7);
          if (!monthSeen.has(month)) {
            monthSeen.add(month);
            svg.appendChild(this.textNode(this.dateToX(minDate, date), 32, month, primaryColor, 12));
          }
        }
        return svg;
      },
      buildBodySvg(tasks, minDate, width, height, clipX = 0, viewWidth = null) {
        const svg = this.svg(viewWidth || width, height);
        svg.dataset.role = "gantt-body-svg";
        svg.setAttribute("viewBox", `${clipX} 0 ${viewWidth || width} ${height}`);
        const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
        defs.innerHTML = `
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
            <path d="M0,0 L0,6 L7,3 z" fill="#555577"></path>
          </marker>
          <filter id="glow-cyan"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        `;
        svg.appendChild(defs);
        const rowLineColor = cssVar("--gantt-row-line") || "#242b35";
        const shadeColor = cssVar("--gantt-shade") || "rgba(0,0,0,.45)";
        const totalDays = Math.max(0, Math.ceil((width - 40) / pxPerDay()));
        for (let d = 0; d <= totalDays; d++) {
          const date = addDays(minDate, d);
          if (isWorkingDate(date)) continue;
          const shade = this.rect(this.dateToX(minDate, date), 0, pxPerDay(), height, shadeColor, 0);
          svg.appendChild(shade);
        }
        for (let i = 0; i < tasks.length; i++) {
          const y = i * ROW_HEIGHT;
          svg.appendChild(this.line(0, y + ROW_HEIGHT, width, y + ROW_HEIGHT, rowLineColor));
        }
        const byId = new Map(tasks.map((t, i) => [t.id, { task: t, index: i }]));
        for (let i = 0; i < tasks.length; i++) {
          const task = tasks[i];
          if (!isValidIsoDate(task.start_date) || !isValidIsoDate(task.end_date)) continue;
          const y = i * ROW_HEIGHT + BAR_PADDING_TOP;
          const x = this.dateToX(minDate, task.start_date);
          const w = Math.max(4, durationDays(task) * pxPerDay());
          const color = task.is_summary ? "#7d8590" : (task.color || TaskTypes[task.task_type]?.color || "#666688");
          const label = this.ganttLabel(task, w);
          const dangerClr = cssVar("--danger") || "#ff5f7a";
          const orangeClr = cssVar("--neon-orange") || "#ff9900";
          const nearClr = document.body.classList.contains("light") ? "#d97706" : "#ffd89a";
          const stroke = task.is_critical ? dangerClr : task.slippage_status === "slipped" ? dangerClr : task.slippage_status === "at-risk" ? orangeClr : task.is_near_critical ? nearClr : "";
          if (isValidIsoDate(task.baseline_start_date) && isValidIsoDate(task.baseline_end_date)) {
            const bx = this.dateToX(minDate, task.baseline_start_date);
            const bw = Math.max(4, (daysBetween(task.baseline_start_date, task.baseline_end_date) + 1) * pxPerDay());
            const baseline = this.rect(bx, y + BAR_HEIGHT + 8, bw, 4, "#8b949e", 2);
            baseline.setAttribute("opacity", task.has_baseline_variance ? ".85" : ".45");
            svg.appendChild(baseline);
          }
          if (task.is_milestone && !task.is_summary) {
            const diamond = this.diamond(x, y + BAR_HEIGHT / 2, 12, color);
            diamond.classList.add("gantt-bar");
            diamond.dataset.taskId = task.id;
            if (stroke) {
              diamond.setAttribute("stroke", stroke);
              diamond.setAttribute("stroke-width", "3");
            }
            if (task.is_highlighted) diamond.setAttribute("filter", "url(#glow-cyan)");
            svg.appendChild(diamond);
            if (label.text) svg.appendChild(this.ganttLabelNode(x + 14, y, label.text, label.position, 0, label, task.id));
          } else {
            const bar = this.rect(x, y, w, BAR_HEIGHT, color, 3);
            bar.classList.add("gantt-bar");
            bar.dataset.taskId = task.id;
            if (task.is_summary) {
              bar.setAttribute("height", BAR_HEIGHT - 6);
              bar.setAttribute("y", y + 3);
              bar.setAttribute("opacity", ".82");
            }
            if (stroke) {
              bar.setAttribute("stroke", stroke);
              bar.setAttribute("stroke-width", "2");
            }
            if (task.is_highlighted) bar.setAttribute("filter", "url(#glow-cyan)");
            svg.appendChild(bar);
            const progress = this.rect(x, y, w * (task.progress / 100), BAR_HEIGHT, this.darken(color), 3);
            progress.classList.add("gantt-progress");
            progress.setAttribute("pointer-events", "none");
            progress.dataset.taskId = task.id;
            svg.appendChild(progress);
            if (label.text) svg.appendChild(this.ganttLabelNode(x, y, label.text, label.position, w, label, task.id));
          }
          if (isValidIsoDate(task.actual_start_date) && isValidIsoDate(task.actual_end_date)) {
            const ax = this.dateToX(minDate, task.actual_start_date);
            const aw = Math.max(4, (daysBetween(task.actual_start_date, task.actual_end_date) + 1) * pxPerDay());
            const actual = this.rect(ax, y + BAR_HEIGHT + 2, aw, 5, task.slippage_status === "slipped" ? "#ff5f7a" : "#e6edf3", 2);
            actual.setAttribute("opacity", ".85");
            svg.appendChild(actual);
          }
        }
        for (let i = 0; i < tasks.length; i++) {
          const task = tasks[i];
          const dependencies = task.dependencies?.length
            ? task.dependencies
            : splitCsv(task.predecessor_ids).map(id => ({ predecessor_id: Number(id), type: "FS", lag_hours: 0 }));
          for (const dep of dependencies) {
            const pred = byId.get(Number(dep.predecessor_id));
            const type = DEPENDENCY_TYPES.includes(String(dep.type || "").toUpperCase()) ? String(dep.type).toUpperCase() : "FS";
            if (!pred || !isValidIsoDate(pred.task.start_date) || !isValidIsoDate(pred.task.end_date) || !isValidIsoDate(task.start_date) || !isValidIsoDate(task.end_date)) continue;
            const predAnchor = pred.task.start_date;
            const taskAnchor = task.start_date;
            const predOffset = type[0] === "S" ? 0 : Math.max(4, durationDays(pred.task) * pxPerDay());
            const taskOffset = type[1] === "S" ? 0 : Math.max(4, durationDays(task) * pxPerDay());
            const lagOffset = (Number(dep.lag_hours || 0) / workingHoursPerDay()) * pxPerDay();
            const x1 = this.dateToX(minDate, predAnchor) + predOffset;
            const y1 = pred.index * ROW_HEIGHT + ROW_HEIGHT / 2;
            const x2 = this.dateToX(minDate, taskAnchor) + taskOffset + lagOffset;
            const y2 = i * ROW_HEIGHT + ROW_HEIGHT / 2;
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M ${x1},${y1} C ${x1 + 20},${y1} ${x2 - 20},${y2} ${x2},${y2}`);
            path.setAttribute("stroke", "#555577");
            path.setAttribute("fill", "none");
            path.setAttribute("marker-end", "url(#arrow)");
            svg.appendChild(path);
          }
        }
        this.appendGanttLineOverlays(svg, tasks, minDate, width, height);
        return svg;
      },
      appendGanttLineOverlays(svg, tasks, minDate, width, height) {
        const lineGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        lineGroup.dataset.role = "gantt-line-overlays";
        lineGroup.setAttribute("pointer-events", "none");
        const addOverlayLine = ({ x1, y1, x2, y2, color, thickness, role, type, dash = "" }) => {
          const overlay = this.line(x1, y1, x2, y2, color);
          overlay.dataset.role = role;
          if (type) overlay.dataset.lineType = type;
          overlay.setAttribute("stroke-width", thickness);
          overlay.setAttribute("stroke-linecap", "round");
          overlay.setAttribute("vector-effect", "non-scaling-stroke");
          overlay.setAttribute("pointer-events", "none");
          if (dash) overlay.setAttribute("stroke-dasharray", dash);
          lineGroup.appendChild(overlay);
        };
        const today = todayIso();
        const lastDayOffset = Math.max(0, Math.ceil((width - 40) / pxPerDay()) - 1);
        const todayOffset = isValidIsoDate(minDate) ? daysBetween(minDate, today) : -1;
        if (todayOffset >= 0 && todayOffset <= lastDayOffset) {
          const x = this.dateToX(minDate, today);
          addOverlayLine({
            x1: x,
            y1: 0,
            x2: x,
            y2: height,
            color: cssVar("--danger") || "#ff5f7a",
            thickness: 2,
            role: "current-date-line",
            type: "date",
            dash: "6 5"
          });
        }
        const taskRows = new Map(tasks.map((task, index) => [Number(task.id), index]));
        for (const line of sanitizeGanttLines(state.settings?.ganttLines)) {
          if (line.type === "date") {
            const x = this.dateToX(minDate, line.date);
            if (x < 0 || x > width) continue;
            addOverlayLine({
              x1: x,
              y1: 0,
              x2: x,
              y2: height,
              color: line.color,
              thickness: line.thickness,
              role: "custom-gantt-line",
              type: "date"
            });
          } else {
            const index = taskRows.get(Number(line.task_id));
            if (index == null) continue;
            const y = index * ROW_HEIGHT + ROW_HEIGHT / 2;
            addOverlayLine({
              x1: 0,
              y1: y,
              x2: width,
              y2: y,
              color: line.color,
              thickness: line.thickness,
              role: "custom-gantt-line",
              type: "task"
            });
          }
        }
        svg.appendChild(lineGroup);
      },
      ganttLabel(task, width) {
        const settings = { ...DEFAULT_GANTT_LABELS, ...(state.settings?.ganttLabels || {}) };
        const custom = text(task.gantt_label).trim();
        const hasCustom = Boolean(custom);
        const raw = hasCustom ? custom : settings.source === "custom" ? "" : task.title;
        const value = text(raw).trim();
        if (!value) return { text: "", position: settings.position };
        const position = hasCustom
          ? (["above", "below", "middle"].includes(task.gantt_label_position) ? task.gantt_label_position : "above")
          : (GANTT_LABEL_POSITIONS.includes(settings.position) ? settings.position : DEFAULT_GANTT_LABELS.position);
        const inside = position === "inside" || position === "middle";
        if (inside && Number(width) < 24) return { text: "", position };
        const maxChars = inside
          ? Math.max(1, Math.floor((Number(width) - 10) / 7))
          : 36;
        return {
          text: value.length > maxChars ? `${value.slice(0, Math.max(1, maxChars - 3))}...` : value,
          position,
          color: /^#[0-9a-fA-F]{6}$/.test(task.gantt_label_color || "") ? task.gantt_label_color : "",
          font: GANTT_LABEL_FONTS.some(font => font.value === task.gantt_label_font) ? task.gantt_label_font : ""
        };
      },
      ganttLabelNode(x, y, value, position, width = 0, style = {}, taskId) {
        const inside = position === "inside" || position === "middle";
        const labelX = inside ? x + width / 2 : x;
        const labelY = inside ? y + BAR_HEIGHT / 2 + 4 : position === "below" ? y + BAR_HEIGHT + 8 : y - 3;
        const fill = style.color || (inside ? "#ffffff" : (cssVar("--text-primary") || "#e6edf3"));
        const label = this.textNode(labelX, labelY, value, fill, 11);
        if (taskId) label.dataset.taskId = taskId;
        label.classList.add("gantt-label");
        label.setAttribute("pointer-events", "none");
        if (style.font) label.setAttribute("font-family", style.font);
        if (inside) {
          label.setAttribute("font-weight", "700");
          label.setAttribute("dominant-baseline", "middle");
          label.setAttribute("text-anchor", "middle");
        }
        return label;
      },
      async editTimelineText(task) {
        const result = await showGanttTimelineTextDialog(task);
        if (!result) return;
        if (result.clear || !result.text.trim()) {
          await state.storage.updateTask(task.id, { gantt_label: "", gantt_label_position: "", gantt_label_color: "", gantt_label_font: "" });
          await AppShell.refresh();
          GanttChart.scrollToTask(task.id);
          return;
        }
        await state.storage.updateTask(task.id, {
          gantt_label: result.text.trim().slice(0, 120),
          gantt_label_position: result.position,
          gantt_label_color: result.color,
          gantt_label_font: result.font
        });
        await AppShell.refresh();
        GanttChart.scrollToTask(task.id);
      },
      startDrag(e, bar, task) {
        const rect = bar.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        let mode = "drag";
        if (!task.is_milestone) {
          if (clickX < 8) {
            mode = "left-resize";
          } else if (rect.width - clickX < 8) {
            mode = "right-resize";
          }
        }
        GanttChart.dragState = {
          task,
          bar,
          mode,
          startX: e.clientX,
          origStart: task.start_date,
          origEnd: task.end_date,
          origX: GanttChart.dateToX(state.gantt.minDate, task.start_date),
          origW: Math.max(4, durationDays(task) * pxPerDay()),
          dragged: false,
          minDate: state.gantt.minDate
        };
        GanttChart.wasDragged = false;

        GanttChart._onDragMove = GanttChart._onDragMove || (ev => GanttChart.dragMove(ev));
        GanttChart._onDragEnd = GanttChart._onDragEnd || (ev => GanttChart.dragEnd(ev));

        window.addEventListener("mousemove", GanttChart._onDragMove);
        window.addEventListener("mouseup", GanttChart._onDragEnd);
      },
      dragMove(e) {
        const ds = GanttChart.dragState;
        if (!ds) return;

        const dx = e.clientX - ds.startX;
        if (!ds.dragged) {
          if (Math.abs(dx) > 3) {
            ds.dragged = true;
          } else {
            return;
          }
        }

        const svg = ds.bar.ownerSVGElement;
        if (!svg) return;

        const barEl = ds.bar;
        const progressEl = svg.querySelector(`.gantt-progress[data-task-id="${ds.task.id}"]`);
        const labelEl = svg.querySelector(`.gantt-label[data-task-id="${ds.task.id}"]`);

        if (ds.task.is_milestone) {
          const cx = Number(barEl.dataset.cx);
          const cy = Number(barEl.dataset.cy);
          const r = Number(barEl.dataset.radius);
          const newCx = cx + dx;
          barEl.setAttribute("points", `${newCx},${cy - r} ${newCx + r},${cy} ${newCx},${cy + r} ${newCx - r},${cy}`);

          if (labelEl) {
            const pos = ds.task.gantt_label_position || "above";
            const labelX = pos === "above" || pos === "below" ? newCx : newCx + 14;
            labelEl.setAttribute("x", labelX);
          }
        } else {
          if (ds.mode === "drag") {
            const newX = ds.origX + dx;
            barEl.setAttribute("x", newX);
            if (progressEl) progressEl.setAttribute("x", newX);

            if (labelEl) {
              const pos = ds.task.gantt_label_position || "above";
              const inside = pos === "inside" || pos === "middle";
              const labelX = inside ? newX + ds.origW / 2 : newX;
              labelEl.setAttribute("x", labelX);
            }
          } else if (ds.mode === "left-resize") {
            const newX = ds.origX + dx;
            const newW = Math.max(4, ds.origW - dx);
            barEl.setAttribute("x", newX);
            barEl.setAttribute("width", newW);
            if (progressEl) {
              progressEl.setAttribute("x", newX);
              progressEl.setAttribute("width", newW * (ds.task.progress / 100));
            }
            if (labelEl) {
              const pos = ds.task.gantt_label_position || "above";
              const inside = pos === "inside" || pos === "middle";
              const labelX = inside ? newX + newW / 2 : newX;
              labelEl.setAttribute("x", labelX);
            }
          } else if (ds.mode === "right-resize") {
            const newW = Math.max(4, ds.origW + dx);
            barEl.setAttribute("width", newW);
            if (progressEl) {
              progressEl.setAttribute("width", newW * (ds.task.progress / 100));
            }
            if (labelEl) {
              const pos = ds.task.gantt_label_position || "above";
              const inside = pos === "inside" || pos === "middle";
              const labelX = inside ? ds.origX + newW / 2 : ds.origX;
              labelEl.setAttribute("x", labelX);
            }
          }
        }
      },
      async dragEnd(e) {
        const ds = GanttChart.dragState;
        if (!ds) return;

        window.removeEventListener("mousemove", GanttChart._onDragMove);
        window.removeEventListener("mouseup", GanttChart._onDragEnd);
        GanttChart.dragState = null;

        if (ds.dragged) {
          GanttChart.wasDragged = true;
          const dx = e.clientX - ds.startX;
          const deltaDays = Math.round(dx / pxPerDay());

          let newStart = ds.origStart;
          let newEnd = ds.origEnd;

          if (ds.task.is_milestone) {
            newStart = addDays(ds.origStart, deltaDays);
            newEnd = newStart;
          } else {
            if (ds.mode === "drag") {
              newStart = addDays(ds.origStart, deltaDays);
              newEnd = addDays(ds.origEnd, deltaDays);
            } else if (ds.mode === "left-resize") {
              newStart = addDays(ds.origStart, deltaDays);
              if (newStart > newEnd) newStart = newEnd;
            } else if (ds.mode === "right-resize") {
              newEnd = addDays(ds.origEnd, deltaDays);
              if (newEnd < newStart) newEnd = newStart;
            }
          }

          try {
            const workingDaysCount = workingDaysBetween(newStart, newEnd);
            const duration_hours = ds.task.is_milestone ? 0 : workingDaysCount * workingHoursPerDay();

            await state.storage.updateTask(ds.task.id, {
              start_date: newStart,
              end_date: newEnd,
              duration_hours
            });

            await cascadeAutoSchedule(ds.task.id);
            await AppShell.refresh();
            showToast("Task schedule updated", "success");
          } catch (error) {
            showToast(error.message, "error");
            await AppShell.refresh();
          }
        }
      },
      svg(width, height) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("width", width);
        svg.setAttribute("height", height);
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        return svg;
      },
      rect(x, y, width, height, fill, rx = 0) {
        const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        r.setAttribute("x", x);
        r.setAttribute("y", y);
        r.setAttribute("width", Math.max(0, width));
        r.setAttribute("height", height);
        r.setAttribute("fill", fill);
        r.setAttribute("rx", rx);
        return r;
      },
      diamond(cx, cy, radius, fill) {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        p.setAttribute("points", `${cx},${cy - radius} ${cx + radius},${cy} ${cx},${cy + radius} ${cx - radius},${cy}`);
        p.setAttribute("fill", fill);
        p.dataset.cx = cx;
        p.dataset.cy = cy;
        p.dataset.radius = radius;
        return p;
      },
      line(x1, y1, x2, y2, stroke) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        line.setAttribute("stroke", stroke);
        return line;
      },
      textNode(x, y, value, fill, size) {
        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x", x);
        t.setAttribute("y", y);
        t.setAttribute("fill", fill);
        t.setAttribute("font-size", size);
        t.textContent = value;
        return t;
      },
      darken(hex) {
        const n = Number.parseInt(hex.slice(1), 16);
        const r = clamp(((n >> 16) & 255) - 70, 0, 255);
        const g = clamp(((n >> 8) & 255) - 70, 0, 255);
        const b = clamp((n & 255) - 70, 0, 255);
        return `rgb(${r},${g},${b})`;
      },
      tooltip(task, event) {
        el.tooltip.replaceChildren();
        const strong = document.createElement("strong");
        strong.textContent = task.title;
        el.tooltip.append(
          strong, document.createElement("br"),
          document.createTextNode(`Planned: ${task.start_date} to ${task.end_date}`), document.createElement("br"),
          document.createTextNode(`Actual: ${task.actual_start_date || "-"} to ${task.actual_end_date || "-"}`), document.createElement("br"),
          document.createTextNode(`Duration: ${task.duration}`), document.createElement("br"),
          document.createTextNode(`Float: ${task.total_float_days === "" ? "-" : `${formatNumber(task.total_float_days || 0)}d`}`), document.createElement("br"),
          document.createTextNode(`Progress: ${task.progress}%`), document.createElement("br"),
          document.createTextNode(`State: ${task.status} / ${task.priority}`), document.createElement("br"),
          document.createTextNode(`Sprint: ${task.sprint_name || "Backlog"}`), document.createElement("br"),
          document.createTextNode(`Jira: ${task.jira_url || "-"}`), document.createElement("br"),
          document.createTextNode(`Predecessors: ${task.predecessors_display || "-"}`), document.createElement("br"),
          document.createTextNode(`Baseline finish: ${task.baseline_end_date || "-"}`), document.createElement("br"),
          document.createTextNode(`Resource: ${task.resource || "Unassigned"}`), document.createElement("br"),

        );
        el.tooltip.style.left = `${event.clientX + 12}px`;
        el.tooltip.style.top = `${event.clientY + 12}px`;
        el.tooltip.style.display = "block";
      }
    };

      async load(name, mode) {
        const template = this.templates[name];
        if (!template) return;
        const base = todayIso();
        await state.storage.transact(async () => {
          if (mode === "replace") {
            const ids = state.tasks.map(t => t.id);
            const all = state.storage.collectDescendants(ids);
            for (const id of all) state.storage.db.run("DELETE FROM tasks WHERE id = ?", [id]);
          }
          const current = await state.storage.loadTasks();
          const rootOffset = current.filter(t => t.parent_id == null).length;
          const localToId = new Map();
          for (let i = 0; i < template.length; i++) {
            const [title, task_type, start, end, tags, resource, comments] = template[i];
            const wbs = String(rootOffset + i + 1);
            const duration = Math.max(0.5, end - start + 1) * workingHoursPerDay();
            state.storage.db.run(
              "INSERT INTO tasks (wbs_code, task_type, title, start_date, end_date, actual_start_date, actual_end_date, duration_hours, actual_hours, remaining_hours, progress, predecessor_ids, resource, comments, tags, jira_url, is_milestone, is_highlighted, parent_id, status, priority, sprint_id, manually_scheduled, constraint_type, constraint_date) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,0,0,NULL,'Not Started','Medium',NULL,0,NULL,NULL)",
              [wbs, task_type, title, addWorkingDays(base, start), addWorkingDays(base, end), null, null, duration, 0, duration, 0, "", resource, comments, tags, ""]
            );
            localToId.set(String(i + 1), Number(execOne(state.storage.db, "SELECT last_insert_rowid() AS id").id));
          }
          for (let i = 0; i < template.length; i++) {
            const localPreds = splitCsv(template[i][7]);
            const ids = localPreds.map(code => localToId.get(code)).filter(Boolean);
            const id = localToId.get(String(i + 1));
            state.storage.db.run("UPDATE tasks SET predecessor_ids = ? WHERE id = ?", [ids.join(","), id]);
            state.storage.replaceDependencies(id, ids.map(predecessor_id => ({ predecessor_id, type: "FS", lag_hours: 0 })));
          }
        });
      }
    };

          Description: [task.comments, task.jira_url ? `Jira: ${task.jira_url}` : ""].filter(Boolean).join("\n")
        }));
        downloadBlob(new Blob([this.toCsv(rows)], { type: "text/csv" }), "novaplan_jira.csv");
        showToast("Jira CSV export created", "success");
      },
      exportProjectXml(tasks) {
        if (!tasks.length) return showToast("No tasks to export", "warning");
        const taskXml = sortTasksByWbs(tasks).map((task, index) => `
    <Task>
      <UID>${task.id}</UID>
      <ID>${index + 1}</ID>
      <Name>${this.xml(task.title)}</Name>
      <WBS>${this.xml(task.wbs_code)}</WBS>
      <Start>${this.xml(task.start_date)}</Start>
      <Finish>${this.xml(task.end_date)}</Finish>
      <DurationHours>${formatNumber(task.duration_hours)}</DurationHours>
      <ActualWorkHours>${formatNumber(task.actual_hours || 0)}</ActualWorkHours>
      <RemainingWorkHours>${formatNumber(task.remaining_hours || 0)}</RemainingWorkHours>
      <PercentComplete>${Number(task.progress || 0)}</PercentComplete>
      <Critical>${task.is_critical ? 1 : 0}</Critical>
      <Milestone>${task.is_milestone ? 1 : 0}</Milestone>
      <Resource>${this.xml(task.resource)}</Resource>
      <Notes>${this.xml(task.comments)}</Notes>
    </Task>`).join("");
        const xml = `<?xml version="1.0" encoding="UTF-8"?>
<Project>
  <Name>NovaPlan Export</Name>
  <CalendarHoursPerDay>${workingHoursPerDay()}</CalendarHoursPerDay>
  <Tasks>${taskXml}
  </Tasks>
</Project>`;
        downloadBlob(new Blob([xml], { type: "application/xml" }), "novaplan_project.xml");
        showToast("Project XML export created", "success");
      },
      toCsv(rows) {
        if (!rows.length) return "";
        const headers = [...new Set(rows.flatMap(row => Object.keys(row)))];
        const quote = value => `"${text(value).replaceAll('"', '""')}"`;
        return [headers.map(quote).join(","), ...rows.map(row => headers.map(header => quote(row[header])).join(","))].join("\n");
      },
      xml(value) {
        return text(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&apos;");
      },
      jiraIssueKey(url) {
        if (!url) return "";
        const match = text(url).match(/\/browse\/([^/?#]+)/i);
        return match ? match[1] : "";
      },
      async exportGif(mode) {
        if (!state.gantt.scheduled.length) return showToast("No scheduled tasks to export", "warning");
        setExporting(true);
        state.cancelExport = false;
        const status = showExportStatus("Preparing GIF export...", true);
        try {
          const { GIFEncoder, quantize, applyPalette } = await import(GIFENC_URL);
          const frames = await this.renderGifFrames(mode, status);
          const gif = GIFEncoder();
          for (let i = 0; i < frames.length; i++) {
            if (state.cancelExport) throw new Error("__cancelled__");
            const frame = frames[i];
            status.update(`Encoding GIF frame ${i + 1} of ${frames.length}...`);
            const ctx = frame.getContext("2d");
            const data = ctx.getImageData(0, 0, frame.width, frame.height).data;
            const palette = quantize(data, 256);
            const index = applyPalette(data, palette);
            gif.writeFrame(index, frame.width, frame.height, { palette, delay: mode === "animated" ? 120 : 1000 });
            await new Promise(requestAnimationFrame);
          }
          if (state.cancelExport) throw new Error("__cancelled__");
          gif.finish();
          downloadBlob(new Blob([gif.bytes()], { type: "image/gif" }), "novaplan_gantt.gif");
          showToast("Gantt GIF export created", "success");
        } catch (error) {
          if (error.message === "__cancelled__") showToast("GIF export cancelled", "warning");
          else showToast(`GIF export failed: ${error.message}`, "error");
        } finally {
          status.remove();
          state.cancelExport = false;
          setExporting(false);
        }
      },
      async renderGifFrames(mode, status) {
        if (mode === "full") {
          const sourceWidth = state.gantt.svgWidth;
          const sourceHeight = state.gantt.svgHeight + HEADER_HEIGHT;
          const width = Math.min(1200, sourceWidth);
          const scale = Math.min(width / sourceWidth, 900 / sourceHeight, 1);
          const height = Math.max(220, Math.ceil(sourceHeight * scale));
          if (state.cancelExport) throw new Error("__cancelled__");
          status.update("Rendering full timeline frame...");
          return [await this.renderFrame(0, width, height, { scale, viewWidth: sourceWidth })];
        }

        const viewWidth = Math.min(960, el.ganttBody.clientWidth || 960);
        const height = Math.min(900, Math.max(220, state.gantt.svgHeight + HEADER_HEIGHT));
        const maxScroll = Math.max(0, state.gantt.svgWidth - viewWidth);
        const scrolls = mode === "animated"
          ? Array.from({ length: clamp(Math.ceil(state.gantt.svgWidth / 260), 8, 48) }, (_, i, arr) => Math.round(maxScroll * (i / (arr.length - 1 || 1))))
          : [mode === "current" ? el.ganttBody.scrollLeft : 0];
        const frames = [];
        for (let i = 0; i < scrolls.length; i++) {
          if (state.cancelExport) throw new Error("__cancelled__");
          status.update(`Rendering GIF frame ${i + 1} of ${scrolls.length}...`);
          frames.push(await this.renderFrame(scrolls[i], viewWidth, height, { scale: 1, viewWidth }));
          await new Promise(requestAnimationFrame);
        }
        return frames;
      },
      async renderFrame(scrollX, width, height, options = {}) {
        const scale = options.scale || 1;
        const viewWidth = options.viewWidth || width;
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        const exportBg = cssVar("--gantt-bg") || cssVar("--bg-primary") || "#0d1117";
        ctx.fillStyle = exportBg;
        ctx.fillRect(0, 0, width, height);
        const svg = GanttChart.svg(width, height);
        svg.appendChild(GanttChart.rect(0, 0, width, height, exportBg));
        const content = document.createElementNS("http://www.w3.org/2000/svg", "g");
        content.setAttribute("transform", `scale(${scale})`);
        const header = GanttChart.buildHeaderSvg(state.gantt.minDate, state.gantt.maxDate, state.gantt.svgWidth);
        header.setAttribute("width", viewWidth);
        header.setAttribute("viewBox", `${scrollX} 0 ${viewWidth} ${HEADER_HEIGHT}`);
        const body = GanttChart.buildBodySvg(state.visibleTasks, state.gantt.minDate, state.gantt.svgWidth, state.gantt.svgHeight, scrollX, viewWidth);
        body.setAttribute("y", HEADER_HEIGHT);
        content.append(header, body);
        svg.appendChild(content);
        const xml = new XMLSerializer().serializeToString(svg);
        const blob = new Blob([xml], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = url;
        });
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        return canvas;
      }
    };

      addFieldGroup(label, type, key, value, options = null, min = null, max = null, placeholder = "", isCustomField = false) {
        const group = document.createElement("div");
        group.className = "details-group";

        const lbl = document.createElement("label");
        lbl.textContent = label;
        group.appendChild(lbl);

        let input;
        if (type === "select") {
          input = document.createElement("select");
          input.className = "details-select";
          (options || []).forEach(opt => {
            const o = document.createElement("option");
            o.value = opt.value;
            o.textContent = opt.label;
            input.appendChild(o);
          });
          input.value = value;
        } else if (type === "textarea") {
          input = document.createElement("textarea");
          input.className = "details-textarea";
          input.rows = 4;
          input.value = value;
          if (placeholder) input.placeholder = placeholder;
        } else {
          input = document.createElement("input");
          input.type = type;
          input.className = "details-input";
          input.value = value;
          if (min !== null) input.min = min;
          if (max !== null) input.max = max;
          if (placeholder) input.placeholder = placeholder;
        }

        input.addEventListener("change", async () => {
          const task = findTask(this.activeTaskId);
          if (!task) return;

          let val = input.value;
          if (type === "number") val = val ? Number(val) : 0;
          if (key === "sprint_id") val = val ? Number(val) : null;

          const fields = {};
          if (isCustomField) {
            const colKey = key.replace("custom_", "");
            let customVals = {};
            try { customVals = JSON.parse(task.custom_fields_json || "{}"); } catch {}
            customVals[colKey] = val;
            fields.custom_fields_json = JSON.stringify(customVals);
          } else {
            fields[key] = val;
          }

          try {
            await state.storage.updateTask(task.id, fields);
            if (key === "start_date" || key === "end_date") {
              if (typeof cascadeAutoSchedule === "function") {
                cascadeAutoSchedule(task.id);
              }
            }
            await AppShell.refresh();
            this.render();
          } catch (err) {
            showToast(`Update failed: ${err.message}`, "error");
          }
        });

        group.appendChild(input);
        el.detailsBody.appendChild(group);
      }
    };

      getItems() {
        const items = [
          { label: "Go to Split View", subtitle: "Switch view mode", action: () => { el.viewSelect.value = "split"; AppShell.handleViewChange(); } },

      renderResults() {
        const query = el.commandInput.value.toLowerCase().trim();

          this.filteredItems = all.slice(0, 8);
        } else {
          this.filteredItems = all.filter(item => 
            item.label.toLowerCase().includes(query) || 
            item.subtitle.toLowerCase().includes(query)
          ).slice(0, 10);

        this.activeIdx = this.filteredItems.length > 0 ? 0 : -1;
        el.commandResults.replaceChildren();

        this.filteredItems.forEach((item, idx) => {
          const div = document.createElement("div");
          div.className = "command-item" + (idx === this.activeIdx ? " active" : "");
          
          const textWrap = document.createElement("div");
          textWrap.style.display = "flex";
          textWrap.style.alignItems = "baseline";

          const titleSpan = document.createElement("span");
          titleSpan.className = "command-item-label";
          titleSpan.textContent = item.label;
          textWrap.appendChild(titleSpan);

          const subtitleSpan = document.createElement("span");
          subtitleSpan.className = "command-item-subtitle";
          subtitleSpan.textContent = item.subtitle;
          textWrap.appendChild(subtitleSpan);

          div.appendChild(textWrap);

          if (item.badge) {
            const badge = document.createElement("span");

      handleKeyDown(e) {
        if (e.key === "Escape") {
          e.preventDefault();
          this.close();
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          if (this.filteredItems.length === 0) return;
          this.activeIdx = (this.activeIdx + 1) % this.filteredItems.length;
          this.updateActiveItemHighlight();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (this.filteredItems.length === 0) return;
          this.activeIdx = (this.activeIdx - 1 + this.filteredItems.length) % this.filteredItems.length;
          this.updateActiveItemHighlight();
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (this.activeIdx >= 0 && this.filteredItems[this.activeIdx]) {
            const item = this.filteredItems[this.activeIdx];
            this.close();
            item.action();
          }
        }
      },
      updateActiveItemHighlight() {
        const childNodes = el.commandResults.childNodes;
        childNodes.forEach((node, idx) => {
          if (idx === this.activeIdx) {
            node.classList.add("active");
            node.scrollIntoView({ block: "nearest" });

            node.classList.remove("active");

    const ViewSystem = {
      apply(tasks) {
        const filtered = this.filterTasks(tasks);
        const ordered = state.view.group === "none" ? sortTasksByWbs(filtered) : [...filtered].sort((a, b) => {
          const ga = this.groupLabel(a, state.view.group);
          const gb = this.groupLabel(b, state.view.group);
          return ga.localeCompare(gb) || compareWbs(a.wbs_code, b.wbs_code);
        });
        return ["split", "grid", "gantt"].includes(state.view.mode) ? this.applyCollapsed(ordered) : ordered;
      },
      applyCollapsed(tasks) {
        if (!state.collapsedIds.size) return tasks;
        const hidden = new Set();
        const byParent = new Map();
        for (const task of state.tasks) {
          const key = task.parent_id == null ? "root" : String(task.parent_id);
          if (!byParent.has(key)) byParent.set(key, []);
          byParent.get(key).push(task);
        }
        const hideChildren = id => {
          for (const child of byParent.get(String(id)) || []) {
            hidden.add(child.id);
            hideChildren(child.id);
          }
        };
        for (const id of state.collapsedIds) hideChildren(id);
        return tasks.filter(task => !hidden.has(task.id));
      },
      filterTasks(tasks) {
        const filter = state.view.filter || "all";
        const currentSprint = this.currentSprint();
        const today = todayIso();
        const search = (state.searchTerm || "").toLowerCase().trim();
        return tasks.filter(task => {
          if (search) {
            const nameMatch = (task.title || "").toLowerCase().includes(search);
            const wbsMatch = (task.wbs_code || "").toLowerCase().includes(search);
            const resMatch = (task.resource || "").toLowerCase().includes(search);
            const tagMatch = (task.tags || "").toLowerCase().includes(search);
            if (!nameMatch && !wbsMatch && !resMatch && !tagMatch) return false;
          }
          if (filter === "slipped") return task.slippage_status === "slipped";
          if (filter === "at-risk") return task.slippage_status === "at-risk";
          if (filter === "milestones") return Boolean(task.is_milestone);
          if (filter === "current-sprint") return currentSprint ? Number(task.sprint_id) === Number(currentSprint.id) : false;
          if (filter === "future-sprints") {
            const sprint = state.sprints.find(item => Number(item.id) === Number(task.sprint_id));
            return Boolean(sprint && sprint.start_date > today);
          }
          if (filter === "backlog") return task.sprint_id == null;
          if (filter === "completed") return task.status === "Done" || Number(task.progress || 0) === 100;
          if (filter === "blocked") return task.status === "Blocked";
          if (filter === "critical") return Boolean(task.is_critical);
          if (filter === "near-critical") return Boolean(task.is_critical || task.is_near_critical);
          if (filter === "unassigned") return !task.resource;
          if (filter === "baseline-variance") return Boolean(task.has_baseline_variance);
          return true;
        });
      },
      currentSprint() {
        const today = todayIso();
        return state.sprints.find(sprint => sprint.active && sprint.start_date <= today && sprint.end_date >= today)
          || state.sprints.find(sprint => sprint.active)
          || null;
      },
      groupValue(task, key) {
        if (key === "status") return task.status || "Not Started";
        if (key === "priority") return task.priority || "Medium";
        if (key === "sprint") return task.sprint_id == null ? "" : String(task.sprint_id);
        if (key === "resource") return task.resource || "";
        if (key === "task_type") return task.task_type || DEFAULT_TYPE;
        if (key === "slippage_status") return task.slippage_status || "";
        return "all";
      },
      groupLabel(task, key) {
        if (key === "sprint") return task.sprint_name || "Backlog";
        if (key === "resource") return task.resource || "Unassigned";
        if (key === "task_type") return TaskTypes[task.task_type]?.label || "Planning";
        if (key === "slippage_status") return task.slippage_status === "slipped" ? "Slipped" : task.slippage_status === "at-risk" ? "At risk" : "On track";
        return text(task[key] || "");

      refreshChrome() {
