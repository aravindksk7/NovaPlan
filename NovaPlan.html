    };

    function pxPerDay() { return Math.round(PX_PER_DAY * GANTT_ZOOM_LEVELS[state.ganttZoomIdx]); }
    function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

    function todayIso() {
      const now = new Date();
      const tz = now.getTimezoneOffset() * 60000;
      return new Date(now.getTime() - tz).toISOString().slice(0, 10);
    }

    function addDays(dateStr, days) {
      const d = new Date(`${dateStr}T00:00:00`);
      d.setDate(d.getDate() + days);
      // Use local date parts to avoid UTC conversion shifting the date in UTC+ timezones
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function isValidIsoDate(value) {
      return /^\d{4}-\d{2}-\d{2}$/.test(value || "") && !Number.isNaN(new Date(`${value}T00:00:00`).getTime());
    }

    function daysBetween(a, b) {
      const start = new Date(`${a}T00:00:00`);
      const end = new Date(`${b}T00:00:00`);
      return Math.round((end - start) / 86400000);
    }

    function plannedDateDurationHours(task) {
      if (!isValidIsoDate(task.start_date) || !isValidIsoDate(task.end_date)) return HOURS_PER_DAY;
      return Math.max(0.5, workingDaysBetween(task.start_date, task.end_date)) * workingHoursPerDay();
    }

    function durationHours(task) {
      const hours = Number(task.duration_hours);
      return Number.isFinite(hours) && hours > 0 ? hours : plannedDateDurationHours(task);
    }

    function durationDays(task) {
      return durationHours(task) / workingHoursPerDay();
    }

    function workingHoursPerDay() {
      const hours = Number(state.settings?.calendar?.hoursPerDay || HOURS_PER_DAY);
      return Number.isFinite(hours) && hours > 0 ? hours : HOURS_PER_DAY;
    }

    function isWorkingDate(dateStr) {
      if (!isValidIsoDate(dateStr)) return false;
      const calendar = state.settings?.calendar || DEFAULT_CALENDAR;
      const day = new Date(`${dateStr}T00:00:00`).getDay();
      return (calendar.workingDays || DEFAULT_CALENDAR.workingDays).includes(day)
        && !(calendar.holidays || []).includes(dateStr);
    }

    function workingDaysBetween(startDate, endDate) {
      if (!isValidIsoDate(startDate) || !isValidIsoDate(endDate) || endDate < startDate) return 1;
      const span = daysBetween(startDate, endDate);
      let count = 0;
      for (let i = 0; i <= span; i++) {
        if (isWorkingDate(addDays(startDate, i))) count++;
      }
      return count || span + 1;
    }

    function addWorkingDays(startDate, offset) {
      if (!isValidIsoDate(startDate) || !Number.isFinite(Number(offset))) return startDate;
      if (Number(offset) <= 0) return isWorkingDate(startDate) ? startDate : nextWorkingDate(startDate);
      let date = startDate;
      let remaining = Number(offset);
      while (remaining > 0) {
        date = addDays(date, 1);
        if (isWorkingDate(date)) remaining--;
      }
      return date;
    }

    function nextWorkingDate(dateStr) {
      let date = dateStr;
      for (let i = 0; i < 14; i++) {
        if (isWorkingDate(date)) return date;
        date = addDays(date, 1);
      }
      return dateStr;
    }

    // Move forward (positive) or backward (negative) by N working days.
    function shiftWorkingDate(dateStr, workingDays) {
      if (!isValidIsoDate(dateStr) || !Number.isFinite(workingDays)) return dateStr;
      const n = Math.round(workingDays);
      if (n === 0) return nextWorkingDate(dateStr);
      let date = dateStr;
      let remaining = Math.abs(n);
      const step = n > 0 ? 1 : -1;
      while (remaining > 0) {
        date = addDays(date, step);
        if (isWorkingDate(date)) remaining--;
      }
      return date;
    }

    // Given a task and its resolved dependency specs, compute the constrained
    // start_date and end_date based on each predecessor's dates and dep type/lag.
    // Returns { start_date, end_date } with the tightest valid schedule.
    function computeDatesFromDeps(task, specs, allTasksById) {
      const durDays = Math.max(1, Math.round(durationHours(task) / workingHoursPerDay()));
      let latestStart = null; // tightest start constraint (from FS / SS)
      let latestEnd   = null; // tightest end constraint   (from FF / SF)

      for (const dep of specs) {
        const pred = allTasksById.get(Number(dep.predecessor_id));
        if (!pred || !isValidIsoDate(pred.start_date) || !isValidIsoDate(pred.end_date)) continue;
        const lagDays = Number(dep.lag_hours || 0) / workingHoursPerDay();
        const type = String(dep.type || "FS").toUpperCase();

        let cs = null; // candidate start
        let ce = null; // candidate end

        if (type === "FS") {
          // Successor starts 1 working day after predecessor finishes, plus lag
          cs = shiftWorkingDate(pred.end_date, 1 + lagDays);
        } else if (type === "SS") {
          // Successor starts at same time as predecessor, plus lag
          cs = shiftWorkingDate(pred.start_date, lagDays);
        } else if (type === "FF") {
          // Successor finishes at same time as predecessor, plus lag
          ce = shiftWorkingDate(pred.end_date, lagDays);
        } else if (type === "SF") {
          // Successor finishes when predecessor starts, plus lag
          ce = shiftWorkingDate(pred.start_date, lagDays);
        }

        if (cs && (!latestStart || cs > latestStart)) latestStart = cs;
        if (ce && (!latestEnd   || ce > latestEnd))   latestEnd   = ce;
      }

      let newStart = null;
      let newEnd   = null;

      if (latestStart && latestEnd) {
        // Both constrained: pick whichever gives the later finish
        const endFromStart = shiftWorkingDate(latestStart, durDays - 1);
        if (latestEnd > endFromStart) {
          newEnd   = latestEnd;
          newStart = shiftWorkingDate(latestEnd, -(durDays - 1));
        } else {
          newStart = latestStart;
          newEnd   = endFromStart;
        }
      } else if (latestStart) {
        newStart = latestStart;
        newEnd   = shiftWorkingDate(latestStart, durDays - 1);
      } else if (latestEnd) {
        newEnd   = latestEnd;
        newStart = shiftWorkingDate(latestEnd, -(durDays - 1));
      }

      return { start_date: newStart, end_date: newEnd };
    }

    function shiftedEndForStart(task, startDate) {
      if (!isValidIsoDate(startDate)) return startDate;
      const offset = isValidIsoDate(task.start_date) && isValidIsoDate(task.end_date)
        ? Math.max(0, workingDaysBetween(task.start_date, task.end_date) - 1)
        : Math.max(0, Math.ceil(durationHours(task) / workingHoursPerDay()) - 1);
      return addWorkingDays(startDate, offset);
    }

    async function cascadeAutoSchedule(startingTaskId) {
      const tasks = await state.storage.loadTasks();
      const byId = new Map(tasks.map(t => [t.id, t]));

      const successors = new Map();
      for (const t of tasks) {
        const predIds = splitCsv(t.predecessor_ids).map(Number);
        for (const pid of predIds) {
          if (!successors.has(pid)) successors.set(pid, []);
          successors.get(pid).push(t);
        }
      }

      const queue = [startingTaskId];
      const visited = new Set();

      while (queue.length) {
        const currentId = queue.shift();
        if (visited.has(currentId)) continue;
        visited.add(currentId);

        const succs = successors.get(currentId) || [];
        for (const succ of succs) {
          const deps = succ.dependencies?.length
            ? succ.dependencies
            : splitCsv(succ.predecessor_ids).map(id => ({ predecessor_id: Number(id), type: "FS", lag_hours: 0 }));

          const { start_date, end_date } = computeDatesFromDeps(succ, deps, byId);
          if (start_date !== succ.start_date || end_date !== succ.end_date) {
            succ.start_date = start_date;
            succ.end_date = end_date;

            const workingDaysCount = workingDaysBetween(start_date, end_date);
            const duration_hours = workingDaysCount * workingHoursPerDay();

            await state.storage.updateTask(succ.id, { start_date, end_date, duration_hours });

            queue.push(succ.id);
          }
        }
      }
    }

    function formatNumber(value) {
      return Number(value).toFixed(2).replace(/\.?0+$/, "");
    }

    function formatDuration(task) {
      const hours = durationHours(task);
      const days = hours / workingHoursPerDay();
      return `${formatNumber(hours)}h (${formatNumber(days)}d)`;
    }

    function slippageStatus(task) {
      if ((task.actual_start_date && task.actual_start_date > task.start_date) ||
          (task.actual_end_date && task.actual_end_date > task.end_date)) {
        return "slipped";
      }
      if (!task.actual_end_date && Number(task.progress || 0) < 100 && isValidIsoDate(task.end_date) && task.end_date < todayIso()) {
        return "at-risk";
      }
      return "";
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function text(value) {
      return value == null ? "" : String(value);
    }

    function safeHexColor(value, fallback = DEFAULT_GANTT_LINE.color) {
      return /^#[0-9a-fA-F]{6}$/.test(value || "") ? value : fallback;
    }

    function sanitizeGanttLine(line = {}) {
      const type = line.type === "task" ? "task" : "date";
      const thickness = clamp(Math.round(Number(line.thickness || DEFAULT_GANTT_LINE.thickness)), 1, 12);
      return {
        id: text(line.id || window.crypto?.randomUUID?.() || `line-${Date.now()}-${Math.random().toString(16).slice(2)}`),
        type,
        date: type === "date" && isValidIsoDate(line.date) ? line.date : "",
        task_id: type === "task" && Number.isFinite(Number(line.task_id)) ? Number(line.task_id) : null,
        color: safeHexColor(line.color),
        thickness
      };
    }

    function sanitizeGanttLines(lines) {
      return Array.isArray(lines)
        ? lines.map(sanitizeGanttLine).filter(line => line.type === "date" ? line.date : line.task_id != null)
        : [];
    }

    function appendCells(row, values) {
      for (const value of values) {
        const cell = document.createElement("td");
        cell.textContent = text(value);
        row.appendChild(cell);
      }
      return row;
    }

    function statusForProgress(progress) {
      const n = clamp(Number(progress || 0), 0, 100);
      if (n === 0) return "Not Started";
      if (n === 100) return "Done";
      return "In Progress";
    }

    function fieldsForStatus(status, task = {}) {
      const safeStatus = TASK_STATUSES.includes(status) ? status : "Not Started";
      const fields = { status: safeStatus };
      const progress = Number(task.progress || 0);
      if (safeStatus === "Not Started") {
        fields.progress = 0;
        fields.remaining_hours = durationHours(task);
      }
      if (safeStatus === "Done") {
        fields.progress = 100;
        fields.remaining_hours = 0;
      }
      if (safeStatus === "In Progress" && (progress <= 0 || progress >= 100)) {
        fields.progress = 50;
        fields.remaining_hours = Math.round(durationHours(task) * 50) / 100;
      }
      if (safeStatus === "Blocked" && progress >= 100) {
        fields.progress = 99;
        fields.remaining_hours = Math.max(0.25, Math.round(durationHours(task)) / 100);
      }
      return fields;
    }

    function normalizeJiraUrl(value) {
      const trimmed = text(value).trim();
      if (!trimmed) return "";
      let url;
      try {
        url = new URL(trimmed);
      } catch {
        throw new Error("Jira link must be a valid http or https URL");
      }
      if (!["http:", "https:"].includes(url.protocol)) throw new Error("Jira link must use http or https");
      return url.href;
    }



    function splitCsv(value) {
      return text(value).split(",").map(v => v.trim()).filter(Boolean);
    }

    function sqlQuote(value) {
      if (value == null) return "NULL";
      return `'${String(value).replaceAll("'", "''")}'`;
    }

    function sqlValue(value) {
      if (value == null) return "NULL";
      if (typeof value === "number" && Number.isFinite(value)) return String(value);
      return sqlQuote(value);
    }

    function parseCsv(textValue) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      const input = text(textValue);
      for (let i = 0; i < input.length; i++) {
        const ch = input[i];
        const next = input[i + 1];
        if (quoted && ch === '"' && next === '"') {
          cell += '"';
          i++;
        } else if (ch === '"') {
          quoted = !quoted;
        } else if (!quoted && ch === ",") {
          row.push(cell);
          cell = "";
        } else if (!quoted && (ch === "\n" || ch === "\r")) {
          if (ch === "\r" && next === "\n") i++;
          row.push(cell);
          if (row.some(value => value !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += ch;
        }
      }
      row.push(cell);
      if (row.some(value => value !== "")) rows.push(row);
      if (!rows.length) return [];
      const headers = rows.shift().map(header => header.trim());
      return rows.map(values => Object.fromEntries(headers.map((header, index) => [header, values[index] || ""])));
    }

    function compareWbs(a, b) {
      const ap = text(a).split(".").map(Number);
      const bp = text(b).split(".").map(Number);
      const max = Math.max(ap.length, bp.length);
      for (let i = 0; i < max; i++) {
        const av = ap[i] ?? -1;
        const bv = bp[i] ?? -1;
        if (av !== bv) return av - bv;
      }
      return 0;
    }

    function sortTasksByWbs(tasks) {
      return [...tasks].sort((a, b) => compareWbs(a.wbs_code, b.wbs_code));
    }

    function sprintName(id) {
      if (id == null || id === "") return "";
      return state.sprints.find(s => Number(s.id) === Number(id))?.name || "";
    }

    function getConditionalRules() {
      return state.settings?.conditionalRules || [
        { id: "slipped", enabled: false, condition: "slipped", target: "row", color: "#450a0a", textColor: "#f87171", label: "Highlight Slipped/Delayed Tasks in Red" },
        { id: "critical", enabled: false, condition: "critical", target: "row", color: "#431407", textColor: "#fb923c", label: "Highlight Critical Path Tasks in Orange" },
        { id: "blocked", enabled: true, condition: "blocked", target: "cell", column: "status", color: "#450a0a", textColor: "#f87171", label: "Highlight 'Blocked' cells in Red" },
        { id: "completed", enabled: false, condition: "completed", target: "cell", column: "status", color: "#064e3b", textColor: "#4ade80", label: "Highlight 'Completed' cells in Green" }
      ];
    }

    function formatLag(hours) {
      const n = Number(hours || 0);
      if (!n) return "";
      const sign = n > 0 ? "+" : "-";
      const abs = Math.abs(n);
      const days = abs / workingHoursPerDay();
      if (Number.isInteger(days) || abs >= workingHoursPerDay()) return `${sign}${formatNumber(days)}d`;
      return `${sign}${formatNumber(abs)}h`;
    }

    function formatDependency(dep, byId) {
      const pred = byId.get(Number(dep.predecessor_id));
      if (!pred) return "";
      const type = DEPENDENCY_TYPES.includes(String(dep.type || "").toUpperCase()) ? String(dep.type).toUpperCase() : "FS";
      return `${pred.wbs_code}${type}${formatLag(dep.lag_hours)}`;
    }

    function computeVariance(task) {
      task.start_variance_days = task.baseline_start_date && task.start_date ? daysBetween(task.baseline_start_date, task.start_date) : "";
      task.finish_variance_days = task.baseline_end_date && task.end_date ? daysBetween(task.baseline_end_date, task.end_date) : "";
      task.duration_variance_hours = task.baseline_duration_hours ? Math.round((durationHours(task) - Number(task.baseline_duration_hours)) * 100) / 100 : "";
      task.progress_variance = task.baseline_progress !== "" && task.baseline_progress != null ? Number(task.progress || 0) - Number(task.baseline_progress || 0) : "";
      task.has_baseline_variance = [task.start_variance_days, task.finish_variance_days, task.duration_variance_hours, task.progress_variance]
        .some(value => Number(value || 0) !== 0);
    }

    function normalizeTask(row, allRows, depsByTask = new Map(), baselineByTask = new Map()) {
      const baseline = baselineByTask.get(Number(row.id)) || {};
      const deps = (depsByTask.get(Number(row.id)) || []).map(dep => ({
        id: Number(dep.id || 0),
        successor_id: Number(dep.successor_id || row.id),
        predecessor_id: Number(dep.predecessor_id),
        type: DEPENDENCY_TYPES.includes(String(dep.type || "").toUpperCase()) ? String(dep.type).toUpperCase() : "FS",
        lag_hours: Number(dep.lag_hours || 0)
      }));
      const task = {
        id: Number(row.id),
        wbs_code: text(row.wbs_code),
        task_type: TaskTypes[row.task_type] ? row.task_type : DEFAULT_TYPE,
        title: text(row.title),
        start_date: text(row.start_date),
        end_date: text(row.end_date),
        actual_start_date: text(row.actual_start_date),
        actual_end_date: text(row.actual_end_date),
        duration_hours: Number(row.duration_hours || 0),
        actual_hours: Number(row.actual_hours || 0),
        remaining_hours: row.remaining_hours == null || row.remaining_hours === "" ? null : Number(row.remaining_hours),
        progress: Number(row.progress || 0),
        predecessor_ids: text(row.predecessor_ids),
        dependencies: deps,
        resource: text(row.resource),
        comments: text(row.comments),
        tags: text(row.tags),
        jira_url: text(row.jira_url),
        github_url: text(row.github_url),
        custom_fields_json: text(row.custom_fields_json),
        color: /^#[0-9a-fA-F]{6}$/.test(row.color || "") ? row.color : "",
        gantt_label: text(row.gantt_label),
        gantt_label_position: ["above", "below", "middle"].includes(text(row.gantt_label_position)) ? text(row.gantt_label_position) : "",
        gantt_label_color: /^#[0-9a-fA-F]{6}$/.test(row.gantt_label_color || "") ? row.gantt_label_color : "",
        gantt_label_font: GANTT_LABEL_FONTS.some(font => font.value === row.gantt_label_font) ? row.gantt_label_font : "",
        is_milestone: Number(row.is_milestone || 0),
        is_highlighted: Number(row.is_highlighted || 0),
        parent_id: row.parent_id == null ? null : Number(row.parent_id),
        status: TASK_STATUSES.includes(row.status) ? row.status : "Not Started",
        priority: TASK_PRIORITIES.includes(row.priority) ? row.priority : "Medium",
        sprint_id: row.sprint_id == null || row.sprint_id === "" ? null : Number(row.sprint_id),
        manually_scheduled: Number(row.manually_scheduled || 0),
        constraint_type: text(row.constraint_type),
        constraint_date: text(row.constraint_date),
        baseline_start_date: text(baseline.start_date),
        baseline_end_date: text(baseline.end_date),
        baseline_duration_hours: baseline.duration_hours == null ? "" : Number(baseline.duration_hours),
        baseline_progress: baseline.progress == null ? "" : Number(baseline.progress)
      };
      task.duration_hours = durationHours(task);
      if (task.remaining_hours == null || !Number.isFinite(task.remaining_hours)) {
        task.remaining_hours = Math.max(0, task.duration_hours * (100 - task.progress) / 100);
      }
      task.estimate_at_completion_hours = Math.round((Number(task.actual_hours || 0) + Number(task.remaining_hours || 0)) * 100) / 100;
      task.duration_days = durationDays(task);
      task.duration = formatDuration(task);
      task.slippage_status = slippageStatus(task);
      const byId = new Map((allRows || []).map(r => [Number(r.id), r]));
      if (deps.length) {
        task.predecessor_ids = deps.map(dep => dep.predecessor_id).join(",");
        task.predecessors_display = deps.map(dep => formatDependency(dep, byId)).filter(Boolean).join(",");
      } else {
        task.predecessors_display = splitCsv(task.predecessor_ids)
          .map(id => byId.get(Number(id))?.wbs_code)
          .filter(Boolean)
          .join(",");
      }
      task.sprint_name = sprintName(task.sprint_id);
      task.is_summary = false;
      task.milestone_count = task.is_milestone ? 1 : 0;
      task.slipped_count = task.slippage_status === "slipped" ? 1 : 0;
      task.at_risk_count = task.slippage_status === "at-risk" ? 1 : 0;
      task.resource_summary = task.resource;
      computeVariance(task);
      return task;
    }

    function applySummaryRollups(tasks) {
      const byParent = new Map();
      for (const task of tasks) {
        const key = task.parent_id == null ? "root" : String(task.parent_id);
        if (!byParent.has(key)) byParent.set(key, []);
        byParent.get(key).push(task);
      }
      const byId = new Map(tasks.map(t => [t.id, t]));
      const ordered = [...tasks].sort((a, b) => b.wbs_code.split(".").length - a.wbs_code.split(".").length);
      for (const task of ordered) {
        const children = byParent.get(String(task.id)) || [];
        if (!children.length) continue;
        task.is_summary = true;
        if (!task.manually_scheduled) {
          const starts = children.map(c => c.start_date).filter(isValidIsoDate).sort();
          const ends = children.map(c => c.end_date).filter(isValidIsoDate).sort();
          if (starts.length) task.start_date = starts[0];
          if (ends.length) task.end_date = ends.at(-1);
          const actualStarts = children.map(c => c.actual_start_date).filter(isValidIsoDate).sort();
          const actualEnds = children.map(c => c.actual_end_date).filter(isValidIsoDate).sort();
          task.actual_start_date = actualStarts[0] || "";
          task.actual_end_date = actualEnds.at(-1) || "";
          task.duration_hours = children.reduce((sum, child) => sum + durationHours(child), 0) || task.duration_hours;
          task.actual_hours = children.reduce((sum, child) => sum + Number(child.actual_hours || 0), 0);
          task.remaining_hours = children.reduce((sum, child) => sum + Number(child.remaining_hours || 0), 0);
          task.estimate_at_completion_hours = Math.round((task.actual_hours + task.remaining_hours) * 100) / 100;
          const weightedHours = children.reduce((sum, child) => sum + durationHours(child), 0);
          if (weightedHours) {
            task.progress = Math.round(children.reduce((sum, child) => sum + durationHours(child) * Number(child.progress || 0), 0) / weightedHours);
          }
        }
        const baselineStarts = children.map(c => c.baseline_start_date).filter(isValidIsoDate).sort();
        const baselineEnds = children.map(c => c.baseline_end_date).filter(isValidIsoDate).sort();
        if (baselineStarts.length) task.baseline_start_date = baselineStarts[0];
        if (baselineEnds.length) task.baseline_end_date = baselineEnds.at(-1);
        if (children.some(c => c.slippage_status === "slipped")) task.slippage_status = "slipped";
        else if (children.some(c => c.slippage_status === "at-risk")) task.slippage_status = "at-risk";
        task.status = children.some(child => child.status === "Blocked") && task.progress < 100 ? "Blocked" : statusForProgress(task.progress);
        task.milestone_count = children.reduce((sum, child) => sum + Number(child.milestone_count || 0), 0);
        task.slipped_count = children.reduce((sum, child) => sum + Number(child.slipped_count || 0), 0);
        task.at_risk_count = children.reduce((sum, child) => sum + Number(child.at_risk_count || 0), 0);
        task.resource_summary = [...new Set(children.flatMap(child => splitCsv(child.resource_summary || child.resource)))].join(", ");
        task.duration_days = durationDays(task);
        task.duration = formatDuration(task);
        task.children = children.map(c => byId.get(c.id)?.id).filter(Boolean);
        computeVariance(task);
        if (children.some(c => c.has_baseline_variance)) task.has_baseline_variance = true;
      }
      return tasks;
    }

    function applyCriticalPath(tasks) {
      const calculable = tasks.filter(task => !task.is_summary);
      const byId = new Map(calculable.map(task => [task.id, task]));
      const incoming = new Map(calculable.map(task => [task.id, task.dependencies?.length
        ? task.dependencies
        : splitCsv(task.predecessor_ids).map(id => ({ predecessor_id: Number(id), type: "FS", lag_hours: 0 }))]));
      const successors = new Map(calculable.map(task => [task.id, []]));
      for (const task of calculable) {
        for (const dep of incoming.get(task.id) || []) {
          if (!byId.has(Number(dep.predecessor_id))) continue;
          successors.get(Number(dep.predecessor_id))?.push({ successor_id: task.id, type: dep.type || "FS", lag_hours: Number(dep.lag_hours || 0) });
        }
      }
      const duration = task => Math.max(0, durationHours(task) / workingHoursPerDay());
      const lagDays = dep => Number(dep.lag_hours || 0) / workingHoursPerDay();
      const ordered = sortTasksByWbs(calculable);

      // Use actual scheduled start dates as a floor for the forward pass.
      // If a task is scheduled to start later than its dependency-constrained
      // earliest start, that gap is real float and should not be hidden.
      const validStartDates = calculable.filter(t => isValidIsoDate(t.start_date));
      const projectStartDate = validStartDates.length
        ? validStartDates.map(t => t.start_date).sort()[0]
        : null;
      const scheduleFloor = task => {
        if (!projectStartDate || !isValidIsoDate(task.start_date)) return 0;
        return Math.max(0, workingDaysBetween(projectStartDate, task.start_date) - 1);
      };

      for (let pass = 0; pass < calculable.length + 2; pass++) {
        let changed = false;
        for (const task of ordered) {
          const dur = duration(task);
          let start = scheduleFloor(task);
          for (const dep of incoming.get(task.id) || []) {
            const pred = byId.get(Number(dep.predecessor_id));
            if (!pred) continue;
            const lag = lagDays(dep);
            const type = String(dep.type || "FS").toUpperCase();
            const candidate = type === "SS"
              ? Number(pred.early_start_offset || 0) + lag
              : type === "FF"
                ? Number(pred.early_finish_offset || duration(pred)) + lag - dur
                : type === "SF"
                  ? Number(pred.early_start_offset || 0) + lag - dur
                  : Number(pred.early_finish_offset || duration(pred)) + lag;
            start = Math.max(start, candidate);
          }
          const finish = start + dur;
          if (Math.abs(Number(task.early_start_offset || 0) - start) > 0.001 || Math.abs(Number(task.early_finish_offset || 0) - finish) > 0.001) {
            task.early_start_offset = Math.round(start * 100) / 100;
            task.early_finish_offset = Math.round(finish * 100) / 100;
            changed = true;
          }
        }
        if (!changed) break;
      }
      const projectFinish = Math.max(0, ...calculable.map(task => Number(task.early_finish_offset || 0)));
      for (const task of calculable) {
        const dur = duration(task);
        task.latest_finish_offset = projectFinish;
        task.latest_start_offset = projectFinish - dur;
      }
      for (let pass = 0; pass < calculable.length + 2; pass++) {
        let changed = false;
        for (const task of [...ordered].reverse()) {
          const dur = duration(task);
          let latestFinish = successors.get(task.id)?.length ? Number.POSITIVE_INFINITY : projectFinish;
          let latestStart = Number.POSITIVE_INFINITY;
          for (const dep of successors.get(task.id) || []) {
            const succ = byId.get(Number(dep.successor_id));
            if (!succ) continue;
            const lag = lagDays(dep);
            const type = String(dep.type || "FS").toUpperCase();
            if (type === "SS") latestStart = Math.min(latestStart, Number(succ.latest_start_offset || 0) - lag);
            else if (type === "FF") latestFinish = Math.min(latestFinish, Number(succ.latest_finish_offset || 0) - lag);
            else if (type === "SF") latestStart = Math.min(latestStart, Number(succ.latest_finish_offset || 0) - lag);
            else latestFinish = Math.min(latestFinish, Number(succ.latest_start_offset || 0) - lag);
          }
          if (latestStart !== Number.POSITIVE_INFINITY) latestFinish = Math.min(latestFinish, latestStart + dur);
          if (latestFinish === Number.POSITIVE_INFINITY) latestFinish = projectFinish;
          const nextStart = latestFinish - dur;
          if (Math.abs(Number(task.latest_finish_offset || 0) - latestFinish) > 0.001 || Math.abs(Number(task.latest_start_offset || 0) - nextStart) > 0.001) {
            task.latest_finish_offset = Math.round(latestFinish * 100) / 100;
            task.latest_start_offset = Math.round(nextStart * 100) / 100;
            changed = true;
          }
        }
        if (!changed) break;
      }
      for (const task of calculable) {
        const floatDays = Math.max(0, Number(task.latest_start_offset || 0) - Number(task.early_start_offset || 0));
        task.total_float_days = Math.round(floatDays * 100) / 100;
        task.is_critical = false;
        task.is_near_critical = false;
      }

      // Only flag critical/near-critical when the project has a real dependency
      // network OR when tasks have meaningfully different durations (so float
      // variation is real, not an artefact of identical schedules).
      // Without any dependencies and with all-zero float, CPM produces a
      // degenerate result where every independent task looks "critical" —
      // suppress it so the Crit column stays blank until the plan has structure.
      const hasDeps = calculable.some(t =>
        (incoming.get(t.id) || []).some(d => byId.has(Number(d.predecessor_id)))
      );
      const anyPositiveFloat = calculable.some(t => (t.total_float_days || 0) > 0.01);

      if (hasDeps || anyPositiveFloat) {
        for (const task of calculable) {
          task.is_critical = !task.is_summary && task.total_float_days <= 0.01
            && isValidIsoDate(task.start_date) && isValidIsoDate(task.end_date);
          task.is_near_critical = !task.is_critical && !task.is_summary && task.total_float_days <= 2;
        }
      } else {
        // Degenerate network — clear float display too so the column is blank
        for (const task of calculable) task.total_float_days = "";
      }

      const summaries = tasks.filter(task => task.is_summary).sort((a, b) => b.wbs_code.split(".").length - a.wbs_code.split(".").length);
      for (const task of summaries) {
        const children = tasks.filter(child => child.parent_id === task.id);
        task.is_critical = children.some(child => child.is_critical);
        task.is_near_critical = !task.is_critical && children.some(child => child.is_near_critical);
        task.total_float_days = children.length && (hasDeps || anyPositiveFloat)
          ? Math.min(...children.map(child => Number(child.total_float_days || 0)))
          : "";
      }
      return tasks;
    }

    function execRows(db, sql, params = []) {
      const stmt = db.prepare(sql);
      try {
        stmt.bind(params);
        const rows = [];
        while (stmt.step()) rows.push(stmt.getAsObject());
        return rows;
      } finally {
        stmt.free();
      }
    }

    function execOne(db, sql, params = []) {
      return execRows(db, sql, params)[0] || null;
    }

    function bytesToBase64(bytes) {
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function idbOpen() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("novaplan_idb", 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore("store");
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGet(key) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const req = db.transaction("store", "readonly").objectStore("store").get(key);
        req.onsuccess = () => { db.close(); resolve(req.result ?? null); };
        req.onerror = () => { db.close(); reject(req.error); };
      });
    }

    async function idbSet(key, value) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const req = db.transaction("store", "readwrite").objectStore("store").put(value, key);
        req.onsuccess = () => { db.close(); resolve(); };
        req.onerror = () => { db.close(); reject(req.error); };
      });
    }

    function idbDeleteDatabase() {
      return new Promise(resolve => {
        const req = indexedDB.deleteDatabase("novaplan_idb");
        req.onsuccess = resolve;
        req.onerror = resolve;
        req.onblocked = resolve;
      });
    }

    const StorageEngine = {
      getStorageKeyAndFile() {
        const proj = state.activeProject || "Default Project";
        if (proj === "Default Project") {
          return { key: "sqlite", file: "novaplan.sqlite", localKey: "novaplan_sqlite_bytes_v1" };
        } else {
          const safeName = proj.replace(/[^a-zA-Z0-9_-]/g, "_");
          return { key: `sqlite_${safeName}`, file: `novaplan_${safeName}.sqlite`, localKey: `novaplan_sqlite_bytes_v1_${safeName}` };
        }
      },
      async loadPersistedBytesForProject(proj) {
        let key, file, localKey;
        if (proj === "Default Project") {
          key = "sqlite";
          file = "novaplan.sqlite";
          localKey = "novaplan_sqlite_bytes_v1";
        } else {
          const safeName = proj.replace(/[^a-zA-Z0-9_-]/g, "_");
          key = `sqlite_${safeName}`;
          file = `novaplan_${safeName}.sqlite`;
          localKey = `novaplan_sqlite_bytes_v1_${safeName}`;
        }
        try {
          if (navigator.storage?.getDirectory) {
            const root = await navigator.storage.getDirectory();
            const fileHandle = await root.getFileHandle(file, { create: false });
            const f = await fileHandle.getFile();
            const bytes = new Uint8Array(await f.arrayBuffer());
            if (bytes.length) return bytes;
          }
        } catch {}
        try {
          const bytes = await idbGet(key);
          if (bytes) return new Uint8Array(bytes);
        } catch {}
        try {
          const saved = localStorage.getItem(localKey);
          if (saved) return base64ToBytes(saved);
        } catch {}
        return null;
      },
      async persistBytesForProject(proj, bytes) {
        const safeName = proj.replace(/[^a-zA-Z0-9_-]/g, "_");
        const key = proj === "Default Project" ? "sqlite" : `sqlite_${safeName}`;
        const file = proj === "Default Project" ? "novaplan.sqlite" : `novaplan_${safeName}.sqlite`;
        const localKey = proj === "Default Project" ? "novaplan_sqlite_bytes_v1" : `novaplan_sqlite_bytes_v1_${safeName}`;
        try {
          if (navigator.storage?.getDirectory) {
            const root = await navigator.storage.getDirectory();
            const fileHandle = await root.getFileHandle(file, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(bytes);
            await writable.close();
            return;
          }
        } catch {}
        try {
          await idbSet(key, bytes);
          return;
        } catch {}
        try {
          localStorage.setItem(localKey, bytesToBase64(bytes));
        } catch {}
      },
      async deleteProjectStorage(proj) {
        const safeName = proj.replace(/[^a-zA-Z0-9_-]/g, "_");
        const key = proj === "Default Project" ? "sqlite" : `sqlite_${safeName}`;
        const file = proj === "Default Project" ? "novaplan.sqlite" : `novaplan_${safeName}.sqlite`;
        const localKey = proj === "Default Project" ? "novaplan_sqlite_bytes_v1" : `novaplan_sqlite_bytes_v1_${safeName}`;
        try {
          if (navigator.storage?.getDirectory) {
            const root = await navigator.storage.getDirectory();
            await root.removeEntry(file, { recursive: true });
          }
        } catch {}
        try {
          const db = await idbOpen();
          await new Promise((resolve, reject) => {
            const req = db.transaction("store", "readwrite").objectStore("store").delete(key);
            req.onsuccess = () => { db.close(); resolve(); };
            req.onerror = () => { db.close(); reject(req.error); };
          });
        } catch {}
        try {
          localStorage.removeItem(localKey);
        } catch {}
      },
      async init() {
        await this.loadSqlJs();
        const initialBytes = await this.loadPersistedBytes();
        this.db = initialBytes ? new this.SQL.Database(initialBytes) : new this.SQL.Database();
        this.db.run("PRAGMA foreign_keys = ON");
        this.createSchema();
        await this.persist();
        return this;
      },
      async loadSqlJs() {
        if (!window.initSqlJs) {
          await new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = SQL_JS_URL;
            script.onload = resolve;
            script.onerror = () => reject(new Error("Unable to load sql.js"));
            document.head.appendChild(script);
          });
        }
        this.SQL = await window.initSqlJs({ locateFile: file => SQL_WASM_PATH + file });
      },
      async loadPersistedBytes() {
        this.mode = "In-Memory";
        this.persistWarning = "No persistent storage available. Export SQL before closing.";

        const keys = this.getStorageKeyAndFile();
        const file = keys.file;
        const key = keys.key;
        const localKey = keys.localKey;

        // Tier 1: OPFS — native browser file, best performance
        try {
          if (navigator.storage?.getDirectory) {
            const root = await navigator.storage.getDirectory();
            this.fileHandle = await root.getFileHandle(file, { create: true });
            const f = await this.fileHandle.getFile();
            const bytes = new Uint8Array(await f.arrayBuffer());
            this.mode = "OPFS";
            this.persistWarning = "";
            return bytes.length ? bytes : null;
          }
        } catch (err) {
          console.warn("OPFS unavailable:", err.message);
        }

        // Tier 2: IndexedDB — works on file://, stores binary natively, large capacity
        try {
          const idbBytes = await idbGet(key);
          this.mode = "IndexedDB";
          this.persistWarning = "";
          if (idbBytes) return new Uint8Array(idbBytes);
          // No IDB data yet — migrate from localStorage if present
          if (key === "sqlite") {
            try {
              const legacy = localStorage.getItem("novaplan_sqlite_bytes_v1");
              if (legacy) {
                const migrated = base64ToBytes(legacy);
                await idbSet("sqlite", migrated);
                localStorage.removeItem("novaplan_sqlite_bytes_v1");
                return migrated;
              }
            } catch {}
          }
          return null;
        } catch (err) {
          console.warn("IndexedDB unavailable:", err.message);
        }

        // Tier 3: localStorage — 5 MB limit, base64 encoded, last resort
        try {
          const saved = localStorage.getItem(localKey);
          if (saved) {
            this.mode = "localStorage";
            this.persistWarning = "Saving to localStorage (5 MB limit). Export SQL regularly for a portable backup.";
            return base64ToBytes(saved);
          }
          this.mode = "localStorage";
          this.persistWarning = "Saving to localStorage (5 MB limit). Export SQL regularly for a portable backup.";
        } catch (err) {
          console.warn("localStorage unavailable:", err.message);
        }
        return null;
      },
      createSchema() {
        this.db.run(`
          CREATE TABLE IF NOT EXISTS tasks (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            wbs_code TEXT NOT NULL UNIQUE,
            task_type TEXT,
            title TEXT NOT NULL,
            start_date TEXT NOT NULL,
            end_date TEXT NOT NULL,
            actual_start_date TEXT,
            actual_end_date TEXT,
            duration_hours REAL DEFAULT 8 CHECK (duration_hours > 0),
            actual_hours REAL DEFAULT 0,
            remaining_hours REAL,
            progress INTEGER DEFAULT 0 CHECK (progress >= 0 AND progress <= 100),
            predecessor_ids TEXT,

            comments TEXT,

            jira_url TEXT,
            color TEXT,
            gantt_label TEXT,
            gantt_label_position TEXT,

            is_milestone INTEGER DEFAULT 0 CHECK (is_milestone IN (0, 1)),
            is_highlighted INTEGER DEFAULT 0 CHECK (is_highlighted IN (0, 1)),

            CHECK (actual_end_date IS NULL OR actual_start_date IS NULL OR actual_end_date >= actual_start_date),

        this.createAuxiliarySchema(this.db);

        this.ensureDefaultSavedViews(this.db);

      },
      migrateSchema(db = this.db) {
        const columns = new Set(execRows(db, "PRAGMA table_info(tasks)").map(c => c.name));
        const additions = [
          ["actual_start_date", "ALTER TABLE tasks ADD COLUMN actual_start_date TEXT"],
          ["actual_end_date", "ALTER TABLE tasks ADD COLUMN actual_end_date TEXT"],
          ["duration_hours", "ALTER TABLE tasks ADD COLUMN duration_hours REAL DEFAULT 8"],
          ["actual_hours", "ALTER TABLE tasks ADD COLUMN actual_hours REAL DEFAULT 0"],
          ["remaining_hours", "ALTER TABLE tasks ADD COLUMN remaining_hours REAL"],
          ["is_milestone", "ALTER TABLE tasks ADD COLUMN is_milestone INTEGER DEFAULT 0"],
          ["status", "ALTER TABLE tasks ADD COLUMN status TEXT DEFAULT 'Not Started'"],
          ["priority", "ALTER TABLE tasks ADD COLUMN priority TEXT DEFAULT 'Medium'"],
          ["sprint_id", "ALTER TABLE tasks ADD COLUMN sprint_id INTEGER"],
          ["manually_scheduled", "ALTER TABLE tasks ADD COLUMN manually_scheduled INTEGER DEFAULT 0"],
          ["constraint_type", "ALTER TABLE tasks ADD COLUMN constraint_type TEXT"],

        db.run("UPDATE tasks SET status = 'Not Started' WHERE status IS NULL OR status = ''");
        db.run("UPDATE tasks SET priority = 'Medium' WHERE priority IS NULL OR priority = ''");
      },
      ensureDefaultSettings(db = this.db) {
        const existing = execOne(db, "SELECT key FROM project_settings WHERE key = 'calendar'");
        if (!existing) db.run("INSERT INTO project_settings (key, value) VALUES ('calendar', ?)", [JSON.stringify(DEFAULT_CALENDAR)]);
      },
      ensureDefaultSavedViews(db = this.db) {
        const defaults = [
          ["Default", { mode: "split", filter: "all", group: "none" }],
          ["Slipped Tasks", { mode: "split", filter: "slipped", group: "none" }],
          ["Milestones", { mode: "gantt", filter: "milestones", group: "none" }],
          ["Current Sprint", { mode: "sprint", filter: "current-sprint", group: "sprint" }],
          ["Resource Load", { mode: "board", filter: "all", group: "resource" }],
          ["Baseline Variance", { mode: "split", filter: "baseline-variance", group: "none" }]
        ];
        for (const [name, config] of defaults) {
          db.run("INSERT OR IGNORE INTO saved_views (name, config_json) VALUES (?, ?)", [name, JSON.stringify(config)]);
        }
      },
      migrateDependenciesFromTasks(db = this.db) {
        const existing = Number(execOne(db, "SELECT COUNT(*) AS count FROM dependencies")?.count || 0);
        if (existing) return;
        const rows = execRows(db, "SELECT id, predecessor_ids FROM tasks");
        for (const row of rows) {
          for (const pred of splitCsv(row.predecessor_ids)) {
            const predecessorId = Number(pred);
            if (Number.isFinite(predecessorId)) {
              db.run("INSERT OR IGNORE INTO dependencies (successor_id, predecessor_id, type, lag_hours) VALUES (?,?, 'FS', 0)", [Number(row.id), predecessorId]);
            }
          }
        }
      },
      async persist() {
        const bytes = this.db.export();
        const keys = this.getStorageKeyAndFile();
        const file = keys.file;
        const key = keys.key;
        const localKey = keys.localKey;

        if (this.fileHandle) {
          try {
            if (this.fileHandle.name !== file) {
              if (navigator.storage?.getDirectory) {
                const root = await navigator.storage.getDirectory();
                this.fileHandle = await root.getFileHandle(file, { create: true });
              }
            }
            const writable = await this.fileHandle.createWritable();
            await writable.write(bytes);
            await writable.close();
            return;
          } catch (err) {
            console.warn("OPFS write failed, falling back:", err.message);
          }
        }
        if (this.mode === "IndexedDB") {
          try {
            await idbSet(key, bytes);
            return;
          } catch (err) {
            console.warn("IndexedDB save failed:", err.message);
          }
        }
        try {
          localStorage.setItem(localKey, bytesToBase64(bytes));
        } catch (err) {
          console.warn("localStorage save failed:", err.message);
        }
      },
      async transact(callback) {
        this.db.run("BEGIN");
        try {
          const result = await callback();
          this.db.run("COMMIT");
          await this.persist();
          return result;
        } catch (error) {
          this.db.run("ROLLBACK");
          throw error;
        }
      },
      async loadSettings() {
        this.ensureDefaultSettings(this.db);
        const rows = execRows(this.db, "SELECT key, value FROM project_settings");
        const settings = { calendar: { ...DEFAULT_CALENDAR }, ganttLabels: { ...DEFAULT_GANTT_LABELS }, ganttLines: [] };
        for (const row of rows) {
          try {
            settings[row.key] = JSON.parse(row.value);
          } catch {
            settings[row.key] = row.value;
          }
        }
        settings.calendar = { ...DEFAULT_CALENDAR, ...(settings.calendar || {}) };
        settings.ganttLabels = { ...DEFAULT_GANTT_LABELS, ...(settings.ganttLabels || {}) };
        if (!["task", "custom"].includes(settings.ganttLabels.source)) settings.ganttLabels.source = DEFAULT_GANTT_LABELS.source;
        if (!GANTT_LABEL_POSITIONS.includes(settings.ganttLabels.position)) settings.ganttLabels.position = DEFAULT_GANTT_LABELS.position;
        settings.ganttLines = sanitizeGanttLines(settings.ganttLines);
        return settings;
      },
      async saveSetting(key, value) {
        await this.transact(async () => {
          this.db.run(
            "INSERT INTO project_settings (key, value) VALUES (?, ?) ON CONFLICT(key) DO UPDATE SET value = excluded.value",
            [key, JSON.stringify(value)]
          );
        });
      },

      async insertTask(fields) {
        return this.transact(async () => {
          const columns = Object.keys(fields);
          const params = columns.map(key => fields[key]);
          const placeholders = columns.map(() => "?").join(",");
          this.db.run(`INSERT INTO tasks (${columns.join(",")}) VALUES (${placeholders})`, params);

      async updateTask(id, fields) {
        await this.transact(async () => {
          const dependencies = fields.__dependencies;
          delete fields.__dependencies;
          if (dependencies) this.replaceDependencies(id, dependencies);
          const keys = Object.keys(fields);
          if (!keys.length) return;
          const assignments = keys.map(key => `${key} = ?`).join(", ");
          this.db.run(`UPDATE tasks SET ${assignments} WHERE id = ?`, [...keys.map(k => fields[k]), id]);
          if (keys.includes("parent_id")) {
            this.resequenceWbsInDb();
          }
        });
      },
      replaceDependencies(successorId, dependencies) {
        this.db.run("DELETE FROM dependencies WHERE successor_id = ?", [successorId]);
        for (const dep of dependencies) {
          this.db.run(
            "INSERT OR IGNORE INTO dependencies (successor_id, predecessor_id, type, lag_hours) VALUES (?,?,?,?)",
            [successorId, dep.predecessor_id, dep.type || "FS", Number(dep.lag_hours || 0)]
          );
        }
        this.db.run("UPDATE tasks SET predecessor_ids = ? WHERE id = ?", [dependencies.map(dep => dep.predecessor_id).join(","), successorId]);
      },
      collectDescendants(ids) {
        const all = new Set(ids.map(Number));
        const queue = [...all];
        while (queue.length) {
          const id = queue.shift();
          const children = execRows(this.db, "SELECT id FROM tasks WHERE parent_id = ?", [id]);
          for (const child of children) {
            const childId = Number(child.id);
            if (!all.has(childId)) {
              all.add(childId);
              queue.push(childId);
            }
          }
        }
        return [...all];
      },
      async deleteTasksCascade(ids) {
        await this.transact(async () => {
          const deleteIds = this.collectDescendants(ids);
          for (const id of deleteIds) {
            this.db.run("DELETE FROM dependencies WHERE successor_id = ? OR predecessor_id = ?", [id, id]);
            this.db.run("DELETE FROM baseline_tasks WHERE task_id = ?", [id]);
          }
          for (const id of deleteIds) this.db.run("DELETE FROM tasks WHERE id = ?", [id]);
          const rows = execRows(this.db, "SELECT * FROM tasks");
          for (const row of rows) {
            const kept = splitCsv(row.predecessor_ids).filter(id => !deleteIds.includes(Number(id))).join(",");
            this.db.run("UPDATE tasks SET predecessor_ids = ? WHERE id = ?", [kept, row.id]);
          }
          this.resequenceWbsInDb();
        });
      },
      resequenceWbsInDb() {
        const rows = execRows(this.db, "SELECT id, parent_id FROM tasks");
        const childrenByParent = new Map();
        for (const row of rows) {
          const key = row.parent_id == null ? "root" : String(row.parent_id);
          if (!childrenByParent.has(key)) childrenByParent.set(key, []);
          childrenByParent.get(key).push(Number(row.id));
        }
        const current = new Map(execRows(this.db, "SELECT id, wbs_code FROM tasks").map(r => [Number(r.id), r.wbs_code]));
        for (const list of childrenByParent.values()) {
          list.sort((a, b) => compareWbs(current.get(a), current.get(b)));
        }
        const updates = [];
        const assign = (parentId, prefix) => {
          const key = parentId == null ? "root" : String(parentId);
          const list = childrenByParent.get(key) || [];
          list.forEach((id, index) => {
            const code = prefix ? `${prefix}.${index + 1}` : String(index + 1);
            updates.push([code, id]);
            assign(id, code);
          });
        };
        assign(null, "");
        for (const [code, id] of updates) this.db.run("UPDATE tasks SET wbs_code = ? WHERE id = ?", [code, id]);
      },
      exportSQL() {
        const tables = ["tasks", "project_settings", "sprints", "dependencies", "baseline_meta", "baseline_tasks", "saved_views", "scenarios", "raid_items", "change_logs"];
        const lines = [
          "PRAGMA foreign_keys=OFF;",
          ...[...tables].reverse().map(table => `DROP TABLE IF EXISTS ${table};`)
        ];
        for (const table of tables) lines.push(...this.dumpTable(table));
        lines.push("PRAGMA foreign_keys=ON;");
        downloadBlob(new Blob([lines.join("\n")], { type: "application/sql" }), "novaplan_export.sql");
      },
      dumpTable(table) {
        const create = execOne(this.db, "SELECT sql FROM sqlite_master WHERE type = 'table' AND name = ?", [table]);
        if (!create?.sql) return [];
        const columns = execRows(this.db, `PRAGMA table_info(${table})`).map(c => c.name);
        const rows = execRows(this.db, `SELECT * FROM ${table}`);
        const lines = [`${create.sql};`];
        for (const row of rows) {
          lines.push(`INSERT INTO ${table} (${columns.join(",")}) VALUES (${columns.map(column => sqlValue(row[column])).join(",")});`);
        }
        return lines;
      },
      async importSQL(sqlText) {
        const snapshot = this.db.export();
        const oldDb = this.db;
        try {
          const db = new this.SQL.Database();
          db.run("PRAGMA foreign_keys = ON");
          db.run(sqlText);
          this.migrateImportedDb(db);
          this.validateImportedDb(db);
          this.db = db;
          await this.persist();
          oldDb.close();
        } catch (error) {
          this.db = new this.SQL.Database(snapshot);
          this.db.run("PRAGMA foreign_keys = ON");
          throw error;
        }
      },
      async importCSV(csvText) {
        const rows = parseCsv(csvText);
        if (!rows.length) throw new Error("CSV has no task rows");
        await this.transact(async () => {
          const usedWbs = new Set(execRows(this.db, "SELECT wbs_code FROM tasks").map(row => row.wbs_code));
          const nextRoot = () => {
            const roots = [...usedWbs].map(code => Number(text(code).split(".")[0]) || 0);
            const code = String((roots.length ? Math.max(...roots) : 0) + 1);
            usedWbs.add(code);
            return code;
          };
          const pick = (row, names, fallback = "") => {
            for (const name of names) {
              if (row[name] != null && row[name] !== "") return row[name];
            }
            return fallback;
          };
          for (const row of rows) {
            const title = pick(row, ["Task Name", "Title", "Summary", "Name"]);
            if (!title) continue;
            let wbs = pick(row, ["WBS", "wbs_code"]);
            if (!wbs || usedWbs.has(wbs)) wbs = nextRoot();
            else usedWbs.add(wbs);
            const start = pick(row, ["Planned Start Date", "Start Date", "Start", "start_date"], todayIso());
            const end = pick(row, ["Planned End Date", "Due Date", "Finish", "End", "end_date"], start);
            if (!isValidIsoDate(start) || !isValidIsoDate(end) || end < start) throw new Error(`Invalid date range in CSV row ${title}`);
            const progress = clamp(Number(pick(row, ["% Complete", "Progress", "progress"], 0)) || 0, 0, 100);
            const duration = Number(pick(row, ["Duration Hours", "Original Estimate", "duration_hours"], plannedDateDurationHours({ start_date: start, end_date: end }))) || workingHoursPerDay();
            const actual = Number(pick(row, ["Actual Hours", "actual_hours"], 0)) || 0;
            const remaining = Number(pick(row, ["Remaining Hours", "Remaining Estimate", "remaining_hours"], Math.max(0, duration * (100 - progress) / 100))) || 0;
            const jira = normalizeJiraUrl(pick(row, ["Jira Link", "Jira", "jira_url"], ""));
            const status = TASK_STATUSES.includes(pick(row, ["Status", "status"])) ? pick(row, ["Status", "status"]) : statusForProgress(progress);
            const priority = TASK_PRIORITIES.includes(pick(row, ["Priority", "priority"])) ? pick(row, ["Priority", "priority"]) : "Medium";
            const rawColor = pick(row, ["Color", "color"], "");
            const color = /^#[0-9a-fA-F]{6}$/.test(rawColor) ? rawColor : null;
            const ganttLabel = pick(row, ["Gantt Text", "Gantt Label", "gantt_label"], "").slice(0, 120);
            const rawGanttLabelPosition = pick(row, ["Gantt Text Position", "Gantt Label Position", "gantt_label_position"], "").toLowerCase();
            const ganttLabelPosition = ["above", "below", "middle"].includes(rawGanttLabelPosition) ? rawGanttLabelPosition : "";
            const rawGanttLabelColor = pick(row, ["Gantt Text Color", "Gantt Label Color", "gantt_label_color"], "");
            const ganttLabelColor = /^#[0-9a-fA-F]{6}$/.test(rawGanttLabelColor) ? rawGanttLabelColor : "";
            const rawGanttLabelFont = pick(row, ["Gantt Text Font", "Gantt Label Font", "gantt_label_font"], "");
            const ganttLabelFont = GANTT_LABEL_FONTS.find(font => font.value === rawGanttLabelFont || font.label.toLowerCase() === rawGanttLabelFont.toLowerCase())?.value || "";
            this.db.run(
              "INSERT INTO tasks (wbs_code, task_type, title, start_date, end_date, actual_start_date, actual_end_date, duration_hours, actual_hours, remaining_hours, progress, predecessor_ids, resource, comments, tags, jira_url, color, gantt_label, gantt_label_position, gantt_label_color, gantt_label_font, is_milestone, is_highlighted, parent_id, status, priority, sprint_id, manually_scheduled, constraint_type, constraint_date) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,NULL,0,NULL,NULL)",
              [wbs, DEFAULT_TYPE, title, start, end, null, null, duration, actual, remaining, progress, "", pick(row, ["Resource", "Assignee", "resource"]), pick(row, ["Comments", "Description", "comments"]), pick(row, ["Tags", "Labels", "tags"]), jira, color, ganttLabel, ganttLabelPosition, ganttLabelColor, ganttLabelFont, /^yes|true|1$/i.test(pick(row, ["Milestone", "is_milestone"])), 0, null, status, priority]
            );
          }
        });
      },
      migrateImportedDb(db) {
        this.createAuxiliarySchema(db);
        this.migrateSchema(db);
        this.ensureDefaultSettings(db);
        this.ensureDefaultSavedViews(db);
        this.migrateDependenciesFromTasks(db);
      },
      validateImportedDb(db) {
        const columns = execRows(db, "PRAGMA table_info(tasks)").map(c => c.name);
        for (const required of ["id", "wbs_code", "title", "start_date", "end_date", "actual_start_date", "actual_end_date", "duration_hours", "actual_hours", "remaining_hours", "progress", "predecessor_ids", "resource", "comments", "tags", "jira_url", "is_milestone", "is_highlighted", "parent_id", "status", "priority", "sprint_id", "manually_scheduled", "constraint_type", "constraint_date", "github_url", "custom_fields_json"]) {
          if (!columns.includes(required)) throw new Error(`Schema mismatch: missing ${required}`);
        }
        const rows = execRows(db, "SELECT * FROM tasks");
        const ids = new Set(rows.map(r => Number(r.id)));
        const dependencies = execRows(db, "SELECT * FROM dependencies");
        const wbsCodes = new Set();
        for (const row of rows) {
          if (wbsCodes.has(row.wbs_code)) throw new Error(`Invalid WBS: duplicate ${row.wbs_code}`);
          wbsCodes.add(row.wbs_code);
          if (!isValidIsoDate(row.start_date) || !isValidIsoDate(row.end_date) || row.end_date < row.start_date) {
            throw new Error(`Invalid date range for ${row.wbs_code}`);
          }
          if (row.actual_start_date && !isValidIsoDate(row.actual_start_date)) throw new Error(`Invalid actual start date for ${row.wbs_code}`);
          if (row.actual_end_date && !isValidIsoDate(row.actual_end_date)) throw new Error(`Invalid actual end date for ${row.wbs_code}`);
          if (row.actual_start_date && row.actual_end_date && row.actual_end_date < row.actual_start_date) throw new Error(`Invalid actual date range for ${row.wbs_code}`);
          if (Number(row.duration_hours) <= 0) throw new Error(`Invalid duration hours for ${row.wbs_code}`);
          if (Number(row.actual_hours) < 0 || Number(row.remaining_hours) < 0) throw new Error(`Invalid work hours for ${row.wbs_code}`);
          if (row.jira_url) normalizeJiraUrl(row.jira_url);
          if (row.parent_id != null && !ids.has(Number(row.parent_id))) throw new Error(`Invalid parent reference for ${row.wbs_code}`);
          for (const pred of splitCsv(row.predecessor_ids)) {
            if (!ids.has(Number(pred))) throw new Error(`Invalid predecessor reference for ${row.wbs_code}`);
          }
        }
        for (const dep of dependencies) {
          if (!ids.has(Number(dep.successor_id))) throw new Error("Invalid dependency successor reference");
          if (!ids.has(Number(dep.predecessor_id))) throw new Error("Invalid dependency predecessor reference");
          if (!DEPENDENCY_TYPES.includes(String(dep.type || "").toUpperCase())) throw new Error("Invalid dependency type");
        }
        const tasks = rows.map(row => normalizeTask(row, rows));
        for (const task of tasks) {
          const cycle = WBSUtils.hasCircularDependency(task.id, splitCsv(task.predecessor_ids).map(Number), tasks);
          if (cycle.circular) throw new Error(`Circular dependency: ${cycle.path}`);
        }
      }
    };

    const WBSUtils = {
      nextRootCode(tasks) {
        const roots = tasks.filter(t => t.parent_id == null).map(t => Number(t.wbs_code.split(".")[0]) || 0);
        return String((roots.length ? Math.max(...roots) : 0) + 1);
      },
      nextChildCode(parent, tasks) {
        const codes = tasks
          .filter(t => t.parent_id === parent.id)
          .map(t => Number(t.wbs_code.split(".").at(-1)) || 0);
        return `${parent.wbs_code}.${(codes.length ? Math.max(...codes) : 0) + 1}`;
      },
      resolvePredecessorCodesToIds(input, task, tasks) {
        const tokens = splitCsv(input);
        const byCode = new Map(tasks.map(t => [t.wbs_code, t]));
        const specs = [];
        const ids = [];
        for (const token of tokens) {
          const match = token.match(/^([0-9]+(?:\.[0-9]+)*)(FS|SS|FF|SF)?([+-]\d+(?:\.\d+)?[dh])?$/i);
          if (!match) return { error: `Invalid dependency ${token}. Use WBS, WBSFS, WBSSS+4h, or WBSFF-1d.` };
          const [, code, rawType, rawLag] = match;
          const pred = byCode.get(code);
          if (!pred) return { error: `Unknown predecessor WBS ${code}` };
          if (pred.id === task.id) return { error: "A task cannot depend on itself" };
          ids.push(pred.id);
          const type = String(rawType || "FS").toUpperCase();
          const lag_hours = rawLag
            ? Number(rawLag.slice(0, -1)) * (rawLag.toLowerCase().endsWith("d") ? workingHoursPerDay() : 1)
            : 0;
          specs.push({ predecessor_id: pred.id, type, lag_hours });
        }
        const cycle = this.hasCircularDependency(task.id, ids, tasks);
        if (cycle.circular) return { error: `Circular dependency: ${cycle.path}` };
        return { ids, specs, display: specs.map(spec => formatDependency(spec, new Map(tasks.map(t => [t.id, t])))).join(",") };
      },
      hasCircularDependency(taskId, newPredecessorIds, tasks) {
        const graph = new Map(tasks.map(t => [t.id, splitCsv(t.predecessor_ids).map(Number)]));
        graph.set(taskId, newPredecessorIds.map(Number));
        const visited = new Set();
        const stack = [];
        const visit = id => {
          if (stack.includes(id)) {
            const path = [...stack.slice(stack.indexOf(id)), id]
              .map(pathId => tasks.find(t => t.id === pathId)?.wbs_code || String(pathId))
              .join(" -> ");
            return { circular: true, path };
          }
          if (visited.has(id)) return { circular: false, path: "" };
          visited.add(id);
          stack.push(id);
          for (const predId of graph.get(id) || []) {
            const result = visit(predId);
            if (result.circular) return result;
          }
          stack.pop();
          return { circular: false, path: "" };
        };
        return visit(taskId);
      }
    };
