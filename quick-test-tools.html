<!DOCTYPE html>
<html>
<head>
  <title>Quick Tools Menu Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .test-panel {
      background: #f8f9fa;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .test-panel h2 {
      margin-top: 0;
      color: #0066cc;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #0052a3;
    }
    .success {
      color: #28a745;
      font-weight: bold;
    }
    .error {
      color: #dc3545;
      font-weight: bold;
    }
    #result {
      white-space: pre-wrap;
      font-family: monospace;
      background: white;
      padding: 15px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      margin-top: 15px;
    }
    iframe {
      width: 100%;
      height: 700px;
      border: 2px solid #dee2e6;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="test-panel">
    <h2>🔧 NovaPlan Tools Menu Test</h2>
    <p>This page tests if all Tools menu items are visible.</p>
    <button onclick="runTest()">▶️ Run Test</button>
    <button onclick="openToolsMenu()">🔍 Open Tools Menu (Manual Check)</button>
    <button onclick="location.reload()">🔄 Reload</button>
    <div id="result"></div>
  </div>

  <iframe id="app" src="NovaPlan.html"></iframe>

  <script>
    function getAppDoc() {
      const iframe = document.getElementById('app');
      return iframe.contentDocument || iframe.contentWindow.document;
    }

    function openToolsMenu() {
      try {
        const doc = getAppDoc();
        const toolsBtn = doc.getElementById('tools-menu-btn');
        if (toolsBtn) {
          toolsBtn.click();
          document.getElementById('result').textContent = '✅ Tools menu opened! Check the iframe below to see all menu items.';
        } else {
          document.getElementById('result').textContent = '❌ Could not find Tools button. App may still be loading.';
        }
      } catch (e) {
        document.getElementById('result').textContent = '❌ Error: ' + e.message;
      }
    }

    function runTest() {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Running test...\n';

      try {
        const doc = getAppDoc();

        // Check if app is loaded
        const loadingOverlay = doc.getElementById('loading-overlay');
        if (loadingOverlay && window.getComputedStyle(loadingOverlay).display !== 'none') {
          resultDiv.textContent = '⏳ App is still loading. Please wait 5-10 seconds and try again.';
          return;
        }

        // Click Tools button
        const toolsBtn = doc.getElementById('tools-menu-btn');
        if (!toolsBtn) {
          resultDiv.textContent = '❌ ERROR: Tools button not found!';
          return;
        }

        // Check if button is disabled
        if (toolsBtn.disabled) {
          resultDiv.textContent = '❌ ERROR: Tools button is disabled. Try switching to Split view first.';
          return;
        }

        toolsBtn.click();

        // Wait a moment for menu to render
        setTimeout(() => {
          const toolsMenu = doc.getElementById('tools-menu');
          if (!toolsMenu) {
            resultDiv.textContent = '❌ ERROR: Tools menu element not found!';
            return;
          }

          const menuPanel = toolsMenu.querySelector('.menu-panel');
          const allButtons = menuPanel.querySelectorAll('[data-tool]');

          let report = '=== TOOLS MENU TEST RESULTS ===\n\n';
          report += `Total menu items defined: ${allButtons.length}\n\n`;

          const expectedItems = [
            'calendar', 'gantt-labels', 'gantt-lines', 'choose-columns',
            'set-baseline', 'view-baseline', 'clear-baseline', 'add-sprint',
            'save-view', 'save-scenario', 'compare-scenario', 'add-raid',
            'log-change', 'integrations', 'custom-fields', 'conditional-formatting',
            'reset-db'
          ];

          let visibleCount = 0;
          let hiddenCount = 0;
          const visibleItems = [];
          const hiddenItems = [];

          allButtons.forEach(btn => {
            const tool = btn.dataset.tool;
            const display = window.getComputedStyle(btn).display;
            const text = btn.textContent.trim();

            if (display !== 'none') {
              visibleCount++;
              visibleItems.push(`  ✅ ${text} (${tool})`);
            } else {
              hiddenCount++;
              hiddenItems.push(`  ⚠️ ${text} (${tool})`);
            }
          });

          report += `Visible: ${visibleCount}\n`;
          report += `Hidden: ${hiddenCount}\n\n`;

          if (visibleItems.length > 0) {
            report += 'VISIBLE ITEMS:\n' + visibleItems.join('\n') + '\n\n';
          }

          if (hiddenItems.length > 0) {
            report += 'HIDDEN ITEMS (view-specific):\n' + hiddenItems.join('\n') + '\n\n';
          }

          // Check for missing items
          const foundTools = Array.from(allButtons).map(b => b.dataset.tool);
          const missing = expectedItems.filter(item => !foundTools.includes(item));

          if (missing.length > 0) {
            report += '❌ MISSING ITEMS:\n';
            missing.forEach(item => report += `  - ${item}\n`);
            report += '\n';
          }

          // Check menu panel scrollability
          const panelStyle = window.getComputedStyle(menuPanel);
          report += '=== MENU PANEL PROPERTIES ===\n';
          report += `Max Height: ${panelStyle.maxHeight}\n`;
          report += `Overflow-Y: ${panelStyle.overflowY}\n`;
          report += `Actual Height: ${menuPanel.offsetHeight}px\n`;
          report += `Scroll Height: ${menuPanel.scrollHeight}px\n`;
          report += `Is Scrollable: ${menuPanel.scrollHeight > menuPanel.offsetHeight ? 'YES ✅' : 'NO'}\n\n`;

          // Final verdict
          if (visibleCount >= 14) {  // At least 14 items should be visible (17 total - 3 gantt-specific)
            report += '✅ TEST PASSED! Most menu items are visible.\n';
            if (hiddenCount > 0) {
              report += `   (${hiddenCount} items hidden based on current view mode - this is expected)`;
            }
          } else {
            report += `❌ TEST FAILED! Only ${visibleCount} items visible. Expected at least 14.\n`;
          }

          resultDiv.textContent = report;

          // Close menu
          toolsBtn.click();
        }, 200);

      } catch (e) {
        resultDiv.textContent = '❌ ERROR: ' + e.message + '\n\n' + e.stack;
      }
    }

    // Auto-run test when iframe loads
    window.addEventListener('load', () => {
      const iframe = document.getElementById('app');
      iframe.addEventListener('load', () => {
        setTimeout(() => {
          const doc = getAppDoc();
          const loadingOverlay = doc.getElementById('loading-overlay');
          if (loadingOverlay) {
            const checkLoaded = setInterval(() => {
              if (window.getComputedStyle(loadingOverlay).display === 'none') {
                clearInterval(checkLoaded);
                document.getElementById('result').textContent = '✅ App loaded! Click "Run Test" to check the Tools menu.';
              }
            }, 500);
          }
        }, 1000);
      });
    });
  </script>
</body>
</html>
